      // 横幅: マスピッタリ16px (x+0 .. x+15)
      // 高さ: 上の鉄骨下端(yTop+6)に届かない yTop+8 .. yTop+31 (高さ24px)

      // 1. 天板トップ（木箱上縁、左右角を1px面取り）
      ctx.fillStyle = "#dc9850";
      ctx.fillRect(x + 2, yTop + 8, 12, 1);
      ctx.fillStyle = "#7a481e";
      ctx.fillRect(x + 1, yTop + 8, 1, 1);
      ctx.fillRect(x + 14, yTop + 8, 1, 1);

      // 2. 上部木枠 (yTop+9 .. yTop+10)
      ctx.fillStyle = "#7a481e";
      ctx.fillRect(x, yTop + 9, 1, 1);
      ctx.fillStyle = "#b47234";
      ctx.fillRect(x + 1, yTop + 9, 14, 1);
      ctx.fillStyle = "#9c5e28";
      ctx.fillRect(x + 5, yTop + 9, 4, 1); // 木目
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x + 2, yTop + 9, 1, 1); // 釘
      ctx.fillRect(x + 13, yTop + 9, 1, 1);
      ctx.fillRect(x + 15, yTop + 9, 1, 1);

      ctx.fillStyle = "#7a481e";
      ctx.fillRect(x, yTop + 10, 1, 1);
      ctx.fillStyle = "#c88440";
      ctx.fillRect(x + 1, yTop + 10, 1, 1);
      ctx.fillStyle = "#5a3314";
      ctx.fillRect(x + 2, yTop + 10, 12, 1); // 上板の裏影
      ctx.fillStyle = "#8c5424";
      ctx.fillRect(x + 14, yTop + 10, 1, 1);
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x + 15, yTop + 10, 1, 1);

      // 3. 左右の木柱＋中央の剥き出しラック空間 (yTop+11 .. yTop+24)
      for (let dy = 11; dy <= 24; dy++) {
        ctx.fillStyle = "#7a481e";
        ctx.fillRect(x, yTop + dy, 1, 1);
        ctx.fillStyle = (dy === 14 || dy === 20) ? "#a4642a" : "#c88440";
        ctx.fillRect(x + 1, yTop + dy, 1, 1);
        ctx.fillStyle = "#141922";
        ctx.fillRect(x + 2, yTop + dy, 12, 1);
        ctx.fillStyle = (dy === 16 || dy === 22) ? "#7a481e" : "#8c5424";
        ctx.fillRect(x + 14, yTop + dy, 1, 1);
        ctx.fillStyle = "#42240e";
        ctx.fillRect(x + 15, yTop + dy, 1, 1);
      }

      // 木枠上隅の当て木
      ctx.fillStyle = "#8c5424";
      ctx.fillRect(x + 2, yTop + 11, 1, 1);
      ctx.fillRect(x + 13, yTop + 11, 1, 1);

      // 剥き出しラック支柱レール（左右の穴あき金属柱 x+2, x+13）
      for (let dy = 12; dy <= 24; dy++) {
        const isHole = (dy & 1) === 1;
        ctx.fillStyle = isHole ? "#252d3a" : "#8c9cb0";
        ctx.fillRect(x + 2, yTop + dy, 1, 1);
        ctx.fillRect(x + 13, yTop + dy, 1, 1);
      }

      // ラック1段目：サーバーユニット (yTop+12 .. yTop+15)
      ctx.fillStyle = "#58667a";
      ctx.fillRect(x + 3, yTop + 12, 10, 1);
      ctx.fillStyle = "#a4b4c8";
      ctx.fillRect(x + 3, yTop + 12, 1, 1);
      ctx.fillRect(x + 12, yTop + 12, 1, 1);

      ctx.fillStyle = "#2e3746";
      ctx.fillRect(x + 3, yTop + 13, 10, 1);
      ctx.fillStyle = "#141922";
      ctx.fillRect(x + 4, yTop + 13, 1, 1);
      ctx.fillRect(x + 6, yTop + 13, 1, 1);
      ctx.fillStyle = "#38d078";
      ctx.fillRect(x + 10, yTop + 13, 1, 1);
      ctx.fillStyle = "#e04838";
      ctx.fillRect(x + 11, yTop + 13, 1, 1);

      ctx.fillStyle = "#242c38";
      ctx.fillRect(x + 3, yTop + 14, 10, 1);
      ctx.fillStyle = "#3b4658";
      ctx.fillRect(x + 3, yTop + 15, 10, 1);
      ctx.fillStyle = "#3898e0";
      ctx.fillRect(x + 8, yTop + 13, 1, 3); // 剥き出し青ケーブル

      // ラック2段目：中身・基板・ヒートシンク剥き出し棚 (yTop+16 .. yTop+19)
      ctx.fillStyle = "#d88838";
      ctx.fillRect(x + 4, yTop + 16, 1, 1); // 銅配線
      ctx.fillStyle = "#3898e0";
      ctx.fillRect(x + 9, yTop + 16, 1, 1); // 青配線

      ctx.fillStyle = "#343e4f";
      ctx.fillRect(x + 3, yTop + 17, 10, 1);
      ctx.fillStyle = "#9aaac0";
      ctx.fillRect(x + 4, yTop + 17, 1, 1); // ヒートシンクフィン
      ctx.fillRect(x + 6, yTop + 17, 1, 1);
      ctx.fillStyle = "#d88838";
      ctx.fillRect(x + 8, yTop + 17, 2, 1); // 銅パーツ
      ctx.fillStyle = "#4ca8ec";
      ctx.fillRect(x + 11, yTop + 17, 1, 1); // 青端子

      ctx.fillStyle = "#68788e";
      ctx.fillRect(x + 3, yTop + 18, 10, 1);
      ctx.fillStyle = "#a4b4c8";
      ctx.fillRect(x + 3, yTop + 18, 1, 1);
      ctx.fillRect(x + 12, yTop + 18, 1, 1);

      ctx.fillStyle = "#c4742c";
      ctx.fillRect(x + 5, yTop + 19, 1, 1); // 垂れた配線

      // ラック3段目：下部サーバー電源／ストレージBOX (yTop+20 .. yTop+24)
      ctx.fillStyle = "#8494a8";
      ctx.fillRect(x + 3, yTop + 20, 10, 1);
      ctx.fillStyle = "#343e50";
      ctx.fillRect(x + 3, yTop + 21, 10, 3);
      ctx.fillStyle = "#181e28";
      ctx.fillRect(x + 4, yTop + 22, 4, 1); // 吸気口
      ctx.fillStyle = "#a4b4c8";
      ctx.fillRect(x + 9, yTop + 22, 3, 1); // 金属取っ手
      ctx.fillStyle = "#e07828";
      ctx.fillRect(x + 11, yTop + 21, 1, 1); // 電源スイッチ

      // 4. 下部木箱板 (yTop+25 .. yTop+31)
      // 木箱前板の上縁ハイライト
      ctx.fillStyle = "#7a481e";
      ctx.fillRect(x, yTop + 25, 1, 1);
      ctx.fillStyle = "#dc9850";
      ctx.fillRect(x + 1, yTop + 25, 14, 1);
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x + 15, yTop + 25, 1, 1);

      // 木板1段目
      ctx.fillStyle = "#7a481e";
      ctx.fillRect(x, yTop + 26, 1, 2);
      ctx.fillStyle = "#b47234";
      ctx.fillRect(x + 1, yTop + 26, 14, 2);
      ctx.fillStyle = "#985b26";
      ctx.fillRect(x + 4, yTop + 26, 6, 1);
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x + 2, yTop + 26, 1, 1);
      ctx.fillRect(x + 13, yTop + 26, 1, 1);
      ctx.fillRect(x + 15, yTop + 26, 1, 2);

      // 板の合わせ目溝
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x, yTop + 28, 16, 1);

      // 木板2段目
      ctx.fillStyle = "#6e3f18";
      ctx.fillRect(x, yTop + 29, 1, 2);
      ctx.fillStyle = "#9c6028";
      ctx.fillRect(x + 1, yTop + 29, 14, 2);
      ctx.fillStyle = "#b47234";
      ctx.fillRect(x + 3, yTop + 29, 4, 1);
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x + 2, yTop + 30, 1, 1);
      ctx.fillRect(x + 13, yTop + 30, 1, 1);
      ctx.fillStyle = "#381d0a";
      ctx.fillRect(x + 15, yTop + 29, 1, 2);

      // 接地下端・底枠影
      ctx.fillStyle = "#2b1708";
      ctx.fillRect(x, yTop + 31, 1, 1);
      ctx.fillRect(x + 15, yTop + 31, 1, 1);
      ctx.fillStyle = "#42240e";
      ctx.fillRect(x + 1, yTop + 31, 3, 1);
      ctx.fillRect(x + 12, yTop + 31, 3, 1);
      ctx.fillStyle = "#5e3616";
      ctx.fillRect(x + 4, yTop + 31, 8, 1);
    },

    drawSandLadder(ctx, x, yTop, frame) {
      ctx.save();
      // 半透明の砂色ハシゴ本体（左右柱 x+1 / x+13）
      ctx.globalAlpha = 0.48;
      ctx.fillStyle = "#9c7e48";
      ctx.fillRect(x + 1, yTop, 2, 32);
      ctx.fillRect(x + 13, yTop, 2, 32);
      const step = Math.max(1, LADDER_STEP);
      for (let ry = 1; ry < 32; ry += step) {
        if (LADDER_BAR_HEIGHT > 0) {
          ctx.fillStyle = "#d8bc7c";
          ctx.fillRect(x + 2, yTop + ry, 12, LADDER_BAR_HEIGHT);
        }
        if (LADDER_SHADOW_HEIGHT > 0) {
          ctx.fillStyle = "#846838";
          ctx.fillRect(x + 2, yTop + ry + LADDER_BAR_HEIGHT, 12, LADDER_SHADOW_HEIGHT);
        }
      }

      // ハシゴ幅（x+1 .. x+14）から絶対にはみ出ない控えめな砂嵐エフェクト
      ctx.beginPath();
      ctx.rect(x + 1, yTop, 14, 32);
      ctx.clip();
      const f = Math.max(0, frame | 0);
      const rows = [
        { y: 5, speed: 1, len: 3, off: 0, alpha: 0.28 },
        { y: 13, speed: 2, len: 2, off: 6, alpha: 0.24 },
        { y: 21, speed: 1, len: 3, off: 10, alpha: 0.30 },
        { y: 29, speed: 2, len: 2, off: 3, alpha: 0.24 }
      ];
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const px = (f * r.speed + r.off) % 14;
        ctx.globalAlpha = r.alpha;
        ctx.fillStyle = (i & 1) ? "#dfc88e" : "#cbb074";
        for (let dx = 0; dx < r.len; dx++) {
          const sx = x + 1 + ((13 - ((px + dx) % 14) + 14) % 14);
          ctx.fillRect(sx, yTop + r.y, 1, 1);
        }
      }
      ctx.restore();
    },

    drawCrumblingLadder(ctx, x, yTop, stage, frame) {
      const blink = ((frame >> 1) & 1) === 0;
      const sideColor = stage <= 2 && blink ? "#ffd0e0" : "#b84468";
      const rungColor = stage <= 2 && blink ? "#ffffff" : "#ff88a8";
      const rungShadow = stage <= 2 && blink ? "#e0a0b8" : "#a8385c";

      if (stage >= 4) {
        ctx.fillStyle = sideColor;
        ctx.fillRect(x + 1, yTop + 1, 2, 30);
        ctx.fillRect(x + 13, yTop + 1, 2, 30);
        const step = Math.max(1, LADDER_STEP);
        for (let ry = 1; ry < 32; ry += step) {
          if (LADDER_BAR_HEIGHT > 0) {
            ctx.fillStyle = rungColor;
            ctx.fillRect(x + 2, yTop + ry, 5, LADDER_BAR_HEIGHT);
            ctx.fillRect(x + 9, yTop + ry, 5, LADDER_BAR_HEIGHT);
          }
          if (LADDER_SHADOW_HEIGHT > 0) {
            ctx.fillStyle = rungShadow;
            ctx.fillRect(x + 2, yTop + ry + LADDER_BAR_HEIGHT, 5, LADDER_SHADOW_HEIGHT);
            ctx.fillRect(x + 9, yTop + ry + LADDER_BAR_HEIGHT, 5, LADDER_SHADOW_HEIGHT);
          }
        }
      } else if (stage === 3) {
        ctx.fillStyle = sideColor;
        ctx.fillRect(x + 1, yTop + 3, 2, 11);
        ctx.fillRect(x + 1, yTop + 18, 2, 11);
        ctx.fillRect(x + 13, yTop + 5, 2, 11);
        ctx.fillRect(x + 13, yTop + 20, 2, 9);
        ctx.fillStyle = rungColor;
        for (let ry = 4; ry < 29; ry += 5) {
          ctx.fillRect(x + 2, yTop + ry, 4, 2);
          ctx.fillRect(x + 10, yTop + ry, 4, 2);
        }
      } else if (stage === 2) {
        ctx.fillStyle = sideColor;
        ctx.fillRect(x + 1, yTop + 6, 2, 7);
        ctx.fillRect(x + 13, yTop + 17, 2, 8);
        ctx.fillStyle = rungColor;
        ctx.fillRect(x + 2, yTop + 8, 4, 2);
        ctx.fillRect(x + 10, yTop + 19, 4, 2);
        ctx.fillRect(x + 6, yTop + 13, 4, 2);
      } else {
        ctx.fillStyle = rungColor;
        ctx.fillRect(x + 2, yTop + 7, 2, 3);
        ctx.fillRect(x + 12, yTop + 14, 2, 3);
        ctx.fillRect(x + 5, yTop + 22, 3, 2);
      }
    },

    drawPillar(ctx, x, yTop) {
      // 上下フランジ＋中央I字ビーム鉄柱（背景扱いで素通り可）
      ctx.fillStyle = "#526074";
      ctx.fillRect(x + 2, yTop, 12, 4);
      ctx.fillRect(x + 2, yTop + 28, 12, 4);
      ctx.fillStyle = "#98acc4";
      ctx.fillRect(x + 2, yTop + 1, 12, 1);
      ctx.fillRect(x + 2, yTop + 29, 12, 1);

      ctx.fillStyle = "#485468";
      ctx.fillRect(x + 5, yTop + 4, 6, 24);
      ctx.fillStyle = "#7a8da6";
      ctx.fillRect(x + 6, yTop + 4, 4, 24);
      ctx.fillStyle = "#b4c8e0";
      ctx.fillRect(x + 7, yTop + 4, 1, 24);

      // リベット・継手
      ctx.fillStyle = "#262e3c";
      ctx.fillRect(x + 3, yTop + 1, 2, 2);
      ctx.fillRect(x + 11, yTop + 1, 2, 2);
      ctx.fillRect(x + 3, yTop + 29, 2, 2);
      ctx.fillRect(x + 11, yTop + 29, 2, 2);
      ctx.fillRect(x + 5, yTop + 15, 6, 2);
    },

    drawPillarCrumbling(ctx, x, yTop, stage, frame) {
      const blink = ((frame >> 1) & 1) === 0;
      const h = Math.max(4, stage * 5);
      const offsetY = 32 - h;
      ctx.fillStyle = stage <= 2 && blink ? "#d8e6f8" : "#627288";
      ctx.fillRect(x + 5, yTop + offsetY, 6, h);
      ctx.fillStyle = blink ? "#ffffff" : "#98acc4";
      ctx.fillRect(x + 6, yTop + offsetY, 2, Math.max(2, h - 2));
      ctx.fillStyle = "#404c5c";
      ctx.fillRect(x + 2, yTop + 28, 12, 4);
    },

    drawDoor(ctx, x, yTop, tile, frame) {
      const base = tile & 0xf7;
      let panelW = 6; // 閉じた状態: 左右各6px
      let lampColor = "#2c4c50";

      if (base === TILE.DOOR_OPENING_1 || base === TILE.DOOR_CLOSING_2) {
        panelW = 4;
        if (base === TILE.DOOR_OPENING_1) {
          lampColor = (tile & 0x08) ? "#ff7840" : "#b8ffff";
        } else {
          lampColor = "#f0c048";
        }
      } else if (base === TILE.DOOR_OPENING_2 || base === TILE.DOOR_CLOSING_1) {
        panelW = 2;
        if (base === TILE.DOOR_OPENING_2) {
          lampColor = (tile & 0x08) ? "#ff7840" : "#b8ffff";
        } else {
          lampColor = "#f0c048";
        }
      } else if (base === TILE.DOOR_OPEN) {
        panelW = 0;
        lampColor = "#48f078";
      }

      // 上の足場(yTop+0..5)に食い込まず1pxの隙間を空けた高さ25px設計（yTop+7..31）
      const doorTop = yTop + 7;
      const panelTop = doorTop + 3; // yTop+10
      const panelH = 32 - (panelTop - yTop); // 22px

      // 外枠・自動ドア上部センサーレール（開いた開口部は塗りつぶさず透過くり抜き）
      ctx.fillStyle = "#3c8084";
      ctx.fillRect(x + 1, doorTop, 14, 3);
      ctx.fillRect(x + 1, panelTop, 1, panelH);
      ctx.fillRect(x + 14, panelTop, 1, panelH);
      ctx.fillStyle = "#6cc8c8";
      ctx.fillRect(x + 2, doorTop, 12, 1);
      ctx.fillStyle = "#245458";
      ctx.fillRect(x + 2, doorTop + 2, 12, 1);

      // センサーランプ
      ctx.fillStyle = lampColor;
      ctx.fillRect(x + 7, doorTop + 1, 2, 1);

      // 全開時の枠内側の戸袋影（中央 x+3..x+12 はくり抜きで奥が見える）
      if (panelW === 0) {
        ctx.fillStyle = "#0e1a26";
        ctx.fillRect(x + 2, panelTop, 1, panelH);
        ctx.fillRect(x + 13, panelTop, 1, panelH);
      }

      // 開け始めのダウン判定中フラッシュ縁取り
      if ((tile & 0x80) === 0 && (tile & 0x70) === 0x60 && ((frame >> 1) & 1) === 0) {
        ctx.fillStyle = (tile & 0x08) ? "rgba(255, 110, 60, 0.35)" : "rgba(140, 245, 255, 0.35)";
        ctx.fillRect(x + 2 + panelW, panelTop, 12 - panelW * 2, panelH);
      }

      // 左右両開きの自動ドアパネル
      if (panelW > 0) {
        const lx = x + 2;
        const rx = x + 14 - panelW;

        ctx.fillStyle = "#3c8c8c";
        ctx.fillRect(lx, panelTop, panelW, panelH);
        ctx.fillRect(rx, panelTop, panelW, panelH);

        ctx.fillStyle = "#68c8c4";
        ctx.fillRect(lx, panelTop + 1, Math.max(1, panelW - 1), panelH - 2);
        ctx.fillRect(rx + 1, panelTop + 1, Math.max(1, panelW - 1), panelH - 2);

        // 扉の小窓・中央パッキン
        if (panelW >= 4) {
          const winTop = panelTop + 3;
          ctx.fillStyle = "#162d38";
          ctx.fillRect(lx + 1, winTop, panelW - 2, 6);
          ctx.fillRect(rx + 1, winTop, panelW - 2, 6);
          ctx.fillStyle = "#a8f0f0";
          ctx.fillRect(lx + 1, winTop, 1, 2);
          ctx.fillRect(rx + 1, winTop, 1, 2);
        }
        ctx.fillStyle = "#1c3c40";
        ctx.fillRect(lx + panelW - 1, panelTop, 1, panelH);
        ctx.fillRect(rx, panelTop, 1, panelH);
      }
    },

    drawBreakableWall(ctx, x, yTop, tile, frame) {
      const hp = tile & 0x07;
      const group = tile & 0x70; // 0x40=1回壁, 0x10=2回壁, 0x20=3回壁

      if (group === 0x40) {
        // 1回壊せる壁（木箱の中身剥き出しラック）
        this.drawCrateRackWall(ctx, x, yTop);
      } else if (group === 0x10) {
        // 新2回壊せる壁（シルバーのサーバー本体・ツヤなし・1回殴りで大破損）
        this.drawServerWall(ctx, x, yTop, hp);
      } else {
        // 新3回壊せる壁（黒目の硬質ステンレスパネル・10秒ツヤあり・2段階破損）
        this.drawDarkStainlessWall(ctx, x, yTop, hp, frame);
      }
    },

    drawDrum(ctx, x, yTop, trappedActor) {
      // 天板（yTop+6..+11）+ 円筒胴体（yTop+11..+32）：天板に乗った時の足元 yTop+11 と一致
      ctx.fillStyle = "#6c1c18";
      ctx.fillRect(x + 1, yTop + 6, 14, 5);
      ctx.fillStyle = "#c84838";
      ctx.fillRect(x + 2, yTop + 7, 12, 3);
      ctx.fillStyle = "#ee8868";
      ctx.fillRect(x + 3, yTop + 7, 6, 1);

      ctx.fillStyle = "#982820";
      ctx.fillRect(x + 1, yTop + 11, 14, 21);
      ctx.fillStyle = "#d04434";
      ctx.fillRect(x + 3, yTop + 11, 8, 21);
      ctx.fillStyle = "#f07c64";
      ctx.fillRect(x + 4, yTop + 11, 2, 21);

      // ドラム缶の補強リブ2本
      ctx.fillStyle = "#4c1410";
      ctx.fillRect(x + 1, yTop + 17, 14, 2);
      ctx.fillRect(x + 1, yTop + 25, 14, 2);
      ctx.fillStyle = "#e8a858";
      ctx.fillRect(x + 3, yTop + 17, 8, 1);
      ctx.fillRect(x + 3, yTop + 25, 8, 1);

      // 閉じ込められたキャラの顔＋汚れた手書き風赤い❌（ドラムの丸みに沿って歪曲）
      if (trappedActor) {
        const kind = getTrappedActorKind(trappedActor);
        const overlay = this.getTrappedDrumSprite(kind);
        if (overlay) {
          ctx.drawImage(overlay, x, yTop + 11);
        }
      }
    },

    drawBomb(ctx, x, yTop, frame) {
      // 導火線と点滅火花（形と幅を維持しつつ明るく見やすく）
      ctx.fillStyle = "#d89c48";
      ctx.fillRect(x + 7, yTop + 9, 2, 4);
      ctx.fillStyle = "#f4ca78";
      ctx.fillRect(x + 7, yTop + 9, 1, 4);

      const sparkOn = ((frame >> 2) & 1) === 0;
      ctx.fillStyle = sparkOn ? "#fff058" : "#ff5820";
      ctx.fillRect(x + 8, yTop + 6, 3, 3);
      ctx.fillStyle = sparkOn ? "#ffffff" : "#ffb838";
      ctx.fillRect(x + 9, yTop + 7, 1, 1);

      // 口金（明るい真鍮色で輪郭くっきり）
      ctx.fillStyle = "#b88230";
      ctx.fillRect(x + 5, yTop + 13, 6, 2);
      ctx.fillStyle = "#ffe084";
      ctx.fillRect(x + 5, yTop + 13, 4, 1);
      ctx.fillStyle = "#7a521c";
      ctx.fillRect(x + 9, yTop + 14, 2, 1);

      // 爆弾本体（元の丸型シルエット・幅そのまま、暗背景から浮かぶ青鉄色）
      ctx.fillStyle = "#4c5c7a";
      ctx.fillRect(x + 3, yTop + 15, 10, 15);
      ctx.fillRect(x + 2, yTop + 17, 12, 11);

      // 内側の丸い金属球体グラデーション
      ctx.fillStyle = "#627696";
      ctx.fillRect(x + 3, yTop + 16, 9, 12);
      ctx.fillRect(x + 4, yTop + 16, 7, 13);

      // 光が当たる左上〜中央の明面
      ctx.fillStyle = "#869ec4";
      ctx.fillRect(x + 4, yTop + 17, 6, 7);
      ctx.fillRect(x + 4, yTop + 16, 5, 6);

      // 左上外周の明るいリムハイライト
      ctx.fillStyle = "#9ab2d6";
      ctx.fillRect(x + 3, yTop + 15, 2, 1);
      ctx.fillRect(x + 3, yTop + 16, 1, 1);
      ctx.fillRect(x + 2, yTop + 17, 1, 8);

      // ツヤの白銀ハイライト
      ctx.fillStyle = "#e6f2ff";
      ctx.fillRect(x + 4, yTop + 17, 3, 3);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x + 4, yTop + 18, 2, 1);
      ctx.fillRect(x + 5, yTop + 17, 1, 1);

      // 危険・爆発マーク（見やすい赤＋黄芯）
      ctx.fillStyle = "#ff3828";

    getPlayerLadderVisual(slot) {
      const s = slot.state;
      const y = slot.y;
      const topY = slot.topY;
      const prom = slot.prom;
      const n = slot.n;
      const kind = slot.kind;
      const d = slot.dir;

      let vy = y;
      let isHold = false;

      if (s === 3) {
        if (kind === "enter") {
          if (n <= 4) {
            vy = y;
            isHold = true;
          } else {
            vy = topY + 31;
          }
        } else if (kind === "arrive") {
          vy = y;
          isHold = true;
        } else if (kind === "enter_top") {
          if (n <= 3) {
            vy = topY;
            isHold = true;
          } else if (n <= 7) {
            vy = topY + 3;
          } else {
            vy = topY + 7;
          }
        } else if (kind === "arrive_top") {
          if (n <= 3) {
            vy = topY + 7;
          } else if (n <= 8) {
            vy = topY + 3;
          } else {
            vy = topY;
            isHold = true;
          }
        }
      } else if (s === 6) {
        if (kind === "enter_top_cont") {
          if (n <= 5) {
            vy = topY;
            isHold = true;
          } else if (n <= 10) {
            vy = topY + 3;
          } else {
            vy = topY + 7;
          }
        } else if (kind === "cont") {
          if (d & DOWN) {
            if (n <= 1) vy = y - 1;
            else if (n <= 6) vy = y + 3;
            else vy = y + 7;
          } else {
            if (n <= 3) vy = y + 7;
            else if (n <= 9) vy = y + 3;
            else vy = y - 1;
          }
        }
      } else if (s === 2) {
        if (prom === 31 && y === topY) {
          vy = topY + 7;
        } else if (prom === 1 && y === topY + 32) {
          vy = topY + 31;
        } else if ((d & UP) && prom >= 30) {
          vy = topY + 7;
        } else {
          vy = y;
        }
      }

      if (isHold) {
        return { vy, pose: "climbHold" };
      }
      const stepIndex = Math.round((vy - 3) / 4);
      return { vy, pose: (stepIndex & 1) ? "climbR" : "climbL" };
    },

    drawPlayerBackHammer(baseX, drawY, facingDir, mode) {
      const ctx = this.ctx;
      const isLeft = (facingDir & LEFT) !== 0;

      if (mode === "back") {
        // 後ろ姿（はしご中）：背中のバックパックに斜めに刺さっている
        const hx = isLeft ? baseX + 1 : baseX + 10;
        const hy = drawY + 4;
        ctx.fillStyle = "#8c5420";
        for (let i = 0; i < 9; i++) {
          const px = isLeft ? (baseX + 4 + i * 0.7) : (baseX + 11 - i * 0.7);
          ctx.fillRect(Math.round(px), drawY + 7 + i, 1, 2);
        }
        ctx.fillStyle = "#d48e44";
        for (let i = 0; i < 7; i++) {
          const px = isLeft ? (baseX + 4 + i * 0.7) : (baseX + 11 - i * 0.7);
          ctx.fillRect(Math.round(px), drawY + 7 + i, 1, 1);
        }
        ctx.fillStyle = "#48546a";
        ctx.fillRect(hx, hy, 5, 4);
        ctx.fillStyle = "#aebcd0";
        ctx.fillRect(hx + 1, hy + 1, 3, 2);
        return;
      }

      // 横向き（待機・歩行・落下など）：背中バックパックの上後ろに刺さっている
      const headX = isLeft ? baseX + 12 : baseX - 1;
      const headY = drawY + 3;
      const gripStartX = isLeft ? baseX + 13 : baseX + 2;
      const gripDir = isLeft ? -1 : 1;

      ctx.fillStyle = "#8c5420";
      ctx.fillRect(gripStartX, drawY + 7, 2, 3);
      ctx.fillRect(gripStartX + gripDir, drawY + 10, 2, 4);
      ctx.fillStyle = "#d48e44";
      ctx.fillRect(gripStartX, drawY + 7, 1, 3);
      ctx.fillRect(gripStartX + gripDir, drawY + 10, 1, 3);

      ctx.fillStyle = "#48546a";
      ctx.fillRect(headX, headY, 5, 4);
      ctx.fillStyle = "#c2d0e4";
      ctx.fillRect(headX + (isLeft ? 1 : 0), headY + 1, 4, 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(headX + (isLeft ? 2 : 1), headY + 1, 2, 1);
    },

    getPlayerHammerPhaseInfo(slot) {
      const t = slot.hammerTimer;
      if (slot.isGolden) {
        if (t <= 1) return { phase: "pull", pose: "hammerPull", behind: false };
        if (t <= 2) return { phase: "up", pose: "hammerUp", behind: false };
        if (t <= 4) return { phase: "swing", pose: "hammerSwing", behind: true };
        if (t <= 5) return { phase: "hit", pose: "hammerHit", behind: true };
        return { phase: "return", pose: "hammerPull", behind: false };
      }
      if (t <= 3) return { phase: "pull", pose: "hammerPull", behind: false };
      if (t <= 10) return { phase: "up", pose: "hammerUp", behind: false };
      if (t <= 15) return { phase: "swing", pose: "hammerSwing", behind: true };
      if (t <= 18) return { phase: "hit", pose: "hammerHit", behind: true };
      return { phase: "return", pose: "hammerPull", behind: false };
    },

    drawPlayerActiveHammer(slot, baseX, drawY, phase) {
      const ctx = this.ctx;
      const faceVal = slot.facing || slot.dir;
      const isLeft = (faceVal & LEFT) !== 0;
      const headMain = slot.isGolden ? "#ffe042" : "#aebcd0";
      const headDark = slot.isGolden ? "#a87010" : "#48546a";
      const headHi = slot.isGolden ? "#ffffff" : "#e8f2ff";
      const grip = "#d48e44";
      const gripDark = "#8c5420";

      if (phase === "pull" || phase === "return") {
        const hx = isLeft ? baseX + 12 : baseX - 3;
        const hy = drawY + 1;
        ctx.fillStyle = gripDark;
        ctx.fillRect(isLeft ? baseX + 12 : baseX + 2, drawY + 5, 2, 7);
        ctx.fillStyle = grip;
        ctx.fillRect(isLeft ? baseX + 12 : baseX + 2, drawY + 5, 1, 6);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 7, 5);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 5, 3);
        return;
      }

      if (phase === "up") {
        const hx = baseX + 3;
        const hy = drawY - 8;
        ctx.fillStyle = gripDark;
        ctx.fillRect(baseX + 7, drawY - 3, 2, 7);
        ctx.fillStyle = grip;
        ctx.fillRect(baseX + 7, drawY - 3, 1, 6);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 10, 6);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 8, 4);
        ctx.fillStyle = headHi;
        ctx.fillRect(hx + 2, hy + 1, 6, 1);
        return;
      }

      if (phase === "swing") {
        const hx = baseX + 4;
        const hy = drawY - 4;
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        ctx.fillRect(baseX + 6, drawY - 10, 4, 2);
        ctx.fillRect(baseX + 5, drawY - 7, 6, 3);
        ctx.fillStyle = gripDark;
        ctx.fillRect(baseX + 7, drawY, 2, 8);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 8, 5);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 6, 3);
        return;
      }

      const hx = baseX + 4;
      const hy = drawY - 1;
      ctx.fillStyle = gripDark;
      ctx.fillRect(baseX + 7, drawY + 2, 2, 9);
      ctx.fillStyle = headDark;
      ctx.fillRect(hx, hy, 8, 5);
      ctx.fillStyle = headMain;
      ctx.fillRect(hx + 1, hy + 1, 6, 3);
      ctx.fillStyle = headHi;
      ctx.fillRect(hx + 2, hy + 2, 4, 1);

      if (slot.hammerTimer >= (slot.isGolden ? 5 : 17)) {
        ctx.fillStyle = "#fff480";
        ctx.fillRect(baseX + 2, drawY - 3, 2, 2);
        ctx.fillRect(baseX + 12, drawY - 3, 2, 2);
        ctx.fillRect(baseX + 7, drawY - 4, 2, 2);
      }
    },

    drawPlayerAt(slot, baseX, baseDrawY, world) {
      if (!this.playerSprites) return;
      const sprites = this.playerSprites;
      const ctx = this.ctx;
      const faceVal = slot.facing || slot.dir;
      const facing = (faceVal & LEFT) ? "L" : "R";

      if (world && world.heroDead) {
       const img = sprites.deadFall_R || sprites["idle_" + facing];
        if (!img) return;
        ctx.drawImage(img, baseX, baseDrawY);
        return;
      }

if (slot.state === 15 || slot.state === 16) {
        return;
      }

      if (slot.state === 10) {
        const img = sprites["fall_" + facing] || sprites["idle_" + facing];
        if (!img) return;
        ctx.save();
        ctx.translate(baseX, baseDrawY + 26);
        ctx.scale(1, -1);
        ctx.drawImage(img, 0, 0);
        this.drawPlayerBackHammer(0, 0, faceVal, "side");
        ctx.restore();
        return;
      }

      if (slot.state === 11) {
        const st = slot.stunTimer != null ? slot.stunTimer : 0;
        let poseKey = "recover1";
        let hammerOffsetX = 0;
        let hammerOffsetY = 2;

        if (st >= 10) {
          poseKey = "sit";
          hammerOffsetX = (faceVal & LEFT) ? 1 : -1;
          hammerOffsetY = 8;
        } else if (st >= 5) {
          poseKey = "recover0";
          hammerOffsetY = 4;
        } else {
          poseKey = "recover1";
          hammerOffsetY = 2;
        }

        const img = sprites[poseKey + "_" + facing] || sprites["idle_" + facing];
        if (!img) return;
        ctx.drawImage(img, baseX, baseDrawY);
        this.drawPlayerBackHammer(baseX + hammerOffsetX, baseDrawY + hammerOffsetY, faceVal, "side");

        // 尻もち直後の着地衝撃エフェクト（最初の6F間）
        if (st >= 14) {
          const isBurst = st >= 17;
          ctx.fillStyle = "#ffffff";
          if (isBurst) {
            ctx.fillRect(baseX - 2, baseDrawY + 23, 2, 1);
            ctx.fillRect(baseX - 1, baseDrawY + 24, 2, 1);
            ctx.fillRect(baseX + 16, baseDrawY + 23, 2, 1);
            ctx.fillRect(baseX + 15, baseDrawY + 24, 2, 1);
            ctx.fillStyle = "#9ad8ff";
            ctx.fillRect(baseX - 3, baseDrawY + 22, 1, 1);
            ctx.fillRect(baseX + 18, baseDrawY + 22, 1, 1);
          } else {
            ctx.fillRect(baseX - 3, baseDrawY + 22, 1, 1);
            ctx.fillRect(baseX - 2, baseDrawY + 25, 1, 1);
            ctx.fillRect(baseX + 18, baseDrawY + 22, 1, 1);
            ctx.fillRect(baseX + 17, baseDrawY + 25, 1, 1);
          }
        }
        return;
      }

      if (slot.state === 4) {
        const hInfo = this.getPlayerHammerPhaseInfo(slot);
        const img = sprites[hInfo.pose + "_" + facing];
        if (!img) return;
        if (hInfo.behind) {
          this.drawPlayerActiveHammer(slot, baseX, baseDrawY, hInfo.phase);
        }
        ctx.drawImage(img, baseX, baseDrawY);
        if (!hInfo.behind) {
          this.drawPlayerActiveHammer(slot, baseX, baseDrawY, hInfo.phase);
        }
        return;
      }

      if (slot.state === 2 || slot.state === 3 || slot.state === 6) {
        const lad = this.getPlayerLadderVisual(slot);
        const drawY = lad.vy - 26;
        const img = sprites[lad.pose + "_R"];
        if (!img) return;
        ctx.drawImage(img, baseX, drawY);
        this.drawPlayerBackHammer(baseX, drawY, faceVal, "back");
        return;
      }

      if (slot.state === 0 && world && slot.row < world.rows - 1) {
        const curT = world.getTile(slot.row, slot.col);
        if (curT !== TILE.SAND_LADDER &&
            isSameLadderType(curT, world.getTile(slot.row + 1, slot.col))) {
          const img = sprites.climbHold_R;
          if (!img) return;

        world.hero.prevHammer = (currentBits() & HAMMER) !== 0;
        stageBadge.textContent = "STAGE " + (stageIdx + 1) + " / " + DEMO_STAGES.length;
        screenWrap.style.maxWidth = Math.max(512, world.worldWidth * 2) + "px";
        renderer.resetCamera(world);
        updateModeBars();
        renderer.draw(world);
      }

      function showTitle() {
        screenMode = "title";
        world = null;
        resetStick();
        setHammerPressed(false);
        updateModeBars();
      }

      function showEnding() {
        screenMode = "ending";
        world = null;
        resetStick();
        setHammerPressed(false);
        updateModeBars();
      }

      Array.from(document.querySelectorAll(".start-stage-btn")).forEach(btn => {
        btn.addEventListener("click", () => {
          startStage(Number(btn.dataset.stage) || 0);
          btn.blur();
        });
      });

      retryBtn.addEventListener("click", () => {
        startStage(stageIdx);
        retryBtn.blur();
      });

      toTitleBtn.addEventListener("click", () => {
        showTitle();
        toTitleBtn.blur();
      });

      replayTitleBtn.addEventListener("click", () => {
        showTitle();
        replayTitleBtn.blur();
      });

      replay1Btn.addEventListener("click", () => {
        startStage(0);
        replay1Btn.blur();
      });

      // 操作（擬似スティック・ボタン・キーボード）
      let stickBits = 0;
      let keyBits = 0;
      let hammerBtnDown = false;
      let activePointerId = null;
      const MAX_R = 40;
      const DEAD_R = 13;

      function currentBits() {
        let b = stickBits | keyBits | (hammerBtnDown ? HAMMER : 0);
        if ((b & (LEFT | RIGHT)) === (LEFT | RIGHT)) b &= ~(LEFT | RIGHT);
        if ((b & (UP | DOWN)) === (UP | DOWN)) b &= ~(UP | DOWN);
        return b;
      }

      function updateStickFromPoint(clientX, clientY) {
        const rect = stickBase.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > MAX_R) {
          dx = (dx / dist) * MAX_R;
          dy = (dy / dist) * MAX_R;
        }
        knobCanvas.style.transform = "translate(" + Math.round(dx) + "px, " + Math.round(dy) + "px)";
        if (dist < DEAD_R) stickBits = 0;
        else if (Math.abs(dx) >= Math.abs(dy)) stickBits = dx > 0 ? RIGHT : LEFT;
        else stickBits = dy > 0 ? DOWN : UP;
      }

      function resetStick() {
        activePointerId = null;
        stickBits = 0;
        knobCanvas.style.transform = "translate(0px, 0px)";
      }

      stickBase.addEventListener("pointerdown", e => {
        e.preventDefault();
        activePointerId = e.pointerId;
        if (stickBase.setPointerCapture) {
          try { stickBase.setPointerCapture(e.pointerId); } catch (_) {}
        }
        updateStickFromPoint(e.clientX, e.clientY);
      });
      stickBase.addEventListener("pointermove", e => {
        if (e.pointerId === activePointerId) {
          e.preventDefault();
          updateStickFromPoint(e.clientX, e.clientY);
        }
      });
      stickBase.addEventListener("pointerup", e => { if (e.pointerId === activePointerId) resetStick(); });
      stickBase.addEventListener("pointercancel", e => { if (e.pointerId === activePointerId) resetStick(); });

      let hammerPointerId = null;
      function setHammerPressed(on) {
        if (hammerBtnDown !== on) {
          hammerBtnDown = on;
          drawDotHammerBtn(on);
        }
      }
      hammerBtn.addEventListener("pointerdown", e => {
        e.preventDefault();
        hammerPointerId = e.pointerId;
        if (hammerBtn.setPointerCapture) {
          try { hammerBtn.setPointerCapture(e.pointerId); } catch (_) {}
        }
        setHammerPressed(true);
      });
      hammerBtn.addEventListener("pointerup", e => {
        if (e.pointerId === hammerPointerId) { hammerPointerId = null; setHammerPressed(false); }
      });
      hammerBtn.addEventListener("pointercancel", e => {
        if (e.pointerId === hammerPointerId) { hammerPointerId = null; setHammerPressed(false); }
      });

      const KEY_MAP = {
        ArrowUp: UP, KeyW: UP,
        ArrowDown: DOWN, KeyS: DOWN,
        ArrowLeft: LEFT, KeyA: LEFT,
        ArrowRight: RIGHT, KeyD: RIGHT,
        Space: HAMMER, KeyZ: HAMMER, KeyJ: HAMMER
      };
      const pressedKeys = new Set();

      function recomputeKeys() {
        let b = 0;
        for (const code of pressedKeys) b |= KEY_MAP[code] || 0;
        keyBits = b;
      }

      window.addEventListener("keydown", e => {
        if (screenMode !== "play") return;
        if (KEY_MAP[e.code]) {
          e.preventDefault();
          pressedKeys.add(e.code);
          recomputeKeys();
        }
      });
      window.addEventListener("keyup", e => {
        if (KEY_MAP[e.code]) {
          pressedKeys.delete(e.code);
          recomputeKeys();
        }
      });
      window.addEventListener("blur", () => {
        pressedKeys.clear();
        recomputeKeys();
        resetStick();
        hammerPointerId = null;
        setHammerPressed(false);
      });

      const STEP_MS = 1000 / 60;
      let lastTime = performance.now();
      let acc = 0;

      function loop(now) {
        const dt = Math.min(100, now - lastTime);
        lastTime = now;
        acc += dt;
        while (acc >= STEP_MS) {
          acc -= STEP_MS;
          bgTick++;
          if (screenMode === "play" && world) {
            world.step(currentBits());
            if (world.deathFinished || world.tryAgainFinished) {
              startStage(stageIdx);
              acc = 0;
              break;
            }
            if (world.clearFinished) {
              if (stageIdx < DEMO_STAGES.length - 1) {
                startStage(stageIdx + 1);
              } else {
                showEnding();
              }
              acc = 0;
              break;
            }
          }
        }
        if (screenMode === "title") {
          drawTitleScreen();
        } else if (screenMode === "ending") {
          drawEndingScreen();
        } else if (world) {
          renderer.draw(world);
        }
        requestAnimationFrame(loop);
      }

      showTitle();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
