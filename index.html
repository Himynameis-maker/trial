  function executeTitleChoice(idx) {
    if (idx === 0) goToSelect();
    else if (idx === 1) startChallengeMode();
    else startEndlessBattleMode();
  }

  function executeSelectChoice(idx) {
    const item = SELECT_BUTTONS[idx];
    if (!item) return;
    if (item.kind === "title") goToTitle();
    else startNormalStage(item.stage);
  }

  function handleMenuKeyEdges(edgeBits, rawBits) {
    if (menuWaitRelease) {
      if (rawBits === 0) menuWaitRelease = false;
      return;
    }
    const confirm = (edgeBits & HAMMER) !== 0;

    if (appScreen === "title") {
      if (edgeBits & UP) titleCursor = (titleCursor + 2) % 3;
      if (edgeBits & DOWN) titleCursor = (titleCursor + 1) % 3;
      if (confirm) executeTitleChoice(titleCursor);
    } else if (appScreen === "select") {
      if (edgeBits & LEFT) {
        if (selectCursor < 9) {
          const r = Math.floor(selectCursor / 3);
          const c = (selectCursor + 2) % 3;
          selectCursor = r * 3 + c;
        }
      } else if (edgeBits & RIGHT) {
        if (selectCursor < 9) {
          const r = Math.floor(selectCursor / 3);
          const c = (selectCursor + 1) % 3;
          selectCursor = r * 3 + c;
        }
      } else if (edgeBits & UP) {
        if (selectCursor === 9) selectCursor = 7;
        else if (selectCursor >= 3) selectCursor -= 3;
        else selectCursor = 9;
      } else if (edgeBits & DOWN) {
        if (selectCursor === 9) selectCursor = 1;
        else if (selectCursor <= 5) selectCursor += 3;
        else selectCursor = 9;
      }
      if (confirm) executeSelectChoice(selectCursor);
    } else if (appScreen === "gameover") {
      if (screenFrame < 18) return;
      if (edgeBits & (UP | DOWN)) overCursor = overCursor === 0 ? 1 : 0;
      if (confirm) {
        if (overCursor === 0) startChallengeMode();
        else goToTitle();
      }
    } else if (appScreen === "ending") {
      if (screenFrame < 24) return;
      if (confirm) goToTitle();
    }
  }

  function hitTest(box, cx, cy) {
    return cx >= box.x && cx <= box.x + box.w && cy >= box.y && cy <= box.y + box.h;
  }

  canvas.addEventListener("pointerdown", function (e) {
    const rect = canvas.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (appScreen === "title") {
      e.preventDefault();
      for (let i = 0; i < TITLE_BUTTONS.length; i++) {
        if (hitTest(TITLE_BUTTONS[i].hit, cx, cy)) {
          titleCursor = i;
          executeTitleChoice(i);
          return;
        }
      }
      return;
    }

    if (appScreen === "select") {
      e.preventDefault();
      for (let i = 0; i < SELECT_BUTTONS.length; i++) {
        if (hitTest(SELECT_BUTTONS[i].hit, cx, cy)) {
          selectCursor = i;
          executeSelectChoice(i);
          return;
        }
      }
      return;
    }

    if (appScreen === "gameover") {
      if (screenFrame < 18) return;
      e.preventDefault();
      for (let i = 0; i < OVER_BUTTONS.length; i++) {
        if (hitTest(OVER_BUTTONS[i].hit, cx, cy)) {
          overCursor = i;
          if (i === 0) startChallengeMode();
          else goToTitle();
          return;
        }
      }
      return;
    }

    if (appScreen === "ending") {
      if (screenFrame < 24) return;
      e.preventDefault();
      if (hitTest(ENDING_TITLE_BTN.hit, cx, cy)) goToTitle();
      return;
    }

    if (appScreen === "playing" && world && world.battleManager && world.battleManager.resultFinished) {
      e.preventDefault();
      finishBattleAndProceed();
    }
  });

  function stepPlayingFrame() {
    if (!world) return false;
    const bits = getPlayBits();

    if (world.battleManager && world.battleManager.resultFinished) {
      const hNow = (bits & HAMMER) !== 0;
      const hEdge = hNow && !resultHammerWaitPrev;
      resultHammerWaitPrev = hNow;
      if (hEdge) {
        finishBattleAndProceed();
        return true;
      }
      world.step(0);
      return false;
    }

    resultHammerWaitPrev = (bits & HAMMER) !== 0;
    world.step(bits);

    if (isBonusBattle &&
        playType === "challenge" &&
        !bonusLifeAwarded &&
        world.battleManager &&
        world.battleManager.ended &&
        world.battleManager.resultPhase === 2 &&
        world.battleManager.resultTimer >= 150) {
      if (world.battleManager.scores.player.total > world.battleManager.scores.hunter.total) {
        lives += 2;
        bonusLifeAwarded = true;
        refreshTopHud();
      }
    }

    if (world.deathFinished || world.tryAgainFinished) {
      if (playType === "challenge") {
        lives -= 1;
        if (lives <= 0) {
          lives = 0;
          goToGameOver();
          return true;
        }
      }
      startNormalOrChallengeStage(currentStage);
      return true;
    }

    if (world.clearFinished) {
      handleStageClearFinished();
      return true;
    }
    return false;
  }

  function renderPlayingFrame() {
    if (!world) return;
    renderer.draw(world);
    if (isBonusBattle &&
        playType === "challenge" &&
        world.battleManager &&
        world.battleManager.ended &&
        world.battleManager.resultPhase === 2 &&
        world.battleManager.resultTimer >= 150) {
      if (world.battleManager.scores.player.total > world.battleManager.scores.hunter.total) {
        drawDotText(ctx, "+2 LIFE!", world.worldWidth / 2, 208, {
          scale: 1,
          align: "center",
          color: "#7eff8e",
          outlineColor: "#04060c"
        });
      }
    }
    refreshTopHud();
  }

  retryBtn.addEventListener("click", function () {
    handleRetryButton();
    retryBtn.blur();
  });

  titleBtn.addEventListener("click", function () {
    goToTitle();
    titleBtn.blur();
  });

  const KEY_MAP = {
    ArrowUp: UP, KeyW: UP,
    ArrowDown: DOWN, KeyS: DOWN,
    ArrowLeft: LEFT, KeyA: LEFT,
    ArrowRight: RIGHT, KeyD: RIGHT,
    Space: HAMMER, KeyZ: HAMMER, KeyJ: HAMMER, Enter: HAMMER
  };
  const pressedKeys = new Set();

  function recomputeKeys() {
    let b = 0;
    for (const code of pressedKeys) b |= KEY_MAP[code] || 0;
    keyBits = b;
  }

  window.addEventListener("keydown", function (e) {
    if (e.code === "Escape" && (appScreen === "select" || appScreen === "gameover" || appScreen === "ending")) {
      e.preventDefault();
      goToTitle();
      return;
    }
    if (KEY_MAP[e.code]) {
      e.preventDefault();
      pressedKeys.add(e.code);
      recomputeKeys();
    }
  });

  window.addEventListener("keyup", function (e) {
    if (KEY_MAP[e.code]) {
      pressedKeys.delete(e.code);
      recomputeKeys();
    }
  });

  window.addEventListener("blur", function () {
    pressedKeys.clear();
    recomputeKeys();
    nesPad.resetInputs();
  });

  const STEP_MS = 1000 / 60;
  let lastTime = performance.now();
  let acc = 0;

  function loop(now) {
    const dt = Math.min(100, now - lastTime);
    lastTime = now;
    acc += dt;
    while (acc >= STEP_MS) {
      acc -= STEP_MS;
      if (appScreen === "playing") {
        const restarted = stepPlayingFrame();
        if (restarted) {
          acc = 0;
          break;
        }
      } else {
        screenFrame += 1;
        const rawBits = keyBits;
        const edgeBits = rawBits & ~lastKeyBits;
        lastKeyBits = rawBits;
        handleMenuKeyEdges(edgeBits, rawBits);
      }
    }
    if (appScreen === "playing") renderPlayingFrame();
    else if (appScreen === "title") drawTitleScreen();
    else if (appScreen === "select") drawSelectScreen();
    else if (appScreen === "gameover") drawGameOverScreen();
    else if (appScreen === "ending") drawEndingScreen();
    requestAnimationFrame(loop);
  }

  renderButtonDotCanvas(retryCanvas, "RETRY", "#ffffff");
  renderButtonDotCanvas(titleCanvas, "TITLE", "#ffffff");
  setScreenMode("title");
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
