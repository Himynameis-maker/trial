      }
      for (let i = 0; i < this.fallingPillars.length; i++) {
        if (this.fallingPillars[i].payloadTile === TILE.KEY) {
          count += 1;
        }
      }
      return count;
    }

    hasShoePodTile() {
      for (let i = 0; i < this.tiles.length; i++) {
        if (this.tiles[i] === TILE.SHOE_POD) {
          return true;
        }
      }
      for (let i = 0; i < this.fallingPillars.length; i++) {
        if (this.fallingPillars[i].payloadTile === TILE.SHOE_POD) {
          return true;
        }
      }
      return false;
    }

    initKeyAndShoePodState() {
      const keys = this.countRemainingKeys();
      const hasPod = this.hasShoePodTile();
      this.totalKeys = keys;
      this.collectedKeys = 0;
      this.shoePodOpenTimer = 0;
      if (!hasPod) {
        this.shoePodState = "none";
      } else if (keys === 0) {
        this.shoePodState = "open";
      } else {
        this.shoePodState = "closed";
      }
    }

    updateKeyAndShoePickups() {
      if (this.shoePodState === "opening") {
        this.shoePodOpenTimer -= 1;
        if (this.shoePodOpenTimer <= 0) {
          this.shoePodOpenTimer = 0;
          this.shoePodState = "open";
        }
      }

      const p = this.player;
      if (!p) return;
      if (p.state === 10 || p.state === 15 || p.state === 16) return;

      const px = this.wrapX(p.x + 8);
      const py = p.y;
      const halfW = this.worldWidth / 2;

      for (let row = 0; row < this.rows; row++) {
        const yTop = row * 32;
        if (py < yTop + 12 || py > yTop + 48) continue;

        for (let col = 0; col < this.cols; col++) {
          const t = this.getTile(row, col);
          if (t !== TILE.KEY && t !== TILE.SHOE_POD) continue;

          const cx = col * 16 + 8;
          let dx = px - cx;
          if (dx >= halfW) dx -= this.worldWidth;
          if (dx < -halfW) dx += this.worldWidth;
          if (Math.abs(dx) >= 10) continue;

          if (t === TILE.KEY) {
            this.setTile(row, col, TILE.EMPTY);
            this.collectedKeys += 1;
            this.pickupEffects.push({ row, col, kind: "key", timer: 18, maxTimer: 18 });
            if (this.countRemainingKeys() === 0 && this.shoePodState === "closed") {
              this.shoePodState = "opening";
              this.shoePodOpenTimer = 60;
              this.playSound("shoePodOpening");
            } else {
              this.playSound("keyPickup");
            }
          } else if (t === TILE.SHOE_POD && this.shoePodState === "open") {
            this.setTile(row, col, TILE.EMPTY);
            this.shoePodState = "collected";
            p.hasFlyingShoes = true;
            this.pickupEffects.push({ row, col, kind: "shoe", timer: 24, maxTimer: 24 });
            this.playSound("shoePickup");
          }
        }
      }
    }

    wrapX(x) {
      const w = this.worldWidth;
      return ((x % w) + w) % w;
    }

    wrapCol(col) {
      const c = this.cols;
      return ((col % c) + c) % c;
    }

    cellKey(row, col) {
      return row + "," + this.wrapCol(col);
    }

    getCrumblingInfo(row, col) {
      return this.crumblingLadders.get(this.cellKey(row, col)) || null;
    }

    hasCrumblingBelowSame(row, col) {
      const info = this.getCrumblingInfo(row, col);
      return info ? info.hasBelowSame : false;
    }

    getPillarBreakInfo(row, col) {
      return this.pillarBreaks.get(this.cellKey(row, col)) || null;
    }

    applyTimedBombSec(tb, sec) {
      if (!tb) return;
      const validSec = normalizeTimedBombSec(sec);
      tb.initialSec = validSec;
      tb.totalFrames = validSec * 60;
      tb.remainFrames = validSec * 60;
    }

    getTimedBombAt(row, col) {
      const wc = this.wrapCol(col);
      for (let i = 0; i < this.timedBombs.length; i++) {
        const tb = this.timedBombs[i];
        if (!tb.falling && tb.row === row && tb.col === wc) {
          return tb;
        }
      }
      return null;
    }

    ensureTimedBombSlot(row, col, sec = this.defaultTimedBombSec) {
      const wc = this.wrapCol(col);
      let tb = this.getTimedBombAt(row, wc);
      if (!tb) {
        const validSec = normalizeTimedBombSec(sec);
        tb = {
          id: this.nextTimedBombId++,
          row,
          col: wc,
          initialSec: validSec,
          totalFrames: validSec * 60,
          remainFrames: validSec * 60,
          falling: false
        };
        this.timedBombs.push(tb);
      }
      return tb;
    }

    removeTimedBombSlot(row, col) {
      const wc = this.wrapCol(col);
      for (let i = this.timedBombs.length - 1; i >= 0; i--) {
        const tb = this.timedBombs[i];
        if (!tb.falling && tb.row === row && tb.col === wc) {
          this.timedBombs.splice(i, 1);
        }
      }
    }

    ensureDoorSlot(row, col) {
      const wc = this.wrapCol(col);
      const key = this.cellKey(row, wc);
      let door = this.doorMap.get(key);
      if (!door) {
        door = {
          row,
          col: wc,
          state: 1,
          stepTimer: 0,
          openTimer: 0,
          byPlayer: true
        };
        this.doors.push(door);
        this.doorMap.set(key, door);
      }
      return door;
    }

    removeDoorSlot(row, col) {
      const wc = this.wrapCol(col);
      const key = this.cellKey(row, wc);
      const door = this.doorMap.get(key);
      if (!door) return;
      this.doorMap.delete(key);
      const idx = this.doors.indexOf(door);
      if (idx >= 0) {
        this.doors.splice(idx, 1);
      }
    }

    loadTiles(src) {
      if (Array.isArray(src)) {
        for (const item of src) {
          this.setTile(item[0], item[1], item[2]);
        }
      } else {
        for (const [k, v] of Object.entries(src)) {
          if (k.includes(",")) {
            const [r, c] = k.split(",").map(Number);
            this.setTile(r, c, v);
          } else {
            const addr = Number(k);
            const pos = addr >= 0x500 ? addr - 0x500 : addr;
            const r = (pos >> 4) & 0x0f;
            const c = pos & 0x0f;
            this.setTile(r, c, v);
          }
        }
      }
    }

    setTile(row, col, val) {
      if (row < 0 || row >= this.rows) return;
      const wc = this.wrapCol(col);
      const safeVal = isEdgeSafeCol(wc, this.cols) ? TILE.EMPTY : val;
      this.tiles[row * this.cols + wc] = safeVal;
      if (safeVal === TILE.DOOR) {
        this.ensureDoorSlot(row, wc);
      } else if (!isDoorRelatedTile(safeVal)) {
        this.removeDoorSlot(row, wc);
      }
      if (safeVal === TILE.TIMED_BOMB) {
        const initSec = this.timedBombOverrideSec != null ? this.timedBombOverrideSec : this.defaultTimedBombSec;
        this.ensureTimedBombSlot(row, wc, initSec);
      } else {
        this.removeTimedBombSlot(row, wc);
      }
    }

    getTile(row, col) {
      if (row < 0 || row >= this.rows) return TILE.EMPTY;
      const wc = this.wrapCol(col);
      return this.tiles[row * this.cols + wc];
    }

    getDrumTrappedActor(row, col) {
      const wc = this.wrapCol(col);
      let best = null;
      let bestOrder = -1;
      const checkSlot = (slot) => {
        if (!slot || slot.state !== 16) return;
        if (slot.row !== row || slot.col !== wc) return;
        const ord = slot.trapOrder || 0;
        if (ord >= bestOrder) {
          bestOrder = ord;
          best = slot;
        }
      };
      checkSlot(this.player);
      checkSlot(this.hunter);
      if (this.enemies) {
        for (let i = 0; i < this.enemies.length; i++) {
          checkSlot(this.enemies[i]);
        }
      }
      return best;
    }

    countBreakables() {
      let count = 0;
      const checkFn = this.isBattleMode ? isBattleCountedTile : isClearTargetTile;
      for (let i = 0; i < this.tiles.length; i++) {
        if (checkFn(this.tiles[i])) {
          count += 1;
        }
      }
      for (let i = 0; i < this.fallingPillars.length; i++) {
        if (checkFn(this.fallingPillars[i].payloadTile)) {
          count += 1;
        }
      }
      return count;
    }

    isBattleClearConditionMet() {
      return this.countBreakables() === 0 &&
        this.crumblingLadders.size === 0 &&
        this.pillarBreaks.size === 0 &&
        this.waves.length === 0;
    }

    openDoor(row, col, byPlayer = true, openDuration = 0x50) {
      if (row < 0 || row >= this.rows) return false;
      const c = this.wrapCol(col);
      const door = this.ensureDoorSlot(row, c);
      door.state = 2;
      door.stepTimer = 4;
      door.openTimer = openDuration;
      door.byPlayer = !!byPlayer;
      this.setTile(row, c, byPlayer ? TILE.DOOR_OPENING_1 : (TILE.DOOR_OPENING_1 | 0x08));
      this.playSound("doorOpen");
      return true;
    }

    openAllDoors(byPlayer = true, openDuration = 0x20) {
      for (let i = 0; i < this.doors.length; i++) {
        const door = this.doors[i];
        if (door.state === 0) continue;
        door.state = 2;
        door.stepTimer = 4;
        door.openTimer = openDuration;
        door.byPlayer = !!byPlayer;
        this.setTile(door.row, door.col, byPlayer ? TILE.DOOR_OPENING_1 : (TILE.DOOR_OPENING_1 | 0x08));
      }
    }

    holdDoorsOpen() {
      for (let i = 0; i < this.doors.length; i++) {
        if (this.doors[i].state !== 0) {
          this.doors[i].openTimer = 0x40;
        }
      }
    }

    updateDoors() {
      if (this.doors.length === 0) return;
      for (let i = 0; i < this.doors.length; i++) {
        const door = this.doors[i];
        if (door.state <= 1) continue;
        if (door.stepTimer > 0) {
          door.stepTimer -= 1;
          continue;
        }
        door.stepTimer = 4;
        if (door.state === 2) {
          const bit3 = this.getTile(door.row, door.col) & 0x08;
          this.setTile(door.row, door.col, TILE.DOOR_OPENING_2 | bit3);
          door.state = 3;
        } else if (door.state === 3) {
          this.setTile(door.row, door.col, TILE.DOOR_OPEN);
          door.state = 4;
        } else if (door.state === 4) {
          door.openTimer -= 1;
          if (door.openTimer <= 0) {
            this.setTile(door.row, door.col, TILE.DOOR_CLOSING_1);
            door.state = 5;
            this.playSound("doorClose");
          }
        } else if (door.state === 5) {
          this.setTile(door.row, door.col, TILE.DOOR_CLOSING_2);
          door.state = 6;
        } else if (door.state === 6) {
          this.setTile(door.row, door.col, TILE.DOOR);
          door.state = 1;
          door.stepTimer = 0;
        }
      }
    }

    startCrumblingLadder(row, col, byPlayer, spreadUp = true, spreadDown = true) {
      if (row < 0 || row >= this.rows) return false;
      const c = this.wrapCol(col);
      if (this.getTile(row, c) !== TILE.BREAK_LADDER) return false;

      const belowTile = row < this.rows - 1 ? this.getTile(row + 1, c) : TILE.EMPTY;
      const hasBelowSame = row < this.rows - 1 &&
        (belowTile === TILE.BREAK_LADDER || isCrumblingLadderTile(belowTile));

      this.setTile(row, c, TILE.CRUMBLING_4);
      this.crumblingLadders.set(this.cellKey(row, c), {
        row,
        col: c,
        stage: 4,
        timer: COLLAPSE_STAGE_FRAMES,
        spreadTimer: COLLAPSE_STAGE_FRAMES,
        spreadUp,
        spreadDown,
        hasBelowSame,
        byPlayer: !!byPlayer
      });
      return true;
    }

    updateCrumblingLadders() {
      if (this.crumblingLadders.size === 0) return;
      const entries = Array.from(this.crumblingLadders.values());
      const toSpread = [];

      for (const e of entries) {
        if (e.spreadUp || e.spreadDown) {
          e.spreadTimer -= 1;
          if (e.spreadTimer <= 0) {
            if (e.spreadUp && e.row > 0 && this.getTile(e.row - 1, e.col) === TILE.BREAK_LADDER) {
              toSpread.push({ row: e.row - 1, col: e.col, byPlayer: e.byPlayer, up: true, down: false });
            }
            if (e.spreadDown && e.row < this.rows - 1 && this.getTile(e.row + 1, e.col) === TILE.BREAK_LADDER) {
              toSpread.push({ row: e.row + 1, col: e.col, byPlayer: e.byPlayer, up: false, down: true });
            }
            e.spreadUp = false;
            e.spreadDown = false;
          }
        }

        e.timer -= 1;
        if (e.timer <= 0) {
          e.stage -= 1;
          e.timer = COLLAPSE_STAGE_FRAMES;
          if (e.stage <= 0) {
            this.crumblingLadders.delete(this.cellKey(e.row, e.col));
            this.setTile(e.row, e.col, e.hasBelowSame ? TILE.HOLE_CRUMBLED : TILE.EMPTY);
            this.breakEffects.push({ row: e.row, col: e.col, tile: TILE.BREAK_LADDER, timer: 16, maxTimer: 16 });
            this.playSound("wallBreak");
            if (this.battleManager) {
              this.battleManager.onEvent({
                type: "ladderDestroyed",
                row: e.row,
                col: e.col,
                byPlayer: !!e.byPlayer
              });
            }
          } else {
            this.setTile(e.row, e.col, 0x50 + e.stage);
          }
        }
      }

      for (const s of toSpread) {
        this.startCrumblingLadder(s.row, s.col, s.byPlayer, s.up, s.down);
      }
    }

    triggerPillar(row, col, byPlayer) {
      if (row < 0 || row >= this.rows) return false;
      const c = this.wrapCol(col);

      // 支柱自身の崩壊開始 (0x75 -> 0x74 -> 0x73 -> 0x72 -> 0x71 -> 0x00, 1+8*4=33F)
      this.setTile(row, c, 0x75);
      this.pillarBreaks.set(this.cellKey(row, c), {
        row,
        col: c,
        stage: 5,
        timer: 1,
        byPlayer: !!byPlayer
      });
      this.playSound("pillarFall");

      if (row >= 1 && this.fallingPillars.length < 12) {
        const aboveRow = row - 1;
        const aboveTile = this.getTile(aboveRow, c);
        const payload = getPillarFallPayload(aboveTile);
        if (payload !== null) {
          this.crumblingLadders.delete(this.cellKey(aboveRow, c));
          let fallingTimedBomb = null;
          if (aboveTile === TILE.TIMED_BOMB) {
            fallingTimedBomb = this.getTimedBombAt(aboveRow, c);
            if (fallingTimedBomb) {
              fallingTimedBomb.falling = true;
            }
          }
          const isContLadder = isLadderTile(aboveTile) &&
            aboveRow >= 1 &&
            isSameLadderType(aboveTile, this.getTile(aboveRow - 1, c));

          // 0F目から1行上は即座に穴落下判定になり、オブジェクトは 30F 滞空する
          this.setTile(aboveRow, c, TILE.HOLE_FALLING);
          this.fallingPillars.push({
            row: aboveRow,
            targetRow: row,
            col: c,
            payloadTile: payload,
            origAboveTile: aboveTile,
            isDrum: aboveTile === TILE.DRUM,
            isFloorOnly: payload === TILE.EMPTY,
            aboveDoneHole: isContLadder ? TILE.HOLE_PILLAR_LAD : TILE.HOLE,
            timedBomb: fallingTimedBomb,
            stage: 1,
            timer: 30
          });
        }
      }
      return true;
    }

    updatePillarBreakTiles() {
      if (this.pillarBreaks.size === 0) return;
      const entries = Array.from(this.pillarBreaks.values());
      for (const e of entries) {
        e.timer -= 1;
        if (e.timer <= 0) {
          e.stage -= 1;
          if (e.stage <= 0) {
            this.pillarBreaks.delete(this.cellKey(e.row, e.col));
            this.setTile(e.row, e.col, TILE.EMPTY);
            this.breakEffects.push({ row: e.row, col: e.col, tile: TILE.PILLAR, timer: 14, maxTimer: 14 });
            if (this.battleManager) {
              this.battleManager.onEvent({
                type: "pillarDestroyed",
                row: e.row,
                col: e.col,
                byPlayer: !!e.byPlayer
              });
            }
          } else {
            e.timer = COLLAPSE_STAGE_FRAMES;
            this.setTile(e.row, e.col, 0x70 + e.stage);
          }
        }
      }
    }

    updateFallingPillars() {
      if (this.fallingPillars.length === 0) return;
      for (let i = this.fallingPillars.length - 1; i >= 0; i--) {
        const fp = this.fallingPillars[i];
        fp.timer -= 1;
        if (fp.timer > 0) continue;

        fp.timer = 4;
        if (fp.stage === 1 && fp.isDrum) {
          // 30F目: ドラム缶落下中は下の鉄柱マスを捕獲状態へ
          this.pillarBreaks.delete(this.cellKey(fp.targetRow, fp.col));
          this.setTile(fp.targetRow, fp.col, TILE.DRUM_FALLING);
        }

        fp.stage += 1;
        if (fp.stage >= 5) {
          // 42F目 (30 + 4*3): 着地完了
          this.fallingPillars.splice(i, 1);
          this.pillarBreaks.delete(this.cellKey(fp.targetRow, fp.col));
          if (fp.timedBomb) {
            fp.timedBomb.row = fp.targetRow;
            fp.timedBomb.col = fp.col;
            fp.timedBomb.falling = false;
          }
          this.setTile(fp.targetRow, fp.col, fp.payloadTile);
          this.setTile(fp.row, fp.col, fp.aboveDoneHole);
        }
      }
    }

    hitCell(row, col, byPlayer) {
      const c = this.wrapCol(col);
      if (row < 0 || row >= this.rows) return false;
      const tile = this.getTile(row, c);
      if (!isBreakableTile(tile)) return false;

      if (tile === TILE.BOMB) {
        this.triggerBomb(row, c, byPlayer);
        if (this.battleManager) {
          if (!byPlayer) {
            // バトルモードでハンターが爆弾を叩いた時は、無差別爆風の前に避けられるよう振り終わり硬直を短縮
            if (this.hunter && this.hunter.state === 4 && this.hunter.hammerTimer < 22) {
              this.hunter.hammerTimer = 22;
            }
            if (this.battleManager.hunterAI && typeof this.battleManager.hunterAI.notifyBombHit === "function") {
              this.battleManager.hunterAI.notifyBombHit(row, c);
            }
          }
          this.battleManager.onEvent({
            type: "bombExploded",
            row,
            col: c,
            byPlayer: !!byPlayer
          });
        }
        return true;
      }

      if (tile === TILE.BREAK_LADDER) {
        const started = this.startCrumblingLadder(row, c, byPlayer, true, true);
        if (started) {
          this.playSound("hammerHitWall");
          if (this.battleManager && !byPlayer && this.battleManager.hunterAI &&
              typeof this.battleManager.hunterAI.notifyNonDoorHit === "function") {
            this.battleManager.hunterAI.notifyNonDoorHit();
          }
        }
        return started;
      }

      if (tile === TILE.DOOR) {
        const opened = this.openDoor(row, c, byPlayer, 0x50);
        if (opened && this.battleManager) {
          this.battleManager.onEvent({
            type: "doorOpened",
            row,
            col: c,
            byPlayer: !!byPlayer
          });
        }
        return opened;
      }

      if (tile === TILE.PILLAR) {
        const triggered = this.triggerPillar(row, c, byPlayer);
        if (triggered && this.battleManager && !byPlayer && this.battleManager.hunterAI &&
            typeof this.battleManager.hunterAI.notifyNonDoorHit === "function") {
          this.battleManager.hunterAI.notifyNonDoorHit();
        }
        return triggered;
      }

      if (this.battleManager && !byPlayer && this.battleManager.hunterAI &&
          typeof this.battleManager.hunterAI.notifyNonDoorHit === "function") {
        this.battleManager.hunterAI.notifyNonDoorHit();
      }

      const hp = tile & 0x07;
      if (hp > 1) {
        this.setTile(row, c, tile - 1);
        this.playSound("hammerHitWall");
      } else {
        this.setTile(row, c, TILE.EMPTY);
        this.breakEffects.push({ row, col: c, tile, timer: 16, maxTimer: 16 });
        this.explosions.push({
          row,
          col: c,
          timer: COLLAPSE_TOTAL_FRAMES,
          maxTimer: COLLAPSE_TOTAL_FRAMES,
          age: 0,
          kind: "wall",
          byPlayer: !!byPlayer
        });
        this.playSound("wallBreak");
        if (this.battleManager) {
          this.battleManager.onEvent({
            type: "wallDestroyed",
            tile,
            row,
            col: c,
            byPlayer: !!byPlayer
          });
        }
      }
      return true;
    }

    triggerBomb(row, col, byPlayer = true) {
      const c = this.wrapCol(col);
      this.setTile(row, c, TILE.EMPTY);
      this.openAllDoors(byPlayer, 0x20);
      this.playSound("bombExplode");
      this.explosions.push({
        row,
        col: c,
        timer: 26,
        maxTimer: 26,
        age: 0,
        kind: "bomb",
        byPlayer: !!byPlayer
      });
      this.waves.push({ row, col: this.wrapCol(c - 1), dir: -1, timer: 10, stepsLeft: this.cols - 1, byPlayer: !!byPlayer });
      this.waves.push({ row, col: this.wrapCol(c + 1), dir: 1, timer: 10, stepsLeft: this.cols - 1, byPlayer: !!byPlayer });
    }

    triggerTimedBomb(row, col, keepTile = false) {
      const c = this.wrapCol(col);
      if (!keepTile) {
        this.setTile(row, c, TILE.EMPTY);
      }
      this.openAllDoors(true, 0x20);
      this.playSound("bombExplode");
      this.explosions.push({
        row,
        col: c,
        timer: 26,
        maxTimer: 26,
        age: 0,
        kind: "bomb",
        byPlayer: true,
        indiscriminate: true
      });
      this.waves.push({ row, col: this.wrapCol(c - 1), dir: -1, timer: 10, stepsLeft: this.cols - 1, byPlayer: true });
      this.waves.push({ row, col: this.wrapCol(c + 1), dir: 1, timer: 10, stepsLeft: this.cols - 1, byPlayer: true });
    }

    updateTimedBombs() {
      if (this.timedBombs.length === 0) return;
      for (let i = this.timedBombs.length - 1; i >= 0; i--) {
        const tb = this.timedBombs[i];
        tb.remainFrames -= 1;
        if (tb.remainFrames > 0) {
          if (tb.remainFrames <= 600 && ((600 - tb.remainFrames) % 30 === 0)) {
            this.playSound("timedBeep", { urgent: tb.remainFrames <= 180 });
          }
          continue;
        }

        this.timedBombs.splice(i, 1);
        if (tb.falling) {
          let expRow = tb.row;
          for (let j = 0; j < this.fallingPillars.length; j++) {
            const fp = this.fallingPillars[j];
            if (fp.timedBomb === tb) {
              expRow = fp.stage >= 2 ? fp.targetRow : fp.row;
              fp.payloadTile = TILE.EMPTY;
              fp.origAboveTile = TILE.EMPTY;
              fp.isFloorOnly = true;
              fp.timedBomb = null;
              break;
            }
          }
          this.triggerTimedBomb(expRow, tb.col, true);
        } else {
          this.triggerTimedBomb(tb.row, tb.col, false);
        }
      }
    }

    updateEffectsAndWaves() {
      this.updateDoors();
      this.updateCrumblingLadders();
      this.updatePillarBreakTiles();
      this.updateFallingPillars();

      for (let i = this.explosions.length - 1; i >= 0; i--) {
        const ex = this.explosions[i];
        ex.age = (ex.age || 0) + 1;
        ex.timer -= 1;
        if (ex.timer <= 0) {
          this.explosions.splice(i, 1);
        }
      }
      for (let i = this.breakEffects.length - 1; i >= 0; i--) {
        this.breakEffects[i].timer -= 1;
        if (this.breakEffects[i].timer <= 0) {
          this.breakEffects.splice(i, 1);
        }
      }
      for (let i = this.pickupEffects.length - 1; i >= 0; i--) {
        this.pickupEffects[i].timer -= 1;
        if (this.pickupEffects[i].timer <= 0) {
          this.pickupEffects.splice(i, 1);
        }
      }

      if (this.waves.length === 0) return;
      const prevWaves = this.waves;
      this.waves = [];
      const nextWaves = [];

      for (const w of prevWaves) {
        w.timer -= 1;
        if (w.timer > 0) {
          nextWaves.push(w);
          continue;
        }

        const waveByPlayer = this.isBattleMode ? (w.byPlayer !== false) : true;
        const t = this.getTile(w.row, w.col);
        if (isDoorRelatedTile(t) || t === TILE.TIMED_BOMB) {
          if (w.stepsLeft > 1) {
            nextWaves.push({
              row: w.row,
              col: this.wrapCol(w.col + w.dir),
              dir: w.dir,
              timer: 10,
              stepsLeft: w.stepsLeft - 1,
              byPlayer: waveByPlayer
            });
          }
          continue;
        }
        if (!isBreakableTile(t)) continue;

        this.hitCell(w.row, w.col, waveByPlayer);

        if (t !== TILE.BOMB) {
          const afterTile = this.getTile(w.row, w.col);
          if (t === TILE.BREAK_LADDER || afterTile !== TILE.EMPTY) {
            this.explosions.push({ row: w.row, col: w.col, timer: 10, maxTimer: 10, age: 0, kind: "spark", byPlayer: waveByPlayer });
            this.playSound("bombWave");
          }
        }
        if (w.stepsLeft > 1) {
          nextWaves.push({
            row: w.row,
            col: this.wrapCol(w.col + w.dir),
            dir: w.dir,
            timer: 10,
            stepsLeft: w.stepsLeft - 1,
            byPlayer: waveByPlayer
          });
        }
      }
      this.waves = nextWaves.concat(this.waves);
    }

    resolveKnockdownAttacker(slot, prev) {
      let checkRow = slot.row;
      if (prev.state === 2) {
        const curT = this.getTile(slot.row, slot.col);
        if (curT === TILE.HOLE_PILLAR_LAD || ((slot.y & 0x0f) !== 0 && (slot.y & 0x10) !== 0)) {
          checkRow = Math.min(this.rows - 1, slot.row + 1);
        }
      } else if (prev.state === 5) {
        checkRow = Math.max(0, Math.min(this.rows - 1, Math.floor((slot.y - 16) / 32)));
      }

      const targetSide = slot.isPlayer ? 0 : (!slot.isEnemy ? 1 : (slot.isBack ? 1 : 0));

      if (this.explosions && this.explosions.length > 0) {
        for (let i = 0; i < this.explosions.length; i++) {
          const ex = this.explosions[i];
          if (ex.col !== slot.col || ex.row !== checkRow) continue;
          if (ex.kind === "bomb") {
            const attackerSide = ex.byPlayer ? 0 : 1;
            if (ex.indiscriminate || ex.age >= 21 || targetSide !== attackerSide) {
              return !!ex.byPlayer;
            }
          } else if (ex.kind === "wall") {
            const attackerSide = ex.byPlayer ? 0 : 1;
            if (ex.age < COLLAPSE_HIT_FRAMES && targetSide !== attackerSide) {
              return !!ex.byPlayer;
            }
          }
        }
      }

      const tile = this.getTile(checkRow, slot.col);

      if (!(slot.flag & 2)) {
        if (isDoorOpeningTile(tile)) {
          const attackerSide = (tile & 0x08) !== 0 ? 1 : 0;
          if (targetSide !== attackerSide) {
            return (tile & 0x08) === 0;
          }
        }
        if (this.pillarBreaks && this.pillarBreaks.size > 0) {
          const pInfo = this.getPillarBreakInfo(checkRow, slot.col);
          if (pInfo && pInfo.stage >= 2) {
            const attackerSide = pInfo.byPlayer ? 0 : 1;
            if (targetSide !== attackerSide) {
              return !!pInfo.byPlayer;
            }
          }
        }
      }

      if (prev.state !== 5) {
        const isDangerLadderInfo = (r, c) => {
          const lt = this.getTile(r, c);
          if (!isCrumblingLadderTile(lt)) return null;
          const info = this.getCrumblingInfo(r, c);
          const stage = info ? info.stage : (lt & 0x07);
          return stage <= 2 ? info : null;
        };

        const curDanger = isDangerLadderInfo(checkRow, slot.col);
        if (curDanger && checkRow < this.rows - 1) {
          const belowDanger = isDangerLadderInfo(checkRow + 1, slot.col);
          if (belowDanger) {
            return curDanger ? !!curDanger.byPlayer : true;
          }
        }

        if (isHoleTile(tile) && checkRow < this.rows - 1) {
          const belowDanger = isDangerLadderInfo(checkRow + 1, slot.col);
          if (belowDanger) {
            return !!belowDanger.byPlayer;
          }
        }

        if (!(slot.flag & 2) && isCrumblingLadderTile(tile)) {
          const info = this.getCrumblingInfo(checkRow, slot.col);
          const stage = info ? info.stage : (tile & 0x07);
          const byPl = info ? !!info.byPlayer : true;
          if (stage >= 2 && targetSide !== (byPl ? 0 : 1)) {
            return byPl;
          }
        }
      }

      return null;
    }

    updateHunterHammer() {
      const hu = this.hunter;
      if (!hu) return;
      const pl = this.player;
      hu.bits &= ~HAMMER;
      if (hu.state === 4 || hu.state === 10 || hu.state === 11 || hu.state === 15 || hu.state === 16) {
        return;
      }

      const tile = this.getTile(hu.row, hu.col);
      if (tile === TILE.BOMB || tile === TILE.TIMED_BOMB || !isBreakableTile(tile)) return;

      const sameCell = hu.row === pl.row && hu.col === pl.col;
      if (tile === TILE.DOOR || sameCell || this.hunterAggressive) {
        hu.bits |= HAMMER;
      }
    }

    // プレイヤーの段（はしご途中は近い方の段）を電磁球の出現高さにする
    getOrbStartY() {
      const py = this.player.y;
      const snapped = ((py & 0x0f) !== 0 && (py & 0x10) !== 0)
        ? ((py & ~0x1f) + 32)
        : (py & ~0x1f);
      return Math.max(32, Math.min(this.rows * 32, snapped));
    }

    // 電磁球ギミック更新（ややウェーブ軌道付き水平飛行）
    updateOrb() {
      const ob = this.orb;
      if (!ob) return;

      if (ob.state === 0) {
        // State 0: 出現準備（プレイヤーの高さ＆左右の遠い方に出現）
        const startY = this.getOrbStartY();
        ob.baseY = startY;
        ob.y = startY;
        const halfCols = Math.floor(this.cols / 2);
        if (this.player.col < halfCols) {
          ob.dir = LEFT;
          ob.x = Math.max(8, this.worldWidth - 24);
        } else {
          ob.dir = RIGHT;
          ob.x = 8;
        }
        ob.state = 1;
        ob.spawnTimer = 64; // 64F発生アニメ待機
        ob.animStage = 0;   // 極小のコアから開始
        ob.animCount = 0;
        ob.waveTick = 0;
        ob.disappearDone = false;
        this.playSound("orbSpawn");
        return;
      }

      if (ob.state === 1) {
        // State 1: 発生アニメーション（だんだん組み上がってから飛び始める）
        ob.spawnTimer -= 1;
        ob.animCount += 1;
        if (ob.animStage < 2) {
          if ((this.f & 0x07) === 0) {
            ob.animStage += 1;
          }
        } else {
          ob.animStage = ((ob.animCount >> 1) & 1) ? 3 : 2;
        }
        if (ob.spawnTimer <= 0) {
          ob.state = 2;
        }
        return;
      }

      if (ob.state === 2) {
        // State 2: 水平飛行（1.0px/F）＋ ややウェーブ（障害物をすべて素通りし反対側の端で消滅）
        ob.x += (ob.dir === LEFT) ? -1 : 1;
        const reachedEnd = (ob.dir === LEFT)
          ? (ob.x <= 8)
          : (ob.x >= Math.max(8, this.worldWidth - 16));
        if (reachedEnd) {
          ob.state = 3;
          ob.disappearDone = false;
          ob.animStage = 3;
          ob.waitTimer = this.orbFast ? 0x20 : 0x60; // 再出現待ち（通常 約12.8秒 / 高速 約4.3秒）
          return;
        }
        ob.waveTick += 1;
        ob.y = ob.baseY + Math.round(Math.sin(ob.waveTick * (Math.PI * 2 / 36)) * 2.5);
        ob.animCount += 1;
        ob.animStage = ((ob.animCount >> 1) & 1) ? 3 : 2;
        return;
      }

      if (ob.state === 3) {
        // State 3: 消滅アニメーション → 完了後は非表示のまま8Fごとに待ちタイマー減算
        if (!ob.disappearDone) {
          if ((this.f & 0x07) === 0) {
            ob.animStage -= 1;
            if (ob.animStage < 0) {
              ob.animStage = -1;
              ob.disappearDone = true;
            }
          }
          return;
        }
        if ((this.f & 0x07) === 0) {
          ob.waitTimer -= 1;
          if (ob.waitTimer <= 0) {
            ob.waitTimer = 0;
            ob.state = 0;
          }
        }
      }
    }

    // プレイヤーと有効な表側ザコ敵の接触判定
    isPlayerEnemyHit(player, enemy) {
      if (this.allBackStop) return false;
      if (player.flag & 0x08) return false;
      if (player.state === 7 || player.state === 10 || player.state === 11 ||
          player.state === 15 || player.state === 16) {
        return false;
      }
      if (enemy.isBack) return false;
      if (enemy.state === 4 || enemy.state === 10 || enemy.state === 13 ||
          enemy.state === 15 || enemy.state === 16) {
        return false;
      }

      let dx = player.x - enemy.x;
      const halfW = this.worldWidth / 2;
      if (dx >= halfW) dx -= this.worldWidth;
      if (dx < -halfW) dx += this.worldWidth;
      const absDx = dx >= 0 ? dx : (-dx - 1);
      if (absDx >= 6) return false;

      const dy = player.y - enemy.y;
      const absDy = dy >= 0 ? dy : (-dy - 1);
      if (absDy >= 8) return false;

      return true;
    }

    // プレイヤーと飛行中の電磁球の接触判定（State 2のみ有効）
    isPlayerOrbHit(player, ob) {
      if (this.allBackStop) return false;
      if (!ob || ob.state !== 2) return false;
      if (player.flag & 0x08) return false;
      if (player.state === 7 || player.state === 10 || player.state === 11 ||
          player.state === 15 || player.state === 16) {
        return false;
      }

      let dx = player.x - ob.x;
      const halfW = this.worldWidth / 2;
      if (dx >= halfW) dx -= this.worldWidth;
      if (dx < -halfW) dx += this.worldWidth;
      const absDx = dx >= 0 ? dx : (-dx - 1);
      if (absDx >= 6) return false;

      const dy = player.y - ob.y;
      const absDy = dy >= 0 ? dy : (-dy - 1);
      if (absDy >= 8) return false;

      return true;
    }

    updatePlayerEnemyHit() {
      this.playerHitEnemy = false;
      this.playerHitOrb = false;
      if (this.enemies && this.enemies.length > 0) {
        for (let i = 0; i < this.enemies.length; i++) {
          if (this.isPlayerEnemyHit(this.player, this.enemies[i])) {
            this.playerHitEnemy = true;
            break;
          }
        }
      }
      if (this.isPlayerOrbHit(this.player, this.orb)) {
        this.playerHitOrb = true;
        this.playerHitEnemy = true;
      }
    }

    startPlayerDeath() {
      if (this.playerDead || this.stageCleared || this.tryAgainActive) return;
      this.playerDead = true;
      this.deathPhase = 1;
      this.deathTimer = 0;
      this.deathVy = 0;
      this.deathFinished = false;
      this.startBannerTimer = 0;
      this.playSound("playerHitStop");

      const viewH = 240;
      const minCamY = -24;
      const maxCamY = Math.max(minCamY, this.rows * 32 + 24 - viewH);
      const approxCamY = Math.max(minCamY, Math.min(maxCamY, Math.round(this.player.y - viewH * 0.58)));
      this.deathBottomY = approxCamY + viewH + 42;
    }

    updatePlayerDeath() {
      if (!this.playerDead || this.deathFinished) return;

      if (this.deathPhase === 1) {
        this.deathTimer += 1;
        if (this.deathTimer >= 32) {
          this.deathPhase = 2;
          this.deathTimer = 0;
          this.deathVy = -3.4;
          this.playSound("playerDeathFall");
        }
        return;
      }

      if (this.deathPhase === 2) {
        this.deathTimer += 1;
        this.player.y += this.deathVy;
        this.deathVy = Math.min(7.0, this.deathVy + 0.38);
        if (this.player.y >= this.deathBottomY || this.deathTimer >= 120) {
          this.deathPhase = 3;
          this.deathTimer = 0;
        }
        return;
      }

      if (this.deathPhase === 3) {
        this.deathTimer += 1;
        if (this.deathTimer >= 36) {
          this.deathFinished = true;
        }
      }
    }

    isStageClearConditionMet() {
      return this.countBreakables() === 0 && this.crumblingLadders.size === 0;
    }

    startStageClear() {
      if (this.stageCleared || this.playerDead || this.tryAgainActive) return;
      this.stageCleared = true;
      this.clearPhase = 1;
      this.clearTimer = 0;
      this.clearFinished = false;
      this.playerHitEnemy = false;
      this.playerHitOrb = false;
      if (this.player.state === 15 || this.player.state === 16) {
        this.player.flag |= 2;
        this.player.y = this.player.row * 32 + 0x0b;
        this.player.topY = this.player.y;
        this.player.state = 0;
        this.player.prom = 0;
        this.stepper.updateCR(this.player, this);
      }
    }

    startTryAgain() {
      if (this.tryAgainActive || this.playerDead || this.stageCleared) return;
      this.tryAgainActive = true;
      this.tryAgainPhase = 1;
      this.tryAgainTimer = 0;
      this.tryAgainFinished = false;
      this.startBannerTimer = 0;
      this.musicTempoRate = 0.6;
      if (this.onMusicSlowDown) {
        this.onMusicSlowDown(this.musicTempoRate);
      }
      this.playSound("tryAgain");
    }

    updateTryAgain() {
      if (!this.tryAgainActive || this.tryAgainFinished) return;

      if (this.tryAgainPhase === 1) {
        this.tryAgainTimer += 1;
        if (this.tryAgainTimer >= 180) {
          this.tryAgainPhase = 2;
          this.tryAgainTimer = 0;
        }
        return;
      }

      if (this.tryAgainPhase === 2) {
        this.tryAgainTimer += 1;
        if (this.tryAgainTimer >= 120) {
          this.tryAgainPhase = 3;
          this.tryAgainTimer = 0;
        }
        return;
      }

      if (this.tryAgainPhase === 3) {
        this.tryAgainTimer += 1;
        if (this.tryAgainTimer >= 120) {
          this.tryAgainFinished = true;
        }
      }
    }

    // 同陣営ザコ敵同士（表同士・裏同士）の接触判定
    updateEnemyCollisions() {
      if (!this.enemies || this.enemies.length < 2) return;
      const halfW = this.worldWidth / 2;
      for (let i = 0; i < this.enemies.length; i++) {
        const a = this.enemies[i];
        if (a.state === 2 || a.state === 4 || a.state === 10 ||
            a.state === 13 || a.state === 15 || a.state === 16) {
          continue;
        }
        for (let j = i + 1; j < this.enemies.length; j++) {
          const b = this.enemies[j];
          if (!!a.isBack !== !!b.isBack) continue;
          if (b.state === 2 || b.state === 4 || b.state === 10 ||
              b.state === 13 || b.state === 15 || b.state === 16) {
            continue;
          }

          let dx = a.x - b.x;
          if (dx >= halfW) dx -= this.worldWidth;
          if (dx < -halfW) dx += this.worldWidth;
          const absDx = dx >= 0 ? dx : (-dx - 1);
          if (absDx >= 8) continue;

          const dy = a.y - b.y;
          const absDy = dy >= 0 ? dy : (-dy - 1);
          if (absDy >= 8) continue;

          a.bumpTrigger = true;
          b.bumpTrigger = true;
        }
      }
    }

    // 敵全員が裏側かつドア出入り中でない時、一定時間停止演出
    updateAllBackStop() {
      if (this.allBackStop) {
        this.holdDoorsOpen();
        if ((this.f & 0x03) === 0) {
          this.allBackTimer -= 1;
          if (this.allBackTimer <= 0) {
            this.allBackStop = false;
            this.allBackTimer = 0;
            this.allBackDone = true;
          }
        }
        return;
      }

      if (!this.enemies || this.enemies.length < 2) {
        this.allBackStop = false;
        this.allBackTimer = 0;
        this.allBackDone = false;
        return;
      }

      let allInBackAndNotDoor = true;
      for (let i = 0; i < this.enemies.length; i++) {
        const e = this.enemies[i];
        if (!e.isBack || e.state === 3) {
          allInBackAndNotDoor = false;
          break;
        }
      }

      if (!allInBackAndNotDoor) {
        this.allBackStop = false;
        this.allBackTimer = 0;
        this.allBackDone = false;
        return;
      }

      if (this.allBackDone) {
        return;
      }

      this.allBackStop = true;
      this.allBackTimer = 0x80;
      this.openAllDoors(true, 0x20);
    }

    step(inputBits = 0) {
      let b = inputBits;
      if ((b & (LEFT | RIGHT)) === (LEFT | RIGHT)) {
        b &= ~(LEFT | RIGHT);
      }
      if ((b & (UP | DOWN)) === (UP | DOWN)) {
        b &= ~(UP | DOWN);
      }

      const hammerNow = (b & HAMMER) !== 0;
      const hammerEdge = hammerNow && !this.player.prevHammer;
      this.player.prevHammer = hammerNow;

      if (this.introActive) {
        if (hammerEdge) {
          this.introActive = false;
          this.introFrame = this.introTotalFrames;
          this.startBannerTimer = 72;
          this.snapCameraRequested = true;
          this.playSound("start");
        } else {
          this.introFrame += 1;
          if (this.introFrame >= this.introTotalFrames) {
            this.introActive = false;
            this.startBannerTimer = 72;
            this.playSound("start");
          }
        }
        return;
      }

      if (this.battleManager && this.battleManager.ended) {
        this.battleManager.stepResult();
        return;
      }

      if (this.playerDead) {
        this.updatePlayerDeath();
        return;
      }

      if (this.clearPhase === 2) {
        this.clearTimer += 1;
        if (this.clearTimer >= 180) {
          this.clearFinished = true;
        }
        return;
      }

      if (this.tryAgainActive) {
        this.updateTryAgain();
      }

      if (this.startBannerTimer > 0) {
        this.startBannerTimer -= 1;
      }

      this.player.bits = (b & ~HAMMER) | (hammerEdge ? HAMMER : 0);

      if (!this.isBattleMode) {
        this.updateAllBackStop();
      }
      if (!this.allBackStop) {
        this.updateTimedBombs();
      }

      const prevPlayerState = this.player.state;
      this.stepper.step(this.player, this);
      if (prevPlayerState !== 4 && this.player.state === 4) {
        this.playSound("hammerSwing", { golden: !!this.player.isGolden });
      }
      if (prevPlayerState !== 10 && this.player.state === 10) {
        this.playSound("knockdown");
      }
      if (prevPlayerState !== 11 && this.player.state === 11) {
        this.playSound("stun");
      }
      if (prevPlayerState !== 16 && this.player.state === 16) {
        this.playSound("drumTrap");
      }
      if (this.battleManager && prevPlayerState !== 10 && this.player.state === 10) {
        const attackerIsPlayer = this.resolveKnockdownAttacker(this.player, { state: prevPlayerState });
        if (attackerIsPlayer === false) {
          this.battleManager.onEvent({
            type: "opponentKnockedDown",
            row: this.player.row,
            col: this.player.col,
            byPlayer: false
          });
        }
      }

      if (!this.tryAgainActive && !this.isBattleMode) {
        this.updateKeyAndShoePickups();
      }
      if (this.player.state === 1) {
        this.player.walkFrames = (this.player.walkFrames || 0) + 1;
      } else {
        this.player.walkFrames = 0;
      }
      this.updatePlayerStepSounds();

      if (!this.isBattleMode && !this.stageCleared && !this.tryAgainActive && this.isStageClearConditionMet()) {
        this.startStageClear();
      }

      if (!this.allBackStop) {
        this.updateEnemyCollisions();
        if (this.hunter) {
          if (this.battleManager) {
            this.battleManager.hunterAI.update(this);
            this.battleManager.hunterAI.updateHammer(this);
          } else {
            if (this.f % 2 === 1) {
              this.hunterAI.update(this);
            }
            this.updateHunterHammer();
          }
          const prevHunterState = this.hunter.state;
          this.stepper.step(this.hunter, this);
          if (prevHunterState !== 16 && this.hunter.state === 16) {
            this.playSound("drumTrap");
          }
          if (this.battleManager && prevHunterState !== 10 && this.hunter.state === 10) {
            const attackerIsPlayer = this.resolveKnockdownAttacker(this.hunter, { state: prevHunterState });
            if (attackerIsPlayer === true) {
              this.battleManager.onEvent({
                type: "opponentKnockedDown",
                row: this.hunter.row,
                col: this.hunter.col,
                byPlayer: true
              });
            }
          }
          if (this.hunter.state === 1) {
            this.hunter.walkFrames = (this.hunter.walkFrames || 0) + 1;
          } else {
            this.hunter.walkFrames = 0;
          }
        }
        if (this.enemyAI && this.enemies.length > 0) {
          const enemyStatesPrev = this.enemies.map(e => ({
            isBack: !!e.isBack,
            state: e.state,
            row: e.row,
            col: e.col,
            y: e.y
          }));
          this.enemyAI.updateAll(this);
          for (let i = 0; i < this.enemies.length; i++) {
            const e = this.enemies[i];
            const prev = enemyStatesPrev[i];
            if (prev.state !== 4 && e.state === 4) {
              this.playSound("enemyStun");
            } else if (prev.state !== 10 && e.state === 10) {
              this.playSound("knockdown");
            } else if (prev.state !== 16 && e.state === 16) {
              this.playSound("drumTrap");
            }

  function bakeSprite(rows, palette, flipX) {
    const c = document.createElement("canvas");
    c.width = 16;
    c.height = 26;
    const g = c.getContext("2d");
    for (let y = 0; y < 26; y++) {
      const line = rows[y] || "";
      for (let x = 0; x < 16; x++) {
        const ch = line[x];
        const color = palette[ch];
        if (!color) continue;
        g.fillStyle = color;
        g.fillRect(flipX ? 15 - x : x, y, 1, 1);

    }
    return c;

  function makeSpriteSet(patterns, palette) {
    const set = {};

      set[k + "_L"] = bakeSprite(rows, palette, true);
    }
    return set;
  }

  class Renderer {
    constructor(canvas, options = {}) {
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.ctx.imageSmoothingEnabled = false;
      this.viewHeight = options.viewHeight || 240;
      this.camY = 0;

    getSpaceField(w) {
      const cached = this.spaceFieldCache.get(w);
      if (cached) return cached;
      if (this.spaceFieldCache.size > 12) {
        this.spaceFieldCache.clear();
      }

      let seed = (0x5a17c391 ^ Math.imul(w | 0, 2654435761)) >>> 0;
      const rand = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const stars = [];
      const nebula = [];
      const cols = Math.max(1, Math.floor(w / 16));
      const bandTop = -123;
      const rowH = 14;
      const rows = 8; // -123 .. -12

      // 遠い深宇宙の淡い星雲微粒子（斜めの銀河帯）
      const nebulaColors = ["#384a86", "#4f3e7c", "#2d5584"];
      for (let i = 0; i < cols * 2; i++) {
        const nx = Math.floor(rand() * w);
        const t = w > 1 ? nx / w : 0.5;
        const centerY = -44 - t * 48 + Math.sin(t * Math.PI * 2.2) * 14;
        const ny = Math.round(centerY + (rand() - 0.5) * 32);
        if (ny < -123 || ny > -12) continue;
        nebula.push({
          x: nx,
          y: ny,
          w: rand() < 0.25 ? 2 : 1,
          color: nebulaColors[Math.floor(rand() * nebulaColors.length)],
          alpha: 0.14 + rand() * 0.10
        });
      }

      // 層状配置でバランス良く宇宙の星々を配置
      for (let r = 0; r < rows; r++) {
        const yMin = bandTop + r * rowH;
        const yMax = Math.min(-12, yMin + rowH - 2);
        for (let c = 0; c < cols; c++) {
          if (rand() > 0.44) continue;
          const xMin = c * 16 + 2;
          const xMax = Math.min(w - 3, xMin + 12);
          if (xMax < xMin) continue;

          const sx = xMin + Math.floor(rand() * (xMax - xMin + 1));
          const sy = yMin + Math.floor(rand() * (yMax - yMin + 1));
          const roll = rand();

          let type = 0;
          if (roll > 0.94 && r < rows - 1) {
            type = 3; // 主役の輝き星（5x5までキラッと広がる）
          } else if (roll > 0.80) {
            type = 2; // キラキラ十字星（3x3）
          } else if (roll > 0.58) {
            type = 1; // 瞬き小星
          }

          const themeRoll = rand();
          let themeIdx = 0;
          if (themeRoll > 0.90) themeIdx = 4;
          else if (themeRoll > 0.72) themeIdx = 3;
          else if (themeRoll > 0.48) themeIdx = 2;
          else if (themeRoll > 0.24) themeIdx = 1;

          stars.push({
            x: sx,
            y: sy,
            type,
            theme: SPACE_STAR_THEMES[themeIdx],
            phase: Math.floor(rand() * 256),
            speed: type === 0
              ? (18 + Math.floor(rand() * 16))
              : (type === 1 ? (10 + Math.floor(rand() * 8)) : (6 + Math.floor(rand() * 4)))

        grad.addColorStop(0.26, "#080c1e");
        grad.addColorStop(0.56, "#14173b");
        grad.addColorStop(0.84, "#0b122a");
        grad.addColorStop(1.00, "#080b14");
        this.spaceGradient = grad;

      ctx.save();
      ctx.fillStyle = this.spaceGradient;
      ctx.fillRect(0, visTop, w, visBottom - visTop);

      const field = this.getSpaceField(w);
      for (let i = 0; i < field.nebula.length; i++) {
        const n = field.nebula[i];
        if (n.y < visTop || n.y >= visBottom) continue;
        ctx.globalAlpha = n.alpha;
        ctx.fillStyle = n.color;
        ctx.fillRect(n.x, n.y, n.w, 1);

      const animFrame = (world.introFrame || 0) + (world.f || 0);

        const s = field.stars[i];

        const th = s.theme;

        if (s.type === 0) {
          const step = tick & 3;
          ctx.globalAlpha = step === 2 ? 0.85 : (step === 0 ? 0.45 : 0.65);
          ctx.fillStyle = step === 2 ? th.mid : th.outer;
          ctx.fillRect(s.x, s.y, 1, 1);
        } else if (s.type === 1) {
          const step = tick & 3;
          if (step === 1) {
            ctx.globalAlpha = 0.95;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
          } else if (step === 2) {
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x + 1, s.y, 1, 1);

            ctx.globalAlpha = 0.72;
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x, s.y, 1, 1);
          }

            ctx.globalAlpha = 0.82;
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x, s.y, 1, 1);

            ctx.globalAlpha = 0.95;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.globalAlpha = 0.75;
            ctx.fillStyle = th.outer;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
          } else if (step === 4) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
            ctx.globalAlpha = 0.42;
            ctx.fillStyle = th.outer;
            ctx.fillRect(s.x - 1, s.y - 1, 1, 1);
            ctx.fillRect(s.x + 1, s.y - 1, 1, 1);
            ctx.fillRect(s.x - 1, s.y + 1, 1, 1);
            ctx.fillRect(s.x + 1, s.y + 1, 1, 1);
          } else if (step === 5) {
            ctx.globalAlpha = 0.95;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
          } else {
            ctx.globalAlpha = 0.88;
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x, s.y, 1, 1);
          }
        } else {
          const step = tick % 10;
          if (step < 4) {
            ctx.globalAlpha = 0.92;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.globalAlpha = 0.60;
            ctx.fillStyle = th.outer;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
          } else if (step === 4 || step === 7) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
          } else if (step === 5) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
            ctx.globalAlpha = 0.78;
            ctx.fillStyle = th.outer;
            ctx.fillRect(s.x - 2, s.y, 1, 1);
            ctx.fillRect(s.x + 2, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 2, 1, 1);
            ctx.fillRect(s.x, s.y + 2, 1, 1);
            ctx.globalAlpha = 0.45;
            ctx.fillRect(s.x - 1, s.y - 1, 1, 1);
            ctx.fillRect(s.x + 1, s.y - 1, 1, 1);
            ctx.fillRect(s.x - 1, s.y + 1, 1, 1);
            ctx.fillRect(s.x + 1, s.y + 1, 1, 1);
          } else if (step === 6) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = th.core;
            ctx.fillRect(s.x, s.y, 1, 1);
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x - 1, s.y - 1, 1, 1);
            ctx.fillRect(s.x + 1, s.y - 1, 1, 1);
            ctx.fillRect(s.x - 1, s.y + 1, 1, 1);
            ctx.fillRect(s.x + 1, s.y + 1, 1, 1);
            ctx.globalAlpha = 0.70;
            ctx.fillStyle = th.outer;
            ctx.fillRect(s.x - 1, s.y, 1, 1);
            ctx.fillRect(s.x + 1, s.y, 1, 1);
            ctx.fillRect(s.x, s.y - 1, 1, 1);
            ctx.fillRect(s.x, s.y + 1, 1, 1);
          } else {
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = th.mid;
            ctx.fillRect(s.x, s.y, 1, 1);
          }
        }
      }

      ctx.restore();
    }

    makeWireFencePattern() {
      const c = document.createElement("canvas");
      c.width = 8;
      c.height = 8;
      const g = c.getContext("2d");
      for (let i = 0; i < 8; i++) {
        g.fillStyle = "#8a94a6";
        g.fillRect(i, i, 1, 1);
        g.fillStyle = "#727c8e";
        g.fillRect(7 - i, i, 1, 1);
      }
      g.fillStyle = "#aab4c4";
      g.fillRect(0, 0, 1, 1);
      g.fillRect(7, 0, 1, 1);
      g.fillRect(3, 3, 2, 2);
      g.fillRect(0, 7, 1, 1);
      g.fillRect(7, 7, 1, 1);
      return this.ctx.createPattern(c, "repeat");
    }

    makeFloorBlockPattern() {
      const c = document.createElement("canvas");
      c.width = 8;
      c.height = 8;
      const g = c.getContext("2d");
      // 8x8 正方形の青ブロック（立体縁取り＋内側デザイン入り）
      g.fillStyle = "#1e4498";
      g.fillRect(0, 0, 8, 8);
      // 上・左のハイライト
      g.fillStyle = "#4278d8";
      g.fillRect(0, 0, 7, 1);
      g.fillRect(0, 0, 1, 7);
      g.fillStyle = "#78a8ff";
      g.fillRect(0, 0, 1, 1);
      // 下・右の暗影（目地）
      g.fillStyle = "#0c183c";
      g.fillRect(0, 7, 8, 1);
      g.fillRect(7, 0, 1, 8);
      // 内側のちょっとした凹凸デザイン
      g.fillStyle = "#142e72";
      g.fillRect(2, 2, 4, 1);
      g.fillRect(2, 2, 1, 4);
      g.fillStyle = "#2b5cc2";
      g.fillRect(3, 5, 3, 1);
      g.fillRect(5, 3, 1, 3);
      return this.ctx.createPattern(c, "repeat");
    }

    ensureCanvasSize(world) {
      const targetW = world.worldWidth;
      const targetH = this.viewHeight;
      if (this.canvas.width !== targetW || this.canvas.height !== targetH) {
        this.canvas.width = targetW;
        this.canvas.height = targetH;
        this.ctx.imageSmoothingEnabled = false;
      }
      this.canvas.style.aspectRatio = targetW + " / " + targetH;
    }

    getWorldHeight(world) {
      return world.rows * 32 + 24;
    }

    getBaseCamY(world) {
      const minCamY = -24;
      const maxCamY = Math.max(minCamY, this.getWorldHeight(world) - this.viewHeight);
      const targetY = Math.round(world.player.y - this.viewHeight * 0.58);
      return Math.max(minCamY, Math.min(maxCamY, targetY));
    }

    resetCamera(world) {
      this.isIntroCamMoving = false;
      this.camY = world.introActive ? INTRO_START_CAM_Y : this.getBaseCamY(world);
    }

    updateCamera(world) {
      const minCamY = -24;
      const maxCamY = Math.max(minCamY, this.getWorldHeight(world) - this.viewHeight);
      const baseCamY = this.getBaseCamY(world);

      if (world.snapCameraRequested) {
        world.snapCameraRequested = false;
        this.camY = baseCamY;
        this.isIntroCamMoving = false;
        return;
      }

      if (world.playerDead || world.clearPhase === 2 || (world.battleManager && world.battleManager.ended)) {
        this.isIntroCamMoving = false;
        return;
      }

      if (world.introActive) {
        const t = world.introFrame || 0;
        const total = world.introTotalFrames || 288;
        const holdStart = 12;
        const holdEnd = 18;
        const moveBudget = Math.max(60, total - holdStart - holdEnd);
        const introStart = INTRO_START_CAM_Y;
        const introBottom = maxCamY + INTRO_GROUND_OVERSHOOT;
        const dDown = Math.max(1, introBottom - introStart);
        const dUp = Math.max(1, introBottom - baseCamY);
        const downFrames = Math.max(30, Math.min(moveBudget - 30, Math.round(moveBudget * (dDown / (dDown + dUp)))));
        const upFrames = moveBudget - downFrames;
        const downEnd = holdStart + downFrames;
        const upEnd = holdStart + moveBudget;

        if (t <= holdStart) {
          this.camY = introStart;
          this.isIntroCamMoving = false;
        } else if (t < downEnd) {
          const p = (t - holdStart) / downFrames;
          this.camY = introStart + dDown * p;
          this.isIntroCamMoving = true;
        } else if (t === downEnd) {
          this.camY = introBottom;
          this.isIntroCamMoving = true;
        } else if (t < upEnd) {
          const p = (t - downEnd) / upFrames;
          this.camY = introBottom - dUp * p;
          this.isIntroCamMoving = true;
        } else {
          this.camY = baseCamY;
          this.isIntroCamMoving = false;
        }
        return;
      }

      this.isIntroCamMoving = false;
      if (maxCamY === minCamY) {
        this.camY = minCamY;
        return;
      }
      const diff = baseCamY - this.camY;
      if (Math.abs(diff) <= 1.5) {
        this.camY = baseCamY;
      } else {
        this.camY += diff * 0.2;
      }
    }

    getBannerCanvas(text) {
      const str = String(text || "").toUpperCase();
      const cached = this.bannerCache.get(str);
      if (cached) return cached;
      if (this.bannerCache.size > 120) {
        this.bannerCache.clear();
      }

      const scale = 2;
      const glyphW = 7;
      const glyphH = 7;
      const stepX = 8; // 7px文字 + 1px文字間（8x8グリッド基準）
      const gridW = Math.max(1, str.length * stepX - 1);
      const gridH = glyphH;
      const padLeft = 1;
      const padTop = 1;
      const totalGridW = gridW + 3; // 左1ドット縁 + 右2ドット(縁+影)
      const totalGridH = glyphH + 3; // 上1ドット縁 + 下2ドット(縁+影)

      const body = new Uint8Array(totalGridW * totalGridH);
      for (let i = 0; i < str.length; i++) {
        const glyph = PIXEL_FONT[str[i]] || PIXEL_FONT[" "];
        const baseX = padLeft + i * stepX;
        for (let r = 0; r < glyphH; r++) {
          const line = glyph[r];
          const rowOff = (padTop + r) * totalGridW;
          for (let c = 0; c < glyphW; c++) {
            if (line[c] === "1") {
              body[rowOff + baseX + c] = 1;
            }
          }
        }
      }

      const pw = totalGridW * scale;
      const ph = totalGridH * scale;
      const canvas = document.createElement("canvas");
      canvas.width = pw;
      canvas.height = ph;
      const g = canvas.getContext("2d");

      const hasBody = (gx, gy) => {
        if (gx < 0 || gy < 0 || gx >= totalGridW || gy >= totalGridH) return false;
        return body[gy * totalGridW + gx] === 1;
      };

      // 文字と同じドット粒度(scale=2)の黒縁取り ＋ 右下1ドット立体影
      g.fillStyle = "#04060c";
      for (let gy = 0; gy < totalGridH; gy++) {
        for (let gx = 0; gx < totalGridW; gx++) {
          if (hasBody(gx, gy)) continue;
          let hit = false;
          for (let dy = -1; dy <= 1 && !hit; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (hasBody(gx + dx, gy + dy) || hasBody(gx - 1 + dx, gy - 1 + dy)) {
                hit = true;
                break;
              }
            }
          }
          if (hit) {
            g.fillRect(gx * scale, gy * scale, scale, scale);
          }
        }
      }

      // 文字本体（白単色）
      g.fillStyle = "#ffffff";
      for (let gy = 0; gy < totalGridH; gy++) {
        for (let gx = 0; gx < totalGridW; gx++) {
          if (hasBody(gx, gy)) {
            g.fillRect(gx * scale, gy * scale, scale, scale);
          }
        }
      }

      this.bannerCache.set(str, canvas);
      return canvas;
    }

    drawBannerText(ctx, canvasW, text, centerY) {
      const img = this.getBannerCanvas(text);
      const x = Math.round((canvasW - img.width) / 2);
      const y = Math.round(centerY - img.height / 2);
      ctx.drawImage(img, x, y);
    }

    drawBannerTextPartial(ctx, canvasW, fullText, visibleNonSpaceCount, centerY) {
      if (visibleNonSpaceCount <= 0) return;
      const str = String(fullText || "").toUpperCase();
      const fullImg = this.getBannerCanvas(str);
      const x = Math.round((canvasW - fullImg.width) / 2);
      const y = Math.round(centerY - fullImg.height / 2);

      let partial = "";
      let count = 0;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch !== " ") {
          if (count >= visibleNonSpaceCount) break;
          count += 1;
        }
        partial += ch;
      }
      if (!partial) return;
      const partImg = this.getBannerCanvas(partial);
      ctx.drawImage(partImg, x, y);
    }

    drawRoof(ctx, w) {
      // 天井の屋根（平べったい台形シルエット＋ブロック模様：y = -9 .. 6、下端6pxで1段目の縦幅を他段と統一）
      ctx.fillStyle = "#1e4498";
      ctx.fillRect(10, -9, Math.max(0, w - 20), 2);
      ctx.fillRect(6, -7, Math.max(0, w - 12), 3);
      ctx.fillRect(2, -4, Math.max(0, w - 4), 4);

      // 上面の明るいハイライト＆肩の縁
      ctx.fillStyle = "#689cff";
      ctx.fillRect(10, -9, Math.max(0, w - 20), 1);
      ctx.fillRect(6, -7, 4, 1);
      ctx.fillRect(w - 10, -7, 4, 1);
      ctx.fillStyle = "#4278d8";
      ctx.fillRect(2, -4, 4, 1);
      ctx.fillRect(w - 6, -4, 4, 1);
      ctx.fillRect(10, -8, Math.max(0, w - 20), 1);

      // 屋根の縦目地・デザインリブ（8px単位で屋根瓦／板金風）
      for (let x = 8; x < w - 8; x += 8) {
        const topY = (x >= 10 && x < w - 10) ? -8 : -6;
        ctx.fillStyle = "#0c183c";
        ctx.fillRect(x, topY, 1, -topY);
        ctx.fillStyle = "#3468c8";
        ctx.fillRect(x + 1, topY, 1, -topY);
      }

      // 屋根上部の平べったい装飾凹み（16px単位）
      for (let x = 16; x < w - 24; x += 16) {
        ctx.fillStyle = "#142e72";
        ctx.fillRect(x + 4, -5, 8, 2);
        ctx.fillStyle = "#2b5cc2";
        ctx.fillRect(x + 4, -3, 8, 1);
      }

      // 軒先の横桁・平べったい青ブロック帯（y = 0 .. 6、他段鉄骨と同じ6px厚）
      ctx.fillStyle = "#1e4498";
      ctx.fillRect(0, 0, w, 6);
      ctx.fillStyle = "#4278d8";
      ctx.fillRect(0, 0, w, 1);
      ctx.fillStyle = "#0c183c";
      ctx.fillRect(0, 5, w, 1);
      for (let x = 0; x < w; x += 8) {
        ctx.fillStyle = "#4278d8";
        ctx.fillRect(x, 0, 1, 5);
        ctx.fillStyle = "#0c183c";
        ctx.fillRect(x + 7, 0, 1, 6);
        ctx.fillStyle = "#142e72";
        ctx.fillRect(x + 2, 2, 4, 2);
      }
    }

    draw(world) {
      this.ensureCanvasSize(world);
      this.updateCamera(world);

      const ctx = this.ctx;
      const w = world.worldWidth;
      const h = this.viewHeight;
      const camOffset = Math.round(this.camY);

      ctx.fillStyle = "#080b14";
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(0, -camOffset);

      // 屋根より上の宇宙空間（深宇宙グラデーション＋キラキラ星、映らない範囲は自動スキップ）
      this.drawSpaceSky(ctx, w, camOffset, h, world);

      // 左右端ループゾーンの目印（ごく薄いガイド線）
      ctx.fillStyle = "rgba(88, 144, 248, 0.08)";
      ctx.fillRect(0, 6, 1, Math.max(0, world.rows * 32 - 6));
      ctx.fillRect(w - 1, 6, 1, Math.max(0, world.rows * 32 - 6));

      // 裏側キャラ層（追尾ロボ ＋ 裏ザコ敵：金網・床・扉・ハシゴ・鉄柱・ドラム缶の奥側に描画）
      if (world.hunter) {
        this.drawActor(world.hunter, this.fallbackHunterSprites, w, world);
      }
      if (world.enemies) {
        for (const enemy of world.enemies) {
          if (enemy.isBack) this.drawEnemy(enemy, w, world);
        }
      }

      // 画面端2マス（左右合計4マス）の背景金網グラフィック（明るめグレー）
      if (world.cols > EDGE_SAFE_COLS * 2 && this.wireFencePattern) {
        const edgeW = EDGE_SAFE_COLS * 16;
        const fenceTop = 6;
        const fenceH = Math.max(0, world.rows * 32 - fenceTop);
        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = this.wireFencePattern;
        ctx.fillRect(0, fenceTop, edgeW, fenceH);
        ctx.translate(w - edgeW, 0);
        ctx.fillRect(0, fenceTop, edgeW, fenceH);
        ctx.restore();
      }

      // 画面外の天井（平べったい青屋根）と画面外の床（小さい正方形の青ブロック）
      this.drawRoof(ctx, w);
      if (this.floorBlockPattern) {
        const floorBottomStartY = world.rows * 32 + 6;
        const viewBottomY = camOffset + h;
        const fillH = viewBottomY - floorBottomStartY;
        if (fillH > 0) {
          ctx.save();
          ctx.translate(0, floorBottomStartY);
          ctx.fillStyle = this.floorBlockPattern;
          ctx.fillRect(0, 0, w, fillH);
          ctx.restore();
        }
      }

      // 床（穴・落下開始穴および同種連続はしごの中間以外は鉄骨を描画、最下段は常に足場あり）
      for (let row = 0; row < world.rows; row++) {
        const floorY = (row + 1) * 32;
        const isBottomRow = row === world.rows - 1;
        for (let col = 0; col < world.cols; col++) {
          const tile = world.getTile(row, col);
          const belowTile = !isBottomRow ? world.getTile(row + 1, col) : TILE.EMPTY;
          const isContLad = !isBottomRow && (
            isSameLadderType(tile, belowTile) ||
            (tile === TILE.BREAK_LADDER && isCrumblingLadderTile(belowTile)) ||
            (isCrumblingLadderTile(tile) && world.hasCrumblingBelowSame && world.hasCrumblingBelowSame(row, col))
          );
          const x = col * 16;

          if (!isBottomRow && (isHoleTile(tile) || tile === TILE.HOLE_FALLING || isContLad)) {
            continue;
          }
          if (isEdgeSafeCol(col, world.cols)) {
            ctx.fillStyle = "#c86018";
            ctx.fillRect(x, floorY, 16, 6);
            ctx.fillStyle = "#ff9c38";
            ctx.fillRect(x, floorY, 16, 2);
            ctx.fillStyle = "#6e2c08";
            ctx.fillRect(x + 2, floorY + 2, 12, 2);
          } else {
            ctx.fillStyle = "#2858b8";
            ctx.fillRect(x, floorY, 16, 6);
            ctx.fillStyle = "#5890f8";
            ctx.fillRect(x, floorY, 16, 2);
            ctx.fillStyle = "#183070";
            ctx.fillRect(x + 2, floorY + 2, 12, 2);
          }
        }
      }

      // マップタイル
      for (let row = 0; row < world.rows; row++) {
        const yTop = row * 32;
        for (let col = 0; col < world.cols; col++) {
          const val = world.getTile(row, col);
          this.drawTileAt(ctx, col * 16, yTop, val, world);
        }
      }

      // 鉄柱の滞空・落下オブジェクト＋白い床板
      this.drawFallingPillars(ctx, world);

      // 破壊破片エフェクト
      if (world.breakEffects) {
        for (const ef of world.breakEffects) {
          const t = ef.maxTimer - ef.timer;
          const cx = ef.col * 16 + 8;
          const cy = ef.row * 32 + 16;
          if (ef.tile === TILE.BREAK_LADDER) {
            ctx.fillStyle = "#ff88a8";
          } else if (ef.tile === TILE.PILLAR) {
            ctx.fillStyle = "#98acc4";
          } else {
            ctx.fillStyle = "#d07850";
          }
          ctx.fillRect(cx - 4 - t * 0.5, cy - 6 + t * 0.8, 3, 3);
          ctx.fillRect(cx + 2 + t * 0.5, cy - 4 + t * 0.9, 3, 3);
          ctx.fillRect(cx - 5 - t * 0.3, cy + 2 + t * 1.1, 3, 3);
          ctx.fillRect(cx + 3 + t * 0.4, cy + 1 + t * 1.0, 3, 3);
        }
      }

      // 鍵・シューズ取得キラキラエフェクト
      if (world.pickupEffects) {
        for (const pe of world.pickupEffects) {
          const t = pe.maxTimer - pe.timer;
          const cx = pe.col * 16 + 8;
          const cy = pe.row * 32 + 18;
          const spread = 2 + Math.round(t * 0.6);
          if (pe.kind === "shoe") {
            ctx.fillStyle = (t & 2) ? "#ffffff" : "#48f4ff";
            ctx.fillRect(cx - spread, cy - spread, 2, 2);
            ctx.fillRect(cx + spread - 1, cy - spread, 2, 2);
            ctx.fillRect(cx - spread, cy + spread - 1, 2, 2);
            ctx.fillRect(cx + spread - 1, cy + spread - 1, 2, 2);
            ctx.fillStyle = (t & 1) ? "#ff9830" : "#fff070";
            ctx.fillRect(cx - 1, cy - spread - 1, 2, 2);
            ctx.fillRect(cx - 1, cy + spread, 2, 2);
          } else {
            ctx.fillStyle = (t & 2) ? "#ffffff" : "#44d8ff";
            ctx.fillRect(cx - spread, cy - 1, 2, 2);
            ctx.fillRect(cx + spread - 1, cy - 1, 2, 2);
            ctx.fillRect(cx - 1, cy - spread, 2, 2);
            ctx.fillRect(cx - 1, cy + spread - 1, 2, 2);
          }
        }
      }

      // 表側キャラ層（表ザコ敵 → プレイヤー → 電磁球、死亡時は最前面へ回す）
      if (world.enemies) {
        for (const enemy of world.enemies) {
          if (!enemy.isBack) this.drawEnemy(enemy, w, world);
        }
      }
      if (!world.playerDead) {
        this.drawActor(world.player, this.fallbackPlayerSprites, w, world);
      }
      if (world.orb) {
        this.drawOrb(world.orb);
      }

      // 爆風・崩落煙エフェクト
      if (world.explosions) {
        for (const ex of world.explosions) {
          const cx = ex.col * 16 + 8;
          const cy = ex.row * 32 + 16;
          const phase = (ex.timer >> 1) & 1;

          if (ex.kind === "spark") {
            ctx.fillStyle = phase ? "#fff080" : "#ff9840";
            ctx.fillRect(cx - 4, cy - 1, 8, 2);
            ctx.fillRect(cx - 1, cy - 4, 2, 8);
          } else if (ex.kind === "wall") {
            const r = Math.max(3, Math.round(8 * (ex.timer / ex.maxTimer)));
            ctx.fillStyle = phase ? "#e89840" : "#b86830";
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
            ctx.fillStyle = "#fff090";
            ctx.fillRect(cx - 2, cy - 2, 4, 4);
          } else {
            const isAllDanger = (ex.age || 0) >= 21;
            const r = isAllDanger
              ? 12
              : Math.max(5, Math.round(10 * (0.4 + 0.6 * (ex.timer / ex.maxTimer))));
            ctx.fillStyle = isAllDanger
              ? (phase ? "#ff2820" : "#ffffff")
              : (phase ? "#ff5820" : "#ffa820");
            ctx.fillRect(cx - r, cy - 4, r * 2, 8);
            ctx.fillRect(cx - 4, cy - r, 8, r * 2);
            ctx.fillStyle = isAllDanger
              ? (phase ? "#ffff80" : "#ff5020")
              : (phase ? "#fff058" : "#ffffff");
            ctx.fillRect(cx - Math.max(2, r - 4), cy - Math.max(2, r - 4), Math.max(4, (r - 4) * 2), Math.max(4, (r - 4) * 2));
          }
        }
      }

      // バトルモード：オブジェ上の点数ポップアップ
      if (world.battleManager && typeof this.drawBattlePopups === "function") {
        this.drawBattlePopups(world);
      }

      // 死亡演出中のプレイヤーは一番手前（最前面）へ描画
      if (world.playerDead) {
        this.drawActor(world.player, this.fallbackPlayerSprites, w, world);
      }

      ctx.restore();

      if (world.battleManager) {
        if (typeof this.drawBattleHUD === "function") {
          this.drawBattleHUD(world);
        }
        if (typeof this.drawBattleOverlay === "function") {
          this.drawBattleOverlay(world);
        }
      } else if (world.tryAgainActive && world.tryAgainPhase >= 2) {
        // 上から下へ2.0秒(120F)かけて黒幕を下ろす（Phase 3は全画面真っ黒）
        const curtainRatio = world.tryAgainPhase === 3
          ? 1
          : Math.min(1, (world.tryAgainTimer || 0) / 120);
        const curtainH = Math.min(h, Math.round((h * curtainRatio) / 2) * 2);
        if (curtainH > 0) {
          ctx.fillStyle = "#000000";
          ctx.fillRect(0, 0, w, curtainH);
          if (curtainH < h) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
            ctx.fillRect(0, curtainH, w, Math.min(2, h - curtainH));
          }
        }

        // TRY AGAIN ! を一文字ずつ0.08秒(4.8F)間隔で出す（空白を飛ばし、黒幕より手前に残す）
        const elapsedF = world.tryAgainPhase === 3
          ? 120
          : (world.tryAgainTimer || 0);
        const visibleCount = Math.min(9, 1 + Math.floor(elapsedF / 4.8));
        this.drawBannerTextPartial(ctx, w, "TRY AGAIN !", visibleCount, 96);
      } else if (world.clearPhase === 2) {
        this.drawBannerText(ctx, w, "CLEAR!", 100);
      } else if (world.introActive) {
        const text = "STAGE " + (world.stageNumber || 1);
        this.drawBannerText(ctx, w, text, 44);
      } else if (world.startBannerTimer > 0) {
        const elapsed = Math.max(0, 72 - world.startBannerTimer);
        if (Math.floor(elapsed / 6) % 2 === 0) {
          this.drawBannerText(ctx, w, "START!", 44);
        }
      }
    }

  function padScore5(n) {

  function padCount2(n) {

  // ファミコン風タイマー表記（25.00 -> 00.00、小数2桁は3F=5刻みで大雑把に進める）
  function formatBattleTimer(remainFrames) {
    const rem = Math.max(0, remainFrames | 0);
    const sec = Math.floor(rem / 60);
    const subF = rem % 60;
    const coarseCentis = Math.floor(subF / 3) * 5;
    return String(sec).padStart(2, "0") + "." + String(coarseCentis).padStart(2, "0");
  }

  const R = root.BreakerRender;
  if (!R || !R.Renderer) return;

  Object.assign(R.Renderer.prototype, {
    drawPixelText5x7(ctx, text, x, y, options = {}) {
      const str = String(text || "").toUpperCase();
      if (!str) return;
      const scale = options.scale || 1;
      const color = options.color || "#ffffff";
      const outline = options.outlineColor !== undefined ? options.outlineColor : "#050810";
      const align = options.align || "left";
      const stepX = 6 * scale;
      const totalW = Math.max(0, str.length * stepX - scale);

      let startX = Math.round(x);
      if (align === "center") {
        startX = Math.round(x - totalW / 2);
      } else if (align === "right") {
        startX = Math.round(x - totalW);
      }
      const startY = Math.round(y);

      const drawGlyphs = (ox, oy, fill) => {
        ctx.fillStyle = fill;
        for (let i = 0; i < str.length; i++) {
          const glyph = FONT_5X7[str[i]] || FONT_5X7[" "];
          const gx = startX + i * stepX + ox;
          for (let r = 0; r < 7; r++) {
            const line = glyph[r];
            for (let c = 0; c < 5; c++) {
              if (line[c] === "1") {
                ctx.fillRect(gx + c * scale, startY + r * scale + oy, scale, scale);

        drawGlyphs(d, 0, shadow);
        drawGlyphs(0, d, shadow);
        drawGlyphs(d, d, shadow);
      }
      drawGlyphs(0, 0, color);

    drawBattlePopups(world) {

      if (!battle || !battle.popups || battle.popups.length === 0) return;
      const ctx = this.ctx;

      for (let i = 0; i < battle.popups.length; i++) {
        const p = battle.popups[i];
        const blink = p.timer <= 8 && (p.timer & 1) === 1;
        if (blink) continue;
        const textColor = p.byPlayer
          ? (p.isAction ? "#98f4ff" : "#ffffff")
          : (p.isAction ? "#ffb0a0" : "#ffe878");
        const outlineColor = p.byPlayer ? "#105898" : "#981e10";
        this.drawPixelText5x7(ctx, String(p.points), p.x, p.y, {
          scale: 1,
          color: textColor,
          outlineColor,
          align: "center"

    },

    drawBattleHUD(world) {
      const battle = world.battleManager;
      if (!battle) return;
      const ctx = this.ctx;
      const w = world.worldWidth;
      const centerX = Math.round(w / 2);

      // 左スコア（プレイヤー）
      this.drawPixelText7x7(ctx, "PLAYER", 6, 3, {
        scale: 1,
        color: "#5ce4ff",
        shadowColor: "#040814",
        align: "left"
      });
      this.drawPixelText7x7(ctx, padScore5(battle.scores.player.total), 6, 12, {
        scale: 1,
        color: "#ffffff",
        shadowColor: "#040814",
        align: "left"
      });

      // 右スコア（ハンター）
      this.drawPixelText7x7(ctx, "HUNTER", w - 6, 3, {
        scale: 1,
        color: "#ff724c",
        shadowColor: "#040814",
        align: "right"
      });
      this.drawPixelText7x7(ctx, padScore5(battle.scores.hunter.total), w - 6, 12, {
        scale: 1,
        color: "#ffffff",
        shadowColor: "#040814",
        align: "right"
      });

      // 中央ファミコン風タイマー枠
      const boxW = 48;
      const boxH = 17;
      const bx = centerX - Math.floor(boxW / 2);
      const by = 2;

      ctx.fillStyle = "#04060e";
      ctx.fillRect(bx + 1, by, boxW - 2, boxH);
      ctx.fillRect(bx, by + 1, boxW, boxH - 2);

      ctx.fillStyle = "#e8f2ff";
      ctx.fillRect(bx + 1, by, boxW - 2, 1);
      ctx.fillRect(bx + 1, by + boxH - 1, boxW - 2, 1);
      ctx.fillRect(bx, by + 1, 1, boxH - 2);
      ctx.fillRect(bx + boxW - 1, by + 1, 1, boxH - 2);

      ctx.fillStyle = "#3c84e8";
      ctx.fillRect(bx + 1, by + 1, boxW - 2, 1);
      ctx.fillRect(bx + 1, by + boxH - 2, boxW - 2, 1);
      ctx.fillRect(bx + 1, by + 1, 1, boxH - 2);
      ctx.fillRect(bx + boxW - 2, by + 1, 1, boxH - 2);

      ctx.fillStyle = "#081024";
      ctx.fillRect(bx + 2, by + 2, boxW - 4, boxH - 4);

      ctx.fillStyle = "#ffd058";
      ctx.fillRect(bx + 2, by + 2, 1, 1);
      ctx.fillRect(bx + boxW - 3, by + 2, 1, 1);
      ctx.fillRect(bx + 2, by + boxH - 3, 1, 1);
      ctx.fillRect(bx + boxW - 3, by + boxH - 3, 1, 1);

      const timeStr = formatBattleTimer(battle.remainFrames);
      let timeColor = "#ffffff";
      if (battle.remainFrames <= 300) {
        timeColor = ((world.f >> 3) & 1) ? "#ff5244" : "#ffe070";
      } else if (battle.remainFrames <= 600) {
        timeColor = "#ffe070";

      this.drawPixelText7x7(ctx, timeStr, centerX, by + 5, {
        scale: 1,
        color: timeColor,
        shadowColor: "#040814",
        align: "center"
