    drawBattleOverlay(world) {
      const battle = world.battleManager;
      if (!battle) return;
      const ctx = this.ctx;
      const w = world.worldWidth;
      const h = this.viewHeight;

      if (battle.ended) {
        if (battle.resultPhase === 1) {
          this.drawBannerText(ctx, w, battle.endReason || "TIME UP!", 100);
          return;
        }
        if (battle.resultPhase === 2) {
          ctx.fillStyle = "rgba(4, 6, 14, 0.88)";
          ctx.fillRect(0, 0, w, h);

          const t = battle.resultTimer || 0;
          const leftCx = Math.round(w * 0.25);
          const rightCx = Math.round(w * 0.75);
          const midX = Math.round(w / 2);

          // タイトル
          this.drawPixelText7x7(ctx, "RESULT", midX, 10, {
            scale: 2,
            color: "#ffe868",
            shadowColor: "#000000",
            align: "center"
          });

          // 中央の縦区切り（点線）
          ctx.fillStyle = "#3a4c70";
          for (let yy = 32; yy <= 178; yy += 6) {
            ctx.fillRect(midX - 1, yy, 2, 3);
          }

          // 左右プレイヤー見出し
          this.drawPixelText7x7(ctx, "PLAYER", leftCx, 30, {
            scale: 1,
            color: "#5ce4ff",
            shadowColor: "#000000",
            align: "center"
          });
          this.drawPixelText7x7(ctx, "HUNTER", rightCx, 30, {
            scale: 1,
            color: "#ff724c",
            shadowColor: "#000000",
            align: "center"
          });

          const ps = battle.scores.player;
          const hs = battle.scores.hunter;

          // 壁・通常オブジェクト破壊内訳 200*N, 400*N, 600*N
          const objRows = [
            { label: "200*", key: "c200", at: 15, color: "#ffffff", y: 45 },
            { label: "400*", key: "c400", at: 35, color: "#98f0ff", y: 65 },
            { label: "600*", key: "c600", at: 55, color: "#ffe870", y: 85 }
          ];

          for (let i = 0; i < objRows.length; i++) {
            const row = objRows[i];
            if (t < row.at) continue;
            this.drawPixelText7x7(ctx, row.label + padCount2(ps[row.key]), leftCx, row.y, {
              scale: 2,
              color: row.color,
              shadowColor: "#000000",
              align: "center"
            });
            this.drawPixelText7x7(ctx, row.label + padCount2(hs[row.key]), rightCx, row.y, {
              scale: 2,
              color: row.color,
              shadowColor: "#000000",
              align: "center"
            });
          }

          // アクション枠（敵表裏移動・敵落とし・相手落とし：すべて400点）
          if (t >= 75) {
            this.drawPixelText7x7(ctx, "ACTION", leftCx, 107, {
              scale: 1,
              color: "#ff90a8",
              shadowColor: "#000000",
              align: "center"
            });
            this.drawPixelText7x7(ctx, "ACTION", rightCx, 107, {
              scale: 1,
              color: "#ff90a8",
              shadowColor: "#000000",
              align: "center"
            });

            this.drawPixelText7x7(ctx, "400*" + padCount2(ps.cAction), leftCx, 117, {
              scale: 2,
              color: "#ff90a8",
              shadowColor: "#000000",
              align: "center"
            });
            this.drawPixelText7x7(ctx, "400*" + padCount2(hs.cAction), rightCx, 117, {
              scale: 2,
              color: "#ff90a8",
              shadowColor: "#000000",
              align: "center"

          // 少し間を置いて合計点
          if (t >= 110) {
            ctx.fillStyle = "#526890";
            ctx.fillRect(14, 140, midX - 24, 2);
            ctx.fillRect(midX + 10, 140, midX - 24, 2);

            this.drawPixelText7x7(ctx, "TOTAL", leftCx, 148, {
              scale: 1,
              color: "#a8c0e8",
              shadowColor: "#000000",
              align: "center"
            });
            this.drawPixelText7x7(ctx, "TOTAL", rightCx, 148, {
              scale: 1,
              color: "#a8c0e8",
              shadowColor: "#000000",
              align: "center"
            });

            this.drawPixelText7x7(ctx, padScore5(ps.total), leftCx, 160, {
              scale: 2,
              color: "#ffffff",
              shadowColor: "#000000",
              align: "center"
            });
            this.drawPixelText7x7(ctx, padScore5(hs.total), rightCx, 160, {
              scale: 2,
              color: "#ffffff",
              shadowColor: "#000000",
              align: "center"
            });
          }

          // 最後に勝者発表
          if (t >= 150) {
            let winText = "DRAW GAME!";
            let winColor = "#ffe868";
            if (ps.total > hs.total) {
              winText = "PLAYER WIN!";
              winColor = ((t >> 3) & 1) ? "#68f0ff" : "#ffffff";
            } else if (hs.total > ps.total) {
              winText = "HUNTER WIN!";
              winColor = ((t >> 3) & 1) ? "#ff7a52" : "#ffe080";
            }
            this.drawPixelText7x7(ctx, winText, midX, 192, {
              scale: 2,
              color: winColor,
              shadowColor: "#000000",
              align: "center"
            });
          }

          if (battle.resultFinished && ((t >> 4) & 1) === 0) {
            this.drawPixelText7x7(ctx, "PRESS HAMMER", midX, 222, {
              scale: 1,
              color: "#b4c8e8",
              shadowColor: "#000000",
              align: "center"
            });
          }
        }
        return;
      }

      if (world.introActive) {
        this.drawBannerText(ctx, w, "VS HUNTER", 44);
      } else if (world.startBannerTimer > 0) {
        const elapsed = Math.max(0, 72 - world.startBannerTimer);
        if (Math.floor(elapsed / 6) % 2 === 0) {
          this.drawBannerText(ctx, w, "START!", 44);
        }
      }
    }
  });

    const c = document.createElement("canvas");
    c.width = w;

    const g = c.getContext("2d");
    for (let y = 0; y < h; y++) {
      const line = rows[y] || "";
      for (let x = 0; x < w; x++) {
        const color = palette[line[x]];
        if (!color) continue;
        g.fillStyle = color;
        g.fillRect(x, y, 1, 1);
      }
    }
    return c;
  }

      ctx.fillRect(x + 2, yTop + 11, 1, 17);
      ctx.fillRect(x + 13, yTop + 11, 1, 17);

      // 内側のホログラム背景光（開くと明るく点灯）
      ctx.fillStyle = isLit ? "rgba(44, 214, 255, 0.20)" : "rgba(32, 110, 160, 0.14)";
      ctx.fillRect(x + 4, yTop + 12, 8, 15);
      if (isLit) {
        // 台座からの浮遊リフタービーム
        ctx.fillStyle = "rgba(110, 240, 255, 0.28)";
        ctx.fillRect(x + 5, yTop + 23, 6, 5);
      }

      // 2. 内部の空飛ぶシューズ（開放時は上下浮遊＆足裏から炎）
      let shoeY = yTop + 17;
      let showFlame = false;
      if (phase === "open") {
        shoeY = yTop + 15 + Math.round(Math.sin(f * 0.14) * 1.5);
        showFlame = true;
      } else if (phase === "igniting") {
        const t = Math.max(0, 60 - remain - 45); // 0..14
        shoeY = yTop + 16 - (t >= 7 ? 1 : 0);
        showFlame = t >= 3;
      } else if (phase === "sliding") {
        shoeY = yTop + 17 - (openProgress >= 0.5 ? 1 : 0);
        showFlame = openProgress >= 0.85;
      }
      this.drawShoeIconWithFlame(ctx, x + 3, shoeY, showFlame, f);

      // 3. 前面円柱ガラスカバー＆スライドシャッター（閉鎖時および1.0秒開閉中のみ）
      if (!isOpenEnough) {
        const coverMaxH = 8;
        const coverH = Math.max(0, Math.round((1 - openProgress) * coverMaxH));

        if (coverH > 0) {
          // 上側シャッター/強化ガラス（yTop+11 から下へ coverH）
          ctx.fillStyle = "rgba(64, 200, 248, 0.28)";
          ctx.fillRect(x + 2, yTop + 11, 12, coverH);
          // 下側シャッター/強化ガラス（yTop+28-coverH から上へ）
          ctx.fillRect(x + 2, yTop + 28 - coverH, 12, coverH);

          // 円柱の丸み縦ガラスハイライト
          ctx.fillStyle = "rgba(215, 248, 255, 0.55)";
          ctx.fillRect(x + 3, yTop + 11, 1, coverH);
          ctx.fillRect(x + 3, yTop + 28 - coverH, 1, coverH);
          ctx.fillStyle = "rgba(18, 48, 86, 0.35)";
          ctx.fillRect(x + 12, yTop + 11, 1, coverH);
          ctx.fillRect(x + 12, yTop + 28 - coverH, 1, coverH);

          // シャッター内側のメタリック縁（開いていく口）
          ctx.fillStyle = "#627b9e";
          ctx.fillRect(x + 2, yTop + 11 + coverH - 1, 12, 1);
          ctx.fillRect(x + 2, yTop + 28 - coverH, 12, 1);
        }

        // ロック解除瞬間（0..15F）のロッククランプ＆解除フラッシュ
        if (phase === "closed") {
          ctx.fillStyle = "#36465f";
          ctx.fillRect(x + 2, yTop + 18, 3, 3);
          ctx.fillRect(x + 11, yTop + 18, 3, 3);
          ctx.fillStyle = "#ff5a3a";
          ctx.fillRect(x + 3, yTop + 19, 1, 1);
          ctx.fillRect(x + 12, yTop + 19, 1, 1);
        } else if (phase === "unlock") {
          const flash = ((f >> 1) & 1) === 0;
          const clampShift = Math.floor(((60 - remain) / 15) * 2);
          ctx.fillStyle = flash ? "#ffffff" : "#64f0ff";
          ctx.fillRect(x + 2, yTop + 18, Math.max(1, 3 - clampShift), 3);
          ctx.fillRect(x + 11 + clampShift, yTop + 18, Math.max(1, 3 - clampShift), 3);
          if (flash) {
            ctx.fillStyle = "rgba(180, 248, 255, 0.35)";
            ctx.fillRect(x + 2, yTop + 11, 12, 17);
          }
        } else if (phase === "sliding") {
          // スライド中に左右へわずかに噴くシアン蒸気ドット
          const puff = (f >> 1) & 1;
          ctx.fillStyle = "rgba(170, 245, 255, 0.65)";
          ctx.fillRect(x + 1, yTop + 18 + puff, 1, 1);
          ctx.fillRect(x + 14, yTop + 19 - puff, 1, 1);
        }
      }

      // 4. 上部SF円柱キャップ（yTop + 7 .. 10）
      ctx.fillStyle = "#324159";
      ctx.fillRect(x + 2, yTop + 7, 12, 4);
      ctx.fillStyle = "#8ea6c4";
      ctx.fillRect(x + 3, yTop + 7, 10, 1);
      ctx.fillStyle = "#5c7394";
      ctx.fillRect(x + 2, yTop + 8, 12, 2);
      ctx.fillStyle = "#1c2434";
      ctx.fillRect(x + 2, yTop + 10, 12, 1);

      // キャップ中央の状態ランプ
      let lampColor = "#ff4430";
      if (phase === "closed") {
        lampColor = ((f >> 4) & 1) ? "#ff5838" : "#a82418";
      } else if (phase === "unlock") {
        lampColor = ((f >> 1) & 1) ? "#ffffff" : "#58ffa8";
      } else {
        lampColor = "#48f8ff";
      }
      ctx.fillStyle = lampColor;
      ctx.fillRect(x + 7, yTop + 8, 2, 2);

      // 5. 下部SF円柱台座（yTop + 28 .. 31）
      ctx.fillStyle = "#5e7594";
      ctx.fillRect(x + 2, yTop + 28, 12, 1);
      ctx.fillStyle = "#2b384e";
      ctx.fillRect(x + 1, yTop + 29, 14, 3);
      ctx.fillStyle = "#98b0ce";
      ctx.fillRect(x + 3, yTop + 28, 4, 1);
      ctx.fillStyle = isLit ? "#46f4ff" : "#22608a";
      ctx.fillRect(x + 4, yTop + 30, 8, 1);
      ctx.fillStyle = "#121824";
      ctx.fillRect(x + 1, yTop + 31, 14, 1);
    },

    drawDarkStainlessWall(ctx, x, yTop, hp, frame) {
      if (!this.darkStainlessWallSprites) {
        this.darkStainlessWallSprites = {
          full: bakeTile16x24(DARK_STAINLESS_FULL, DARK_STAINLESS_PALETTE),
          mid: bakeTile16x24(DARK_STAINLESS_MID, DARK_STAINLESS_PALETTE),
          damaged: bakeTile16x24(DARK_STAINLESS_DAMAGED, DARK_STAINLESS_PALETTE)
        };
      }
      let img = this.darkStainlessWallSprites.full;
      let rows = DARK_STAINLESS_FULL;
      if (hp === 2) {
        img = this.darkStainlessWallSprites.mid;
        rows = DARK_STAINLESS_MID;
      } else if (hp <= 1) {
        img = this.darkStainlessWallSprites.damaged;
        rows = DARK_STAINLESS_DAMAGED;
      }
      ctx.drawImage(img, x, yTop + 8);

      // 10秒(600F)に1回、欠けや穴を避けて金属部分のみに走る地味なツヤエフェクト（新3回壁のみ）
      const cycle = ((frame || 0) >>> 0) % 600;
      const shineStart = 582;
      if (cycle >= shineStart) {
        const t = cycle - shineStart; // 0 .. 17 (0.3秒間)
        const diag = -2 + t * 2.2;
        ctx.save();
        ctx.fillStyle = "rgba(220, 236, 255, 0.22)";
        for (let ry = 1; ry <= 21; ry++) {
          const line = rows[ry];
          const cx = Math.round(diag - ry);
          for (let dx = 0; dx < 2; dx++) {
            const gx = 1 + cx + dx;
            if (gx < 1 || gx > 14) continue;
            const ch = line[gx];
            if (!ch || ch === "." || ch === "B" || ch === "K") continue;
            ctx.fillRect(x + gx, yTop + 8 + ry, 1, 1);
          }
        }
        ctx.restore();
      }
    },

    drawServerWall(ctx, x, yTop, hp) {
      if (!this.serverWallSprites) {
        this.serverWallSprites = {
          full: bakeTile16x24(SERVER_WALL_FULL, SERVER_PALETTE),
          damaged: bakeTile16x24(SERVER_WALL_DAMAGED, SERVER_PALETTE)
        };
      }
      const img = hp <= 1 ? this.serverWallSprites.damaged : this.serverWallSprites.full;
      ctx.drawImage(img, x, yTop + 8);
    },

      // ラック2段目：中身・基板・ヒートシンク剥き出し棚 (yTop+16 .. yTop+19)
      ctx.fillStyle = "#d88838";

    drawSandLadder(ctx, x, yTop, frame) {
      ctx.save();
      // 半透明の砂色ハシゴ本体（左右柱 x+1 / x+13）
      ctx.globalAlpha = 0.48;
      ctx.fillStyle = "#9c7e48";
      ctx.fillRect(x + 1, yTop, 2, 32);
      ctx.fillRect(x + 13, yTop, 2, 32);
      const step = Math.max(1, LADDER_STEP);
      for (let ry = 1; ry < 32; ry += step) {
        if (LADDER_BAR_HEIGHT > 0) {
          ctx.fillStyle = "#d8bc7c";
          ctx.fillRect(x + 2, yTop + ry, 12, LADDER_BAR_HEIGHT);
        }
        if (LADDER_SHADOW_HEIGHT > 0) {
          ctx.fillStyle = "#846838";
          ctx.fillRect(x + 2, yTop + ry + LADDER_BAR_HEIGHT, 12, LADDER_SHADOW_HEIGHT);
        }
      }

      // ハシゴ幅（x+1 .. x+14）から絶対にはみ出ない控えめな砂嵐エフェクト
      ctx.beginPath();
      ctx.rect(x + 1, yTop, 14, 32);
      ctx.clip();
      const f = Math.max(0, frame | 0);
      const rows = [
        { y: 5, speed: 1, len: 3, off: 0, alpha: 0.28 },
        { y: 13, speed: 2, len: 2, off: 6, alpha: 0.24 },
        { y: 21, speed: 1, len: 3, off: 10, alpha: 0.30 },
        { y: 29, speed: 2, len: 2, off: 3, alpha: 0.24 }
      ];
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const px = (f * r.speed + r.off) % 14;
        ctx.globalAlpha = r.alpha;
        ctx.fillStyle = (i & 1) ? "#dfc88e" : "#cbb074";
        for (let dx = 0; dx < r.len; dx++) {
          const sx = x + 1 + ((13 - ((px + dx) % 14) + 14) % 14);
          ctx.fillRect(sx, yTop + r.y, 1, 1);
        }
      }
      ctx.restore();
    },

    drawCrumblingLadder(ctx, x, yTop, stage, frame) {
      const blink = ((frame >> 1) & 1) === 0;
      const sideColor = stage <= 2 && blink ? "#ffd0e0" : "#b84468";
      const rungColor = stage <= 2 && blink ? "#ffffff" : "#ff88a8";
      const rungShadow = stage <= 2 && blink ? "#e0a0b8" : "#a8385c";

      if (stage >= 4) {
        ctx.fillStyle = sideColor;
        ctx.fillRect(x + 1, yTop + 1, 2, 30);
        ctx.fillRect(x + 13, yTop + 1, 2, 30);
        const step = Math.max(1, LADDER_STEP);
        for (let ry = 1; ry < 32; ry += step) {
          if (LADDER_BAR_HEIGHT > 0) {
            ctx.fillStyle = rungColor;
            ctx.fillRect(x + 2, yTop + ry, 5, LADDER_BAR_HEIGHT);
            ctx.fillRect(x + 9, yTop + ry, 5, LADDER_BAR_HEIGHT);
          }
          if (LADDER_SHADOW_HEIGHT > 0) {
            ctx.fillStyle = rungShadow;
            ctx.fillRect(x + 2, yTop + ry + LADDER_BAR_HEIGHT, 5, LADDER_SHADOW_HEIGHT);
            ctx.fillRect(x + 9, yTop + ry + LADDER_BAR_HEIGHT, 5, LADDER_SHADOW_HEIGHT);
          }
        }
      } else if (stage === 3) {
        ctx.fillStyle = sideColor;
        ctx.fillRect(x + 1, yTop + 3, 2, 11);
        ctx.fillRect(x + 1, yTop + 18, 2, 11);
        ctx.fillRect(x + 13, yTop + 5, 2, 11);
        ctx.fillRect(x + 13, yTop + 20, 2, 9);
        ctx.fillStyle = rungColor;
        for (let ry = 4; ry < 29; ry += 5) {
          ctx.fillRect(x + 2, yTop + ry, 4, 2);
          ctx.fillRect(x + 10, yTop + ry, 4, 2);
        }
      } else if (stage === 2) {
        ctx.fillStyle = sideColor;
        ctx.fillRect(x + 1, yTop + 6, 2, 7);
        ctx.fillRect(x + 13, yTop + 17, 2, 8);
        ctx.fillStyle = rungColor;
        ctx.fillRect(x + 2, yTop + 8, 4, 2);
        ctx.fillRect(x + 10, yTop + 19, 4, 2);
        ctx.fillRect(x + 6, yTop + 13, 4, 2);
      } else {
        ctx.fillStyle = rungColor;
        ctx.fillRect(x + 2, yTop + 7, 2, 3);
        ctx.fillRect(x + 12, yTop + 14, 2, 3);
        ctx.fillRect(x + 5, yTop + 22, 3, 2);
      }
    },

    drawPillar(ctx, x, yTop) {
      // 上下フランジ＋中央I字ビーム鉄柱（背景扱いで素通り可）
      ctx.fillStyle = "#526074";

      ctx.fillRect(x + 2, yTop + 28, 12, 4);
      ctx.fillStyle = "#98acc4";
      ctx.fillRect(x + 2, yTop + 1, 12, 1);
      ctx.fillRect(x + 2, yTop + 29, 12, 1);

      ctx.fillStyle = "#485468";
      ctx.fillRect(x + 5, yTop + 4, 6, 24);
      ctx.fillStyle = "#7a8da6";
      ctx.fillRect(x + 6, yTop + 4, 4, 24);
      ctx.fillStyle = "#b4c8e0";
      ctx.fillRect(x + 7, yTop + 4, 1, 24);

      // リベット・継手
      ctx.fillStyle = "#262e3c";
      ctx.fillRect(x + 3, yTop + 1, 2, 2);
      ctx.fillRect(x + 11, yTop + 1, 2, 2);
      ctx.fillRect(x + 3, yTop + 29, 2, 2);
      ctx.fillRect(x + 11, yTop + 29, 2, 2);
      ctx.fillRect(x + 5, yTop + 15, 6, 2);
    },

    drawPillarCrumbling(ctx, x, yTop, stage, frame) {
      const blink = ((frame >> 1) & 1) === 0;
      const h = Math.max(4, stage * 5);
      const offsetY = 32 - h;
      ctx.fillStyle = stage <= 2 && blink ? "#d8e6f8" : "#627288";
      ctx.fillRect(x + 5, yTop + offsetY, 6, h);
      ctx.fillStyle = blink ? "#ffffff" : "#98acc4";
      ctx.fillRect(x + 6, yTop + offsetY, 2, Math.max(2, h - 2));
      ctx.fillStyle = "#404c5c";
      ctx.fillRect(x + 2, yTop + 28, 12, 4);
    },

    drawDoor(ctx, x, yTop, tile, frame) {
      const base = tile & 0xf7;
      let panelW = 6; // 閉じた状態: 左右各6px
      let lampColor = "#2c4c50";

      if (base === TILE.DOOR_OPENING_1 || base === TILE.DOOR_CLOSING_2) {
        panelW = 4;
        if (base === TILE.DOOR_OPENING_1) {
          lampColor = (tile & 0x08) ? "#ff7840" : "#b8ffff";
        } else {
          lampColor = "#f0c048";
        }
      } else if (base === TILE.DOOR_OPENING_2 || base === TILE.DOOR_CLOSING_1) {
        panelW = 2;
        if (base === TILE.DOOR_OPENING_2) {
          lampColor = (tile & 0x08) ? "#ff7840" : "#b8ffff";
        } else {
          lampColor = "#f0c048";
        }
      } else if (base === TILE.DOOR_OPEN) {

      ctx.fillRect(x + 1, doorTop, 14, 3);
      ctx.fillRect(x + 1, panelTop, 1, panelH);
      ctx.fillRect(x + 14, panelTop, 1, panelH);
      ctx.fillStyle = "#6cc8c8";
      ctx.fillRect(x + 2, doorTop, 12, 1);
      ctx.fillStyle = "#245458";
      ctx.fillRect(x + 2, doorTop + 2, 12, 1);

      ctx.fillStyle = lampColor;
      ctx.fillRect(x + 7, doorTop + 1, 2, 1);

      if (panelW === 0) {

      if (panelW > 0) {

        const rx = x + 14 - panelW;

        ctx.fillStyle = "#3c8c8c";
        ctx.fillRect(lx, panelTop, panelW, panelH);
        ctx.fillRect(rx, panelTop, panelW, panelH);

        ctx.fillStyle = "#68c8c4";
        ctx.fillRect(lx, panelTop + 1, Math.max(1, panelW - 1), panelH - 2);
        ctx.fillRect(rx + 1, panelTop + 1, Math.max(1, panelW - 1), panelH - 2);

          ctx.fillStyle = "#162d38";
          ctx.fillRect(lx + 1, winTop, panelW - 2, 6);
          ctx.fillRect(rx + 1, winTop, panelW - 2, 6);
          ctx.fillStyle = "#a8f0f0";
          ctx.fillRect(lx + 1, winTop, 1, 2);
          ctx.fillRect(rx + 1, winTop, 1, 2);
        }
        ctx.fillStyle = "#1c3c40";
        ctx.fillRect(lx + panelW - 1, panelTop, 1, panelH);
        ctx.fillRect(rx, panelTop, 1, panelH);
      }
    },

    drawBreakableWall(ctx, x, yTop, tile, frame) {
      const hp = tile & 0x07;
      const group = tile & 0x70; // 0x40=1回壁, 0x10=2回壁, 0x20=3回壁

      if (group === 0x40) {
        // 1回壊せる壁（木箱の中身剥き出しラック）
        this.drawCrateRackWall(ctx, x, yTop);
      } else if (group === 0x10) {

        this.drawServerWall(ctx, x, yTop, hp);

      ctx.fillStyle = sparkOn ? "#fff058" : "#ff5820";
      ctx.fillRect(x + 8, yTop + 6, 3, 3);
      ctx.fillStyle = sparkOn ? "#ffffff" : "#ffb838";

      ctx.fillStyle = "#b88230";

    drawTimedBomb(ctx, x, yTop, tb, frame) {

      const isRedBlink = !!(tb && tb.remainFrames <= 600 && (Math.floor((600 - tb.remainFrames) / 30) % 2 === 0));
      // 針の向き（5秒=300Fごとに1段階反時計回り: 60s=12時, 45s=9時, 30s=6時, 15s=3時, 0s=12時）
      const step = tb ? (Math.ceil(Math.max(1, tb.remainFrames) / 300) % 12) : 6;
      const handDots = TIMED_BOMB_HANDS[step] || TIMED_BOMB_HANDS[0];

      const bodyDark = isRedBlink ? "#6e1010" : "#1c2336";
      const bodyMid = isRedBlink ? "#d42820" : "#344262";
      const bodyLight = isRedBlink ? "#ff6850" : "#5e749c";
      const bezelColor = isRedBlink ? "#e02018" : "#2e3c54";
      const bezelHi = isRedBlink ? "#ff8870" : "#7c94bc";
      const faceBg = isRedBlink ? "#ffc4c4" : "#f4f6fc";
      const tickColor = isRedBlink ? "#901818" : "#54627c";
      const handColor = isRedBlink ? "#5a0606" : "#141a28";
      const pinColor = isRedBlink ? "#ff2020" : "#e03028";

      // 爆弾本体（下部のベース筐体）
      ctx.fillStyle = bodyDark;
      ctx.fillRect(x + 2, yTop + 20, 12, 11);
      ctx.fillRect(x + 1, yTop + 22, 14, 8);
      ctx.fillStyle = bodyMid;
      ctx.fillRect(x + 3, yTop + 21, 9, 9);
      ctx.fillStyle = bodyLight;
      ctx.fillRect(x + 3, yTop + 22, 2, 6);

      // 警告バンド＆リベット
      ctx.fillStyle = isRedBlink ? "#ffe868" : "#e89828";
      ctx.fillRect(x + 4, yTop + 26, 8, 2);
      ctx.fillStyle = isRedBlink ? "#ffffff" : "#8094b8";
      ctx.fillRect(x + 2, yTop + 23, 1, 1);
      ctx.fillRect(x + 13, yTop + 23, 1, 1);

      // 時計上部の小さなボタン・竜頭
      ctx.fillStyle = bezelHi;
      ctx.fillRect(x + 7, yTop + 3, 3, 2);

      // 大きめのアナログ時計 外枠（15×15px: 中心 cx=x+8, cy=yTop+12）
      const cx = x + 8;
      const cy = yTop + 12;
      ctx.fillStyle = bezelColor;
      ctx.fillRect(cx - 3, cy - 7, 7, 15);
      ctx.fillRect(cx - 5, cy - 6, 11, 13);
      ctx.fillRect(cx - 6, cy - 5, 13, 11);
      ctx.fillRect(cx - 7, cy - 3, 15, 7);

      ctx.fillRect(cx - 3, cy - 7, 7, 1);
      ctx.fillRect(cx - 5, cy - 6, 2, 1);
      ctx.fillRect(cx + 4, cy - 6, 2, 1);

      ctx.fillStyle = faceBg;
      ctx.fillRect(cx - 3, cy - 6, 7, 13);
      ctx.fillRect(cx - 4, cy - 5, 9, 11);
      ctx.fillRect(cx - 5, cy - 4, 11, 9);
      ctx.fillRect(cx - 6, cy - 3, 13, 7);

      // 12時（赤目盛）・3時・6時・9時の目盛ドット
      ctx.fillStyle = "#e02420";
      ctx.fillRect(cx, cy - 6, 1, 1);
      ctx.fillStyle = tickColor;
      ctx.fillRect(cx + 6, cy, 1, 1);
      ctx.fillRect(cx, cy + 6, 1, 1);
      ctx.fillRect(cx - 6, cy, 1, 1);

      ctx.fillStyle = handColor;
      for (let i = 0; i < handDots.length; i++) {

      // 針の中心ピン
      ctx.fillStyle = pinColor;
      ctx.fillRect(cx, cy, 1, 1);
    },

    drawTileAt(ctx, x, yTop, val, world, isFalling = false) {
      if (val === TILE.EMPTY || isHoleTile(val) || val === TILE.HOLE_FALLING || val === TILE.DRUM_FALLING) {
        return;
      }

      const step = Math.max(1, LADDER_STEP);
      if (val === TILE.LADDER) {
        ctx.fillStyle = "#d89040";
        ctx.fillRect(x + 1, yTop, 2, 32);
        ctx.fillRect(x + 13, yTop, 2, 32);
        for (let ry = 1; ry < 32; ry += step) {
          if (LADDER_BAR_HEIGHT > 0) {
            ctx.fillStyle = "#f8c068";
            ctx.fillRect(x + 2, yTop + ry, 12, LADDER_BAR_HEIGHT);
          }
          if (LADDER_SHADOW_HEIGHT > 0) {

            ctx.fillRect(x + 2, yTop + ry + LADDER_BAR_HEIGHT, 12, LADDER_SHADOW_HEIGHT);

      } else if (val === TILE.BREAK_LADDER) {
        ctx.fillStyle = "#b84468";
        ctx.fillRect(x + 1, yTop, 2, 32);
        ctx.fillRect(x + 13, yTop, 2, 32);
        for (let ry = 1; ry < 32; ry += step) {
          if (LADDER_BAR_HEIGHT > 0) {
            ctx.fillStyle = "#ff88a8";
            ctx.fillRect(x + 2, yTop + ry, 5, LADDER_BAR_HEIGHT);
            ctx.fillRect(x + 9, yTop + ry, 5, LADDER_BAR_HEIGHT);
          }
          if (LADDER_SHADOW_HEIGHT > 0) {
            ctx.fillStyle = "#a8385c";
            ctx.fillRect(x + 2, yTop + ry + LADDER_BAR_HEIGHT, 5, LADDER_SHADOW_HEIGHT);
            ctx.fillRect(x + 9, yTop + ry + LADDER_BAR_HEIGHT, 5, LADDER_SHADOW_HEIGHT);
          }
        }
      } else if (isCrumblingLadderTile(val)) {
        const info = world.getCrumblingInfo ? world.getCrumblingInfo(Math.floor(yTop / 32), Math.floor(x / 16)) : null;
        const stage = info ? info.stage : (val & 0x07);
        this.drawCrumblingLadder(ctx, x, yTop, stage, world.f);
      } else if (val === TILE.PILLAR) {
        this.drawPillar(ctx, x, yTop);
      } else if (isPillarCrumblingTile(val)) {
        const stage = val & 0x07;
        this.drawPillarCrumbling(ctx, x, yTop, stage, world.f);
      } else if (val === TILE.DOOR || isDoorRelatedTile(val)) {
        this.drawDoor(ctx, x, yTop, val, world.f);
      } else if (val === TILE.DRUM) {
        let trapped = null;
        if (!isFalling && world && typeof world.getDrumTrappedActor === "function") {
          const row = Math.floor(yTop / 32);
          const col = Math.floor(x / 16);
          trapped = world.getDrumTrappedActor(row, col);
        }
        this.drawDrum(ctx, x, yTop, trapped);
      } else if (val === TILE.KEY) {
        this.drawKey(ctx, x, yTop, world.f);
      } else if (val === TILE.SHOE_POD) {
        this.drawShoePod(ctx, x, yTop, world);
      } else if (val === TILE.BOMB) {
        this.drawBomb(ctx, x, yTop, world.f);
      } else if (val === TILE.TIMED_BOMB) {
        const row = Math.floor(yTop / 32);
        const col = Math.floor(x / 16);
        const tb = world.getTimedBombAt ? world.getTimedBombAt(row, col) : null;
        this.drawTimedBomb(ctx, x, yTop, tb, world.f);
      } else if ((val & 0x80) !== 0) {
        this.drawBreakableWall(ctx, x, yTop, val, world.f);
      }
    },

    drawFallingPillars(ctx, world) {
      if (!world.fallingPillars || world.fallingPillars.length === 0) return;
      for (const fp of world.fallingPillars) {
        const dropOffsetY = (fp.stage - 1) * 8;
        const x = fp.col * 16;
        const yTop = fp.row * 32 + dropOffsetY;
        const floorY = yTop + 32;

        // 滞空・落下する「白い床板」パーツ
        ctx.fillStyle = "#b8c8e8";
        ctx.fillRect(x, floorY, 16, 6);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, floorY, 16, 2);
        ctx.fillStyle = "#788cb8";
        ctx.fillRect(x + 2, floorY + 3, 12, 2);

        if (!fp.isFloorOnly) {
          if (fp.origAboveTile === TILE.TIMED_BOMB && fp.timedBomb) {
            this.drawTimedBomb(ctx, x, yTop, fp.timedBomb, world.f);
          } else {
            this.drawTileAt(ctx, x, yTop, fp.origAboveTile, world, true);
          }
        }
      }
    },

    // 電磁球の予備フォールバック描画（char_orb.js がロードされていれば上書きされる）
    drawOrb(ob) {
      if (!ob || ob.animStage < 0) return;
      const ctx = this.ctx;
      const cx = Math.round(ob.x + 8);
      const cy = Math.round(ob.y - 13);
      const r = ob.animStage === 0 ? 2 : (ob.animStage === 1 ? 4 : 6);
      ctx.fillStyle = "#b83878";
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      ctx.fillStyle = "#ff9ce0";
      ctx.fillRect(cx - Math.max(1, r - 2), cy - Math.max(1, r - 2), Math.max(2, (r - 2) * 2), Math.max(2, (r - 2) * 2));

(function (root) {

    (a === 0x01 && b === 0x01) ||

    initActorSprites() {

        this.initHunterSprites();
      }

        this.initDroneSprites();
      }
      if (typeof this.initCrawlerSprites === "function") {
        this.initCrawlerSprites();
      }
      if (S.PALETTE_FALLBACK_PLAYER && S.FALLBACK_PLAYER_IDLE && typeof makeSpriteSet === "function") {
        this.fallbackPlayerSprites = makeSpriteSet(
          {
            idle: S.FALLBACK_PLAYER_IDLE,
            walk1: S.FALLBACK_PLAYER_WALK1,
            walk2: S.FALLBACK_PLAYER_WALK2,
            climb1: S.FALLBACK_PLAYER_CLIMB1,
            climb2: S.FALLBACK_PLAYER_CLIMB2
          },
          S.PALETTE_FALLBACK_PLAYER

      }
      if (S.PALETTE_FALLBACK_HUNTER && S.FALLBACK_HUNTER_IDLE && typeof makeSpriteSet === "function") {
        this.fallbackHunterSprites = makeSpriteSet(
          {
            idle: S.FALLBACK_HUNTER_IDLE,
            walk1: S.FALLBACK_HUNTER_WALK1,
            walk2: S.FALLBACK_HUNTER_WALK2,
            climb1: S.FALLBACK_HUNTER_CLIMB1,
            climb2: S.FALLBACK_HUNTER_CLIMB2

          S.PALETTE_FALLBACK_HUNTER

    },

    pickFrame(slot, world) {
      const faceVal = slot.facing || slot.dir;
      const facing = (faceVal & 2) ? "L" : "R";

      if (slot.state === 15 || slot.state === 16) {
        return "idle_" + facing;
      }
      if (slot.state === 10) {
        const idx = ((world ? world.f >> 2 : 0) & 1) ? "walk1" : "walk2";
        return idx + "_" + facing;
      }
      if (slot.state === 11) {

      if (slot.state === 4) {

      const t = slot.hammerTimer;

      // 0: 後ろ振りかぶり, 1: 頭上構え, 2: 前へ振り下ろし, 3: 振り終わり戻り硬直

        ctx.fillRect(hx, hy, 9, 6);

  const ASTRO_DEAD_FALL = [
    "OO............OO",
    "OO...WWWWWW...OO",
    "PP..WWWWWWWW..PP",
    "WW.WWVVVVVVWW.WW",
    "WW.WVVVVVRRVW.WW",
    ".W.WVVVVVVVVW.W.",
    ".W.LLWWVVWWLL.W.",
    ".WW.LLWWWWLL.WW.",
    "..WW.OOOOOO.WW..",
    "...WWWWCCWWWW...",
    "....WWWDDWWW....",
    "....WWWCCWWW....",
    ".....DDDDDD.....",
    "...WWWWWWWWWW...",
    "..WWWWW..WWWWW..",
    ".WWWWW....WWWWW.",
    ".LLLL......LLLL.",
    ".DDDD......DDDD.",
    ".BBBB......BBBB.",
    "BBBB........BBBB",
    ".BBBB......BBBB.",
    "................",
    "................",
    "................",
    "................",
    "................"
  ];

  const WALK_STEP_FRAMES = 5; // 歩行コマ切替間隔（5Fごと）

  Object.assign(R.Renderer.prototype, {
    initPlayerSprites() {
      if (typeof makeSpriteSet !== "function") return;
      this.playerSprites = makeSpriteSet(
        {
          idle: UPPER_IDLE.concat(LOWER_IDLE),
          walk0: UPPER_WALK_0.concat(LOWER_WALK_0),
          walk1: UPPER_WALK_1.concat(LOWER_WALK_1),
          walk2: UPPER_WALK_2.concat(LOWER_WALK_2),
          walk3: UPPER_WALK_3.concat(LOWER_WALK_3),
          sit: ASTRO_SIT,
          recover0: ASTRO_RECOVER_0,
          recover1: ASTRO_RECOVER_1,
          climbHold: ASTRO_CLIMB_HOLD,
          climbL: ASTRO_CLIMB_L,
          climbR: ASTRO_CLIMB_R,
          fall: ASTRO_FALL,
          hammerPull: ASTRO_HAMMER_PULL,
          hammerUp: ASTRO_HAMMER_UP,
          hammerSwing: ASTRO_HAMMER_SWING,
          hammerHit: ASTRO_HAMMER_HIT,
          deadLook: ASTRO_DEAD_LOOK,
          deadFall: ASTRO_DEAD_FALL
        },
        PALETTE_ASTRO
      );
    },

    getPlayerLadderVisual(slot) {
      const s = slot.state;
      const y = slot.y;
      const topY = slot.topY;
      const prom = slot.prom;
      const n = slot.n;
      const kind = slot.kind;
      const d = slot.dir;

      let vy = y;
      let isHold = false;

      if (s === 3) {
        if (kind === "enter") {
          if (n <= 4) {
            vy = y;
            isHold = true;
          } else {
            vy = topY + 31;
          }
        } else if (kind === "arrive") {
          vy = y;
          isHold = true;
        } else if (kind === "enter_top") {
          if (n <= 3) {
            vy = topY;
            isHold = true;
          } else if (n <= 7) {
            vy = topY + 3;
          } else {
            vy = topY + 7;
          }
        } else if (kind === "arrive_top") {
          if (n <= 3) {
            vy = topY + 7;
          } else if (n <= 8) {
            vy = topY + 3;
          } else {
            vy = topY;
            isHold = true;
          }
        }
      } else if (s === 6) {
        if (kind === "enter_top_cont") {
          if (n <= 5) {
            vy = topY;
            isHold = true;
          } else if (n <= 10) {
            vy = topY + 3;
          } else {
            vy = topY + 7;

        } else if (kind === "cont") {
          if (d & DOWN) {
            if (n <= 1) vy = y - 1;
            else if (n <= 6) vy = y + 3;
            else vy = y + 7;
          } else {
            if (n <= 3) vy = y + 7;
            else if (n <= 9) vy = y + 3;
            else vy = y - 1;
          }
        }
      } else if (s === 2) {
        if (prom === 31 && y === topY) {
          vy = topY + 7;
        } else if (prom === 1 && y === topY + 32) {
          vy = topY + 31;
        } else if ((d & UP) && prom >= 30) {
          vy = topY + 7;
        } else {
          vy = y;
        }
      }

      if (isHold) {
        return { vy, pose: "climbHold" };
      }
      const stepIndex = Math.round((vy - 3) / 4);
      return { vy, pose: (stepIndex & 1) ? "climbR" : "climbL" };
    },

    drawPlayerBackHammer(baseX, drawY, facingDir, mode) {
      const ctx = this.ctx;
      const isLeft = (facingDir & LEFT) !== 0;

      if (mode === "back") {
        // 後ろ姿（はしご中）：背中のバックパックに斜めに刺さっている
        const hx = isLeft ? baseX + 1 : baseX + 10;
        const hy = drawY + 4;
        ctx.fillStyle = "#8c5420";
        for (let i = 0; i < 9; i++) {
          const px = isLeft ? (baseX + 4 + i * 0.7) : (baseX + 11 - i * 0.7);
          ctx.fillRect(Math.round(px), drawY + 7 + i, 1, 2);
        }
        ctx.fillStyle = "#d48e44";
        for (let i = 0; i < 7; i++) {
          const px = isLeft ? (baseX + 4 + i * 0.7) : (baseX + 11 - i * 0.7);
          ctx.fillRect(Math.round(px), drawY + 7 + i, 1, 1);
        }
        ctx.fillStyle = "#48546a";
        ctx.fillRect(hx, hy, 5, 4);
        ctx.fillStyle = "#aebcd0";
        ctx.fillRect(hx + 1, hy + 1, 3, 2);

      }

      // 横向き（待機・歩行・落下など）：背中バックパックの上後ろに刺さっている
      const headX = isLeft ? baseX + 12 : baseX - 1;
      const headY = drawY + 3;
      const gripStartX = isLeft ? baseX + 13 : baseX + 2;
      const gripDir = isLeft ? -1 : 1;

      ctx.fillStyle = "#8c5420";
      ctx.fillRect(gripStartX, drawY + 7, 2, 3);
      ctx.fillRect(gripStartX + gripDir, drawY + 10, 2, 4);
      ctx.fillStyle = "#d48e44";
      ctx.fillRect(gripStartX, drawY + 7, 1, 3);
      ctx.fillRect(gripStartX + gripDir, drawY + 10, 1, 3);

      ctx.fillStyle = "#48546a";
      ctx.fillRect(headX, headY, 5, 4);
      ctx.fillStyle = "#c2d0e4";
      ctx.fillRect(headX + (isLeft ? 1 : 0), headY + 1, 4, 2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(headX + (isLeft ? 2 : 1), headY + 1, 2, 1);
    },

    drawPlayerShoeJet(baseX, drawY, facingDir, frame) {
      const ctx = this.ctx;
      const isLeft = (facingDir & LEFT) !== 0;
      const foot1X = isLeft ? baseX + 3 : baseX + 4;
      const foot2X = isLeft ? baseX + 8 : baseX + 9;
      const tailShift = isLeft ? 1 : -1;
      const fy = drawY + 26;
      const phase = ((frame || 0) >> 1) & 3;

      const drawFlame = (fx, alt) => {
        const longTail = ((phase + alt) & 1) === 0;
        // 靴底直下の高温白黄コア
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(fx + 1, fy, 2, 1);
        ctx.fillStyle = "#fff278";
        ctx.fillRect(fx + 1, fy + 1, 2, 1);
        ctx.fillStyle = "#ffaa28";
        ctx.fillRect(fx, fy, 1, 1);
        ctx.fillRect(fx + 3, fy, 1, 1);

        // 中間のオレンジ炎
        ctx.fillStyle = "#ff8820";
        ctx.fillRect(fx + (isLeft ? 1 : 0), fy + 1, 1, 1);
        ctx.fillRect(fx + (isLeft ? 2 : 3), fy + 1, 1, 1);
        ctx.fillRect(fx + 1 + (longTail ? 0 : tailShift), fy + 2, 2, 1);

        // 先端の赤橙炎（後ろへわずかに流れる）
        ctx.fillStyle = "#ff4418";
        ctx.fillRect(fx + 1 + tailShift, fy + 3, 2, longTail ? 2 : 1);
        if (longTail) {
          ctx.fillStyle = "#ffe066";
          ctx.fillRect(fx + 1 + tailShift, fy + 5, 1, 1);
        }
      };

      drawFlame(foot1X, 0);
      drawFlame(foot2X, 1);
    },

    getPlayerHammerPhaseInfo(slot) {
      const t = slot.hammerTimer;
      if (slot.isGolden) {
        if (t <= 1) return { phase: "pull", pose: "hammerPull", behind: false };
        if (t <= 2) return { phase: "up", pose: "hammerUp", behind: false };
        if (t <= 4) return { phase: "swing", pose: "hammerSwing", behind: true };
        if (t <= 5) return { phase: "hit", pose: "hammerHit", behind: true };
        return { phase: "return", pose: "hammerPull", behind: false };
      }
      if (t <= 3) return { phase: "pull", pose: "hammerPull", behind: false };
      if (t <= 10) return { phase: "up", pose: "hammerUp", behind: false };
      if (t <= 15) return { phase: "swing", pose: "hammerSwing", behind: true };
      if (t <= 18) return { phase: "hit", pose: "hammerHit", behind: true };

    },

    drawPlayerActiveHammer(slot, baseX, drawY, phase) {
      const ctx = this.ctx;
      const faceVal = slot.facing || slot.dir;
      const isLeft = (faceVal & LEFT) !== 0;
      const headMain = slot.isGolden ? "#ffe042" : "#aebcd0";
      const headDark = slot.isGolden ? "#a87010" : "#48546a";
      const headHi = slot.isGolden ? "#ffffff" : "#e8f2ff";
      const grip = "#d48e44";
      const gripDark = "#8c5420";

      if (phase === "pull" || phase === "return") {
        const hx = isLeft ? baseX + 12 : baseX - 3;
        const hy = drawY + 1;
        ctx.fillStyle = gripDark;
        ctx.fillRect(isLeft ? baseX + 12 : baseX + 2, drawY + 5, 2, 7);
        ctx.fillStyle = grip;
        ctx.fillRect(isLeft ? baseX + 12 : baseX + 2, drawY + 5, 1, 6);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 7, 5);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 5, 3);
        return;
      }

      if (phase === "up") {
        const hx = baseX + 3;
        const hy = drawY - 8;
        ctx.fillStyle = gripDark;
        ctx.fillRect(baseX + 7, drawY - 3, 2, 7);
        ctx.fillStyle = grip;
        ctx.fillRect(baseX + 7, drawY - 3, 1, 6);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 10, 6);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 8, 4);
        ctx.fillStyle = headHi;
        ctx.fillRect(hx + 2, hy + 1, 6, 1);
        return;
      }

      if (phase === "swing") {
        const hx = baseX + 4;
        const hy = drawY - 4;
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        ctx.fillRect(baseX + 6, drawY - 10, 4, 2);
        ctx.fillRect(baseX + 5, drawY - 7, 6, 3);
        ctx.fillStyle = gripDark;
        ctx.fillRect(baseX + 7, drawY, 2, 8);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 8, 5);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 6, 3);
        return;
      }

      const hx = baseX + 4;
      const hy = drawY - 1;
      ctx.fillStyle = gripDark;
      ctx.fillRect(baseX + 7, drawY + 2, 2, 9);
      ctx.fillStyle = headDark;
      ctx.fillRect(hx, hy, 8, 5);
      ctx.fillStyle = headMain;
      ctx.fillRect(hx + 1, hy + 1, 6, 3);
      ctx.fillStyle = headHi;
      ctx.fillRect(hx + 2, hy + 2, 4, 1);

      if (slot.hammerTimer >= (slot.isGolden ? 5 : 17)) {
        ctx.fillStyle = "#fff480";
        ctx.fillRect(baseX + 2, drawY - 3, 2, 2);
        ctx.fillRect(baseX + 12, drawY - 3, 2, 2);
        ctx.fillRect(baseX + 7, drawY - 4, 2, 2);
      }
    },

    getPlayerWalkVisual(slot, world) {
      const curF = world ? (world.f || 0) : 0;
      const introActive = !!(world && world.introActive);
      let vis = this._playerWalkVis;

      if (!vis || vis.world !== world || curF < vis.lastWorldF || introActive) {
        vis = {
          world,
          lastWorldF: curF - 1,
          lastState: -1,
          lastX: slot.x,
          lastVisWalkFrames: 0,
          carryOffset: 0,
          inHorizChain: false,
          poseKey: "idle",
          stepOffsetY: 0,
          useWalk: false

      if (world && curF === vis.lastWorldF) {
        return vis;

      const s = slot.state;
      const bits = slot.bits || 0;
      const wf = slot.walkFrames || 0;
      let poseKey = "idle";
      let stepOffsetY = 0;
      let useWalk = false;

      if (s === 1) {
        if (vis.lastState !== 1) {
          vis.carryOffset = vis.inHorizChain ? ((vis.lastVisWalkFrames + 1) - wf) : 0;
        }
        const visWf = Math.max(0, wf + vis.carryOffset);
        const step = Math.floor(visWf / WALK_STEP_FRAMES) & 3;
        poseKey = "walk" + step;
        if (step === 0 || step === 2) {
          stepOffsetY = 1;
        }
        vis.lastVisWalkFrames = visWf;
        vis.inHorizChain = true;
        useWalk = true;
      } else if (s === 8 || s === 9) {
        let visWf = 0;
        if (vis.inHorizChain) {
          const movedOrEntered = (slot.x !== vis.lastX) || (vis.lastState !== s);
          visWf = vis.lastVisWalkFrames + (movedOrEntered ? 1 : 0);
        }
        const step = Math.floor(visWf / WALK_STEP_FRAMES) & 3;
        poseKey = "walk" + step;
        if (step === 0 || step === 2) {
          stepOffsetY = 1;
        }
        vis.lastVisWalkFrames = visWf;
        vis.inHorizChain = true;
        useWalk = true;
      } else if (s === 0 && vis.lastState === 9 && (bits & (LEFT | RIGHT)) !== 0) {
        const visWf = vis.lastVisWalkFrames + 1;
        const step = Math.floor(visWf / WALK_STEP_FRAMES) & 3;
        poseKey = "walk" + step;
        if (step === 0 || step === 2) {
          stepOffsetY = 1;
        }
        vis.lastVisWalkFrames = visWf;
        vis.inHorizChain = true;
        useWalk = true;
      } else {
        vis.lastVisWalkFrames = 0;
        vis.carryOffset = 0;
        vis.inHorizChain = false;
        useWalk = false;
      }

      vis.lastState = s;
      vis.lastX = slot.x;
      vis.lastWorldF = curF;
      vis.poseKey = poseKey;
      vis.stepOffsetY = stepOffsetY;
      vis.useWalk = useWalk;
      return vis;
    },

    drawPlayerAt(slot, baseX, baseDrawY, world) {
      if (!this.playerSprites) return;
      const walkVis = this.getPlayerWalkVisual(slot, world);
      const sprites = this.playerSprites;
      const ctx = this.ctx;
      const faceVal = slot.facing || slot.dir;
      const facing = (faceVal & LEFT) ? "L" : "R";

      if (world && world.playerDead) {
        const img = sprites.deadFall_R || sprites["idle_" + facing];
        if (!img) return;
        ctx.drawImage(img, baseX, baseDrawY);
        return;
      }

      if (slot.state === 15 || slot.state === 16) {
        return;
      }

      if (slot.state === 10) {
        const img = sprites["fall_" + facing] || sprites["idle_" + facing];
        if (!img) return;
        ctx.save();
        ctx.translate(baseX, baseDrawY + 26);
        ctx.scale(1, -1);
        ctx.drawImage(img, 0, 0);
        this.drawPlayerBackHammer(0, 0, faceVal, "side");
        ctx.restore();
        return;
      }

      if (slot.state === 11) {
        const st = slot.stunTimer != null ? slot.stunTimer : 0;
        let poseKey = "recover1";
        let hammerOffsetX = 0;
        let hammerOffsetY = 2;

        if (st >= 10) {
          poseKey = "sit";
          hammerOffsetX = (faceVal & LEFT) ? 1 : -1;
          hammerOffsetY = 8;
        } else if (st >= 5) {
          poseKey = "recover0";
          hammerOffsetY = 4;
        } else {
          poseKey = "recover1";
          hammerOffsetY = 2;
        }

        const img = sprites[poseKey + "_" + facing] || sprites["idle_" + facing];
        if (!img) return;
        ctx.drawImage(img, baseX, baseDrawY);
        this.drawPlayerBackHammer(baseX + hammerOffsetX, baseDrawY + hammerOffsetY, faceVal, "side");

        // 尻もち直後の着地衝撃エフェクト（最初の6F間）
        if (st >= 14) {
          const isBurst = st >= 17;
          ctx.fillStyle = "#ffffff";
          if (isBurst) {
            ctx.fillRect(baseX - 2, baseDrawY + 23, 2, 1);
            ctx.fillRect(baseX - 1, baseDrawY + 24, 2, 1);
            ctx.fillRect(baseX + 16, baseDrawY + 23, 2, 1);
            ctx.fillRect(baseX + 15, baseDrawY + 24, 2, 1);
            ctx.fillStyle = "#9ad8ff";
            ctx.fillRect(baseX - 3, baseDrawY + 22, 1, 1);
            ctx.fillRect(baseX + 18, baseDrawY + 22, 1, 1);
          } else {
            ctx.fillRect(baseX - 3, baseDrawY + 22, 1, 1);
            ctx.fillRect(baseX - 2, baseDrawY + 25, 1, 1);
            ctx.fillRect(baseX + 18, baseDrawY + 22, 1, 1);
            ctx.fillRect(baseX + 17, baseDrawY + 25, 1, 1);
          }
        }
        return;
      }

      if (slot.state === 12) {
        const img = sprites["idle_" + facing];
        if (!img) return;
        ctx.drawImage(img, baseX, baseDrawY);
        this.drawPlayerBackHammer(baseX, baseDrawY, faceVal, "side");
        if ((slot.shoeHoverTimer || 0) === 0) {
          this.drawPlayerShoeJet(baseX, baseDrawY, faceVal, world ? world.f : 0);
        }
        return;
      }

      if (slot.state === 4) {
        const hInfo = this.getPlayerHammerPhaseInfo(slot);
        const img = sprites[hInfo.pose + "_" + facing];
        if (!img) return;
        if (hInfo.behind) {
          this.drawPlayerActiveHammer(slot, baseX, baseDrawY, hInfo.phase);
        }
        ctx.drawImage(img, baseX, baseDrawY);
        if (!hInfo.behind) {
          this.drawPlayerActiveHammer(slot, baseX, baseDrawY, hInfo.phase);
        }
        return;
      }

      if (slot.state === 2 || slot.state === 3 || slot.state === 6) {
        const lad = this.getPlayerLadderVisual(slot);
        const drawY = lad.vy - 26;
        const img = sprites[lad.pose + "_R"];
        if (!img) return;
        ctx.drawImage(img, baseX, drawY);
        this.drawPlayerBackHammer(baseX, drawY, faceVal, "back");
        return;
      }

      if (slot.state === 0 && !walkVis.useWalk && !(slot.flag & 2) && world && slot.row < world.rows - 1) {
        const curT = world.getTile(slot.row, slot.col);
        if (curT !== TILE.SAND_LADDER &&
            isSameLadderType(curT, world.getTile(slot.row + 1, slot.col))) {
          const img = sprites.climbHold_R;
          if (!img) return;
          ctx.drawImage(img, baseX, baseDrawY);
          this.drawPlayerBackHammer(baseX, baseDrawY, faceVal, "back");
          return;
        }
      }

      let poseKey = "idle";
      let stepOffsetY = 0;
      if (slot.state === 5) {
        poseKey = "fall";
      } else if (walkVis.useWalk) {
        poseKey = walkVis.poseKey;
        stepOffsetY = walkVis.stepOffsetY;
      }

      const img = sprites[poseKey + "_" + facing] || sprites["idle_" + facing];
      if (!img) return;
      ctx.drawImage(img, baseX, baseDrawY);
      this.drawPlayerBackHammer(baseX, baseDrawY + stepOffsetY, faceVal, "side");
    },

    drawPlayer(slot, worldWidth, world) {
      const baseDrawY = Math.round(slot.y) - 26;
      this.drawPlayerAt(slot, slot.x, baseDrawY, world);
      if (slot.x > worldWidth - 16) {
        this.drawPlayerAt(slot, slot.x - worldWidth, baseDrawY, world);
      }
      if (slot.x < 16) {
        this.drawPlayerAt(slot, slot.x + worldWidth, baseDrawY, world);
      }
    }
  });

  <script>
(function (root) {
  "use strict";

  const G = root.BreakerGame || {};

  const LEFT = G.LEFT || 2;
  const DOWN = G.DOWN || 4;
  const UP = G.UP || 8;
  const TILE = G.TILE || {
    LADDER: 0x01,
    SAND_LADDER: 0x02,
    BREAK_LADDER: 0xd1

  const isLadderTile = G.isLadderTile || (t =>
    t === TILE.LADDER || t === TILE.BREAK_LADDER || t === TILE.SAND_LADDER);
  const isCrumblingLadderTile = G.isCrumblingLadderTile || (t => t >= 0x51 && t <= 0x55);
  const isSolidDrum = G.isSolidDrum || (t => t === (TILE.DRUM !== undefined ? TILE.DRUM : 0x08));
  const isSameLadderType = G.isSameLadderType || ((a, b) =>
    (a === TILE.LADDER && b === TILE.LADDER) ||
    (a === TILE.BREAK_LADDER && b === TILE.BREAK_LADDER) ||
    (a === TILE.SAND_LADDER && b === TILE.SAND_LADDER));

  const makeSpriteSet = R.makeSpriteSet;

  // 追尾ロボ（ハンター）パレット（細身・シルバー金属骨格＋赤く光る目）
  const PALETTE_HUNTER = {
    H: "#bccae0",
    M: "#7b889c",
    S: "#4c576b",
    D: "#282f3c",
    K: "#121620",
    E: "#ff2424",
    G: "#ffa490"
  };

  // 待機・通過コマ用の上半身（高い位置 16行：自然な立ち姿＋軽く曲げた腕）
  const UPPER_IDLE = [
    "................",
    ".....MMMMM......",
    "....MMHHHHM.....",
    "....MMKKKKK.....",
    "....MMKKEGK.....",
    "....MSSDDMM.....",
    ".....MMKKK......",
    ".....SDDDD......",
    "......DDD.......",
    ".....MMMMM......",
    "....SMHHHMM.....",
    "....SKHMMMS.....",
    "....SSKHMMS.....",
    ".....SDKMHS.....",
    ".....SDKMHH.....",
    ".....SMMMMS....."
  ];

  // 歩行0コマ目（1px沈み 17行）：手前腕を前へ「くの字」に振り上げ、奥腕を後ろへ引く
  const UPPER_WALK_0 = [
    "................",
    "................",
    ".....MMMMM......",
    "....MMHHHHM.....",
    "....MMKKKKK.....",
    "....MMKKEGK.....",
    "....MSSDDMM.....",
    ".....MMKKK......",
    ".....SDDDD......",
    "......DDD.......",
    ".....MMMMM......",
    "....SMHHHMM.....",
    "....SKHMMMS.HH..",
    "...DSKKMHHMMHH..",
    "..DDSSDDDDDDD...",
    ".....SDMMHS.....",
    ".....SMMMMS....."
  ];

  // 歩行1・3コマ目（高い位置 16行）：通過中は腕を自然位置へ

    // 追尾ロボのはしご移動（enter_top 9F 等）に合わせた均等間隔ステップ補正
    getHunterLadderVisual(slot, world) {
      const s = slot.state;
      const y = slot.y;
      const topY = slot.topY;
      const prom = slot.prom;
      const n = slot.n;
      const kind = slot.kind;
      const d = slot.dir;

      let vy = y;
      let isHold = false;

      if (s === 3) {
        if (kind === "enter") {
          if (n <= 4) {
            vy = y;
            isHold = true;
          } else {
            vy = topY + 31;
          }
        } else if (kind === "arrive") {
          vy = y;
          isHold = true;
        } else if (kind === "enter_top") {
          // 追尾ロボの enter_top は全9F（n=1..8 + prom=31 1F）のため 3F-3F-3F で均等割り
          if (n <= 3) {
            vy = topY;
            isHold = true;
          } else if (n <= 6) {
            vy = topY + 3;
          } else {
            vy = topY + 7;
          }
        } else if (kind === "arrive_top") {
          if (n <= 3) {
            vy = topY + 7;
          } else if (n <= 8) {
            vy = topY + 3;
          } else {
            vy = topY;
            isHold = true;
          }
        }
      } else if (s === 6) {
        if (kind === "enter_top_cont") {
          if (n <= 5) {
            vy = topY;
            isHold = true;
          } else if (n <= 10) {
            vy = topY + 3;
          } else {
            vy = topY + 7;
          }
        } else if (kind === "cont") {
          if (d & DOWN) {
            if (n <= 1) vy = y - 1;
            else if (n <= 6) vy = y + 3;
            else vy = y + 7;
          } else {
            if (n <= 3) vy = y + 7;
            else if (n <= 9) vy = y + 3;
            else vy = y - 1;
          }
        }
      } else if (s === 2) {
        if (prom === 31 && y === topY) {
          vy = topY + 7;
        } else if (prom === 1 && y === topY + 32) {
          vy = topY + 31;
        } else if ((d & UP) && prom >= 30) {
          vy = topY + 7;
        } else {
          vy = y;
        }
      }

      // ハシゴの真上にドラム缶がある場合は、頭半分ほど鉄骨にかかる位置（topY + 27）で頭がつっかえて止まる見た目にする
      if (world && topY >= 32 && (topY & 0x1f) === 0) {
        const aboveRow = Math.floor(topY / 32) - 1;
        const ladRow = aboveRow + 1;
        if (aboveRow >= 0 && ladRow < world.rows) {
          const aboveTile = world.getTile(aboveRow, slot.col);
          const ladTile = world.getTile(ladRow, slot.col);
          if (isSolidDrum(aboveTile) && (isLadderTile(ladTile) || isCrumblingLadderTile(ladTile))) {
            if (vy < topY + 27) {
              vy = topY + 27;
            }
          }
        }
      }

      if (isHold) {
        return { vy, pose: "climbHold" };
      }
      const stepIndex = Math.round((vy - 3) / 4);
      return { vy, pose: (stepIndex & 1) ? "climbR" : "climbL" };
    },

    drawHunterBackHammer(baseX, drawY, facingDir, mode) {
      const ctx = this.ctx;
      const isLeft = (facingDir & LEFT) !== 0;

      if (mode === "front") {
        // 腹側（正面向き・はしご昇降中）：背中の奥に斜めマウントされたハンマーが肩と腰から覗く
        const headX = isLeft ? baseX + 10 : baseX + 1;
        const headY = drawY + 5;
        ctx.fillStyle = "#222936";
        for (let i = 0; i < 10; i++) {
          const px = isLeft ? (baseX + 11 - i * 0.7) : (baseX + 4 + i * 0.7);
          ctx.fillRect(Math.round(px), drawY + 8 + i, 2, 2);
        }
        ctx.fillStyle = "#8a9ab4";
        for (let i = 0; i < 9; i++) {
          const px = isLeft ? (baseX + 11 - i * 0.7) : (baseX + 4 + i * 0.7);
          ctx.fillRect(Math.round(px), drawY + 8 + i, 1, 1);
        }
        ctx.fillStyle = "#28303e";
        ctx.fillRect(headX, headY, 5, 4);
        ctx.fillStyle = "#8a9ab4";
        ctx.fillRect(headX + 1, headY + 1, 3, 2);
        ctx.fillStyle = "#dce8fa";
        ctx.fillRect(headX + 1, headY + 1, 2, 1);
        return;
      }

      // 横向き（待機・歩行・落下など）：細身の背中に斜めに背負っている
      const headX = isLeft ? baseX + 11 : baseX;
      const headY = drawY + 4;
      const gripStartX = isLeft ? baseX + 12 : baseX + 3;
      const gripDir = isLeft ? -1 : 1;

      ctx.fillStyle = "#222936";
      ctx.fillRect(gripStartX, drawY + 8, 2, 3);
      ctx.fillRect(gripStartX + gripDir, drawY + 11, 2, 4);
      ctx.fillStyle = "#8a9ab4";
      ctx.fillRect(gripStartX, drawY + 8, 1, 3);
      ctx.fillRect(gripStartX + gripDir, drawY + 11, 1, 3);

      ctx.fillStyle = "#28303e";
      ctx.fillRect(headX, headY, 5, 4);
      ctx.fillStyle = "#8a9ab4";
      ctx.fillRect(headX + (isLeft ? 1 : 0), headY + 1, 4, 2);
      ctx.fillStyle = "#dce8fa";
      ctx.fillRect(headX + (isLeft ? 2 : 1), headY + 1, 2, 1);
      ctx.fillStyle = "#e03030";
      ctx.fillRect(headX + (isLeft ? 3 : 1), headY + 2, 1, 1);
    },

    // 追尾ロボのハンマー動作（全27F / 14F目叩き / 23F目終盤硬直戻し）
    getHunterHammerPhaseInfo(slot) {
      const t = slot.hammerTimer || 0;
      if (t <= 4) return { phase: "pull", pose: "hammerPull", behind: false };
      if (t <= 10) return { phase: "up", pose: "hammerUp", behind: true };
      if (t <= 13) return { phase: "swing", pose: "hammerSwing", behind: false };
      if (t <= 22) return { phase: "hit", pose: "hammerHit", behind: false };
      return { phase: "return", pose: "hammerPull", behind: false };
    },

    drawHunterActiveHammer(slot, baseX, drawY, phase) {
      const ctx = this.ctx;
      const faceVal = slot.facing || slot.dir;
      const isLeft = (faceVal & LEFT) !== 0;
      const headDark = "#1c222c";
      const headMid = "#5a667c";
      const headMain = "#8897b0";
      const headHi = "#d4e2f6";
      const gripDark = "#222834";
      const grip = "#8a9ab4";

      if (phase === "pull" || phase === "return") {
        const hx = isLeft ? baseX + 11 : baseX - 2;
        const hy = drawY + 2;
        ctx.fillStyle = gripDark;
        ctx.fillRect(isLeft ? baseX + 11 : baseX + 3, drawY + 6, 2, 7);
        ctx.fillStyle = grip;
        ctx.fillRect(isLeft ? baseX + 11 : baseX + 3, drawY + 6, 1, 6);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 7, 5);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 5, 3);
        ctx.fillStyle = headHi;
        ctx.fillRect(hx + 1, hy + 1, 4, 1);
        return;
      }

      if (phase === "up") {
        // 頭上に重厚メカハンマーを高く振りかぶる
        const hx = baseX + 3;
        const hy = drawY - 8;
        ctx.fillStyle = gripDark;
        ctx.fillRect(baseX + 7, drawY - 3, 2, 7);
        ctx.fillStyle = grip;
        ctx.fillRect(baseX + 7, drawY - 3, 1, 6);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 10, 6);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 8, 4);
        ctx.fillStyle = headHi;
        ctx.fillRect(hx + 2, hy + 1, 6, 1);
        ctx.fillStyle = "#e03030";
        ctx.fillRect(hx + 4, hy + 3, 2, 1);
        return;
      }

      if (phase === "swing") {
        // こちら側（画面手前・キャラ前面）へ振り下ろし途中
        const hx = baseX + 3;
        const hy = drawY + 4;
        ctx.fillStyle = "rgba(255, 110, 90, 0.55)";
        ctx.fillRect(baseX + 5, drawY - 4, 6, 2);
        ctx.fillRect(baseX + 4, drawY - 1, 8, 3);
        ctx.fillStyle = gripDark;
        ctx.fillRect(baseX + 7, drawY + 9, 2, 5);
        ctx.fillStyle = grip;
        ctx.fillRect(baseX + 7, drawY + 9, 1, 4);
        ctx.fillStyle = headDark;
        ctx.fillRect(hx, hy, 10, 6);
        ctx.fillStyle = headMain;
        ctx.fillRect(hx + 1, hy + 1, 8, 4);
        ctx.fillStyle = headHi;
        ctx.fillRect(hx + 2, hy + 1, 6, 2);
        return;
      }

      // hit: 14F目の叩き判定に同期！こちら側へ叩きつけ
      const hx = baseX + 2;
      const hy = drawY + 9;
      ctx.fillStyle = gripDark;
      ctx.fillRect(baseX + 7, drawY + 14, 2, 6);
      ctx.fillStyle = grip;
      ctx.fillRect(baseX + 7, drawY + 14, 1, 5);
      ctx.fillStyle = headDark;
      ctx.fillRect(hx, hy, 12, 7);
      ctx.fillStyle = headMid;
      ctx.fillRect(hx + 1, hy + 1, 10, 5);
      ctx.fillStyle = headMain;
      ctx.fillRect(hx + 2, hy + 1, 8, 4);
      ctx.fillStyle = headHi;
      ctx.fillRect(hx + 3, hy + 2, 6, 2);
      ctx.fillStyle = "#e03030";
      ctx.fillRect(hx + 5, hy + 4, 2, 1);

      if (slot.hammerTimer >= 14 && slot.hammerTimer <= 17) {
        ctx.fillStyle = "#ff4030";
        ctx.fillRect(baseX, drawY + 8, 2, 2);
        ctx.fillRect(baseX + 14, drawY + 8, 2, 2);
        ctx.fillStyle = "#fff480";
        ctx.fillRect(baseX + 1, drawY + 15, 2, 2);
        ctx.fillRect(baseX + 13, drawY + 15, 2, 2);
        ctx.fillRect(baseX + 7, drawY + 6, 2, 2);
      }
    },

    getHunterWalkVisual(slot, world) {
      const curF = world ? (world.f || 0) : 0;

(function (root) {
  "use strict";

  const G = root.BreakerGame || {};
  const LEFT = G.LEFT || 2;

  const R = root.BreakerRender;
  if (!R || !R.Renderer) return;

  // 派手さを抑えた落ち着いた電磁ピンクのパレット
  const PALETTE_ARMILLARY = {
    D: "#7a2258", // 奥側へ回った輪（深ローズピンク）
    M: "#cc4696", // 標準リング（電磁ピンク）
    L: "#ff82c8", // 手前側ハイライトリング
    W: "#ffd6ee"  // 中心電磁コア芯（淡い白ピンク）
  };

  function buildArmillaryGrid(frameIdx, buildStage) {
    const sz = 15;
    const c = 7;
    const grid = Array.from({ length: sz }, () => new Array(sz).fill("."));
    const zbuf = Array.from({ length: sz }, () => new Array(sz).fill(-999));

    function drawRingAxis(rMajor, rMinor, tiltDeg, phaseShift, isOuter) {
      const radTilt = (tiltDeg * Math.PI) / 180;
      const ctA = Math.cos(radTilt);
      const stA = Math.sin(radTilt);
      const steps = 200;

      for (let i = 0; i < steps; i++) {
        const t = (2 * Math.PI * i) / steps;
        const u = rMajor * Math.cos(t);
        const v = rMinor * Math.sin(t);
        let z = Math.sqrt(Math.max(0, rMajor * rMajor - rMinor * rMinor)) * Math.sin(t);
        if (rMinor < 0) z = -z;
        if (isOuter) z = -0.6;

        const px = u * ctA - v * stA;
        const py = u * stA + v * ctA;

        let ch;
        if (isOuter) {
          const glow = Math.sin(t * 2 - phaseShift);
          ch = glow > -0.2 ? "M" : "D";
          if (glow > 0.88) ch = "L";
        } else {
          if (z > rMajor * 0.25) ch = "L";
          else if (z > -rMajor * 0.25) ch = "M";
          else ch = "D";
        }

        const ix = Math.round(c + px);
        const iy = Math.round(c + py);
        if (ix >= 0 && ix < sz && iy >= 0 && iy < sz) {
          if (z > zbuf[iy][ix]) {
            zbuf[iy][ix] = z;
            grid[iy][ix] = ch;
          }
        }
      }
    }

    const spin = frameIdx * (Math.PI / 4);

    // 中心の極小電磁コア（発生初期 buildStage === 0）
    zbuf[c][c] = 0.25;
    grid[c][c] = "W";
    if (buildStage === 0) {
      grid[c][c - 1] = "M";
      grid[c][c + 1] = "M";
      grid[c - 1][c] = "M";
      grid[c + 1][c] = "M";
      return grid;
    }

    const coreHalo = (frameIdx & 1) === 0 ? "L" : "M";
    zbuf[c][c - 1] = 0.05; grid[c][c - 1] = coreHalo;
    zbuf[c][c + 1] = 0.05; grid[c][c + 1] = coreHalo;
    zbuf[c - 1][c] = 0.05; grid[c - 1][c] = coreHalo;
    zbuf[c + 1][c] = 0.05; grid[c + 1][c] = coreHalo;

    if (buildStage >= 1) {
      // 段階1: 内側の回転縦リング
      const rMin1 = 2.4 * Math.cos(spin + 0.35);
      drawRingAxis(4.4, rMin1, 90, spin, false);
    }

    if (buildStage >= 2) {
      // 段階2: 交差する斜めリング2本
      const rMin2 = 2.0 * Math.sin(spin * 0.5 + 0.85);
      drawRingAxis(4.9, rMin2, 40, spin, false);
      const rMin3 = -2.0 * Math.cos(spin * 0.5 + 0.45);
      drawRingAxis(4.9, rMin3, -40, -spin, false);
    }

    if (buildStage >= 3) {
      // 段階3(完成): 横赤道リング＋最外周フレーム輪
      let rMin4 = 1.6 * Math.sin(spin + 1.0);
      if (Math.abs(rMin4) < 1.1) {
        rMin4 = rMin4 >= 0 ? 1.1 : -1.1;
      }
      drawRingAxis(6.8, rMin4, 0, spin, false);
      drawRingAxis(7.0, 7.0, 0, spin, true);
    }

    return grid;
  }

  function bakeArmillary15x15(grid) {
    const c = document.createElement("canvas");
    c.width = 15;
    c.height = 15;
    const g = c.getContext("2d");
    for (let y = 0; y < 15; y++) {
      const row = grid[y];
      for (let x = 0; x < 15; x++) {
        const color = PALETTE_ARMILLARY[row[x]];
        if (!color) continue;
        g.fillStyle = color;
        g.fillRect(x, y, 1, 1);
      }
    }
    return c;
  }

  Object.assign(R.Renderer.prototype, {
    initOrbSprites() {
      const stage0 = bakeArmillary15x15(buildArmillaryGrid(0, 0));
      const stage1 = [];
      const stage2 = [];
      const stage3 = [];
      for (let i = 0; i < 8; i++) {
        stage1.push(bakeArmillary15x15(buildArmillaryGrid(i, 1)));
        stage2.push(bakeArmillary15x15(buildArmillaryGrid(i, 2)));
        stage3.push(bakeArmillary15x15(buildArmillaryGrid(i, 3)));
      }
      this.orbSprites = { stage0, stage1, stage2, stage3 };
    },

    drawOrb(ob) {
      if (!ob || ob.animStage < 0) return;
      if (!this.orbSprites) {
        this.initOrbSprites();
      }

      const cx = Math.round(ob.x + 8);
      const cy = Math.round(ob.y - 13); // 通路とプレイヤー体の中央（ど真ん中）
      const isLeft = (ob.dir & LEFT) !== 0;

      let stage = 3;
      if (ob.state === 1) {
        // 生成時（64F）：コア → 縦輪 → 斜め輪 → 完成の順で地味に組み上がる
        const rem = ob.spawnTimer != null ? ob.spawnTimer : 0;
        if (rem > 48) stage = 0;
        else if (rem > 32) stage = 1;
        else if (rem > 16) stage = 2;
        else stage = 3;
      } else if (ob.state === 3) {
        // 消滅時：完成 → 分解して消える
        stage = Math.max(0, Math.min(3, ob.animStage | 0));
      }

      const rotStep = Math.floor((ob.animCount || 0) / 5) & 7;
      const rotIdx = isLeft ? ((7 - rotStep) & 7) : rotStep;

      let img = null;
      if (stage === 0) {
        img = this.orbSprites.stage0;
      } else if (stage === 1) {
        img = this.orbSprites.stage1[rotIdx];
      } else if (stage === 2) {
        img = this.orbSprites.stage2[rotIdx];
      } else {
        img = this.orbSprites.stage3[rotIdx];
      }

      if (!img) return;
      this.ctx.drawImage(img, cx - 7, cy - 7);
    }
  });

  function createHammerSvg() {

  function createFixedNesPad(isInputActiveFn) {
    const stickUnit = document.getElementById("stickUnit");
    const stickBase = document.getElementById("stickBase");

    const hammerUnit = document.getElementById("hammerUnit");
    const hammerBtn = document.getElementById("hammerBtn");
    hammerBtn.appendChild(createHammerSvg());

    const STICK_DEAD = 8;

    function updateLights() {
      stickUnit.classList.toggle("dir-u", (stickBits & UP) !== 0);
      stickUnit.classList.toggle("dir-d", (stickBits & DOWN) !== 0);
      stickUnit.classList.toggle("dir-l", (stickBits & LEFT) !== 0);
      stickUnit.classList.toggle("dir-r", (stickBits & RIGHT) !== 0);
    }

    function updateStick(cxClient, cyClient) {
      const rect = stickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = cxClient - cx;
      let dy = cyClient - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > STICK_RANGE && dist > 0) {
        dx = (dx / dist) * STICK_RANGE;
        dy = (dy / dist) * STICK_RANGE;
      }
      stickKnob.style.transform = "translate3d(" + dx.toFixed(1) + "px, " + dy.toFixed(1) + "px, 0)";
      if (dist < STICK_DEAD) {
        stickBits = 0;
      } else if (Math.abs(dx) >= Math.abs(dy)) {
        stickBits = dx > 0 ? RIGHT : LEFT;
      } else {
        stickBits = dy > 0 ? DOWN : UP;
      }
      updateLights();
    }

    function resetStick() {
      stickPointerId = null;
      stickBits = 0;
      stickKnob.style.transform = "translate3d(0px, 0px, 0)";
      updateLights();

    function setHammer(on) {

      updateStick(e.clientX, e.clientY);

      e.preventDefault();
      updateStick(e.clientX, e.clientY);

  function drawDotText(targetCtx, text, x, y, options) {
    const opts = options || {};
    const str = String(text || "").toUpperCase();
    if (!str) return;
    const scale = opts.scale || 2;
    const stepX = 8 * scale;
    const totalW = Math.max(0, str.length * stepX - scale);

    const drawCell = (gx, gy, w, h, color) => {
      targetCtx.fillStyle = color;
      targetCtx.fillRect(gx, gy, w, h);
    };

    if (outline) {
      for (let i = 0; i < str.length; i++) {

        const gx = startX + i * stepX;

        const xMin = c * 16 + 2;
        const xMax = Math.min(VIEW_W - 3, xMin + 12);
        const sx = xMin + Math.floor(rand() * (xMax - xMin + 1));
        const sy = yMin + Math.floor(rand() * (yMax - yMin + 1));
        const roll = rand();
        let type = 0;
        if (roll > 0.93) type = 3;
        else if (roll > 0.78) type = 2;
        else if (roll > 0.56) type = 1;

        const tr = rand();
        let tIdx = 0;
        if (tr > 0.90) tIdx = 4;
        else if (tr > 0.72) tIdx = 3;
        else if (tr > 0.48) tIdx = 2;
        else if (tr > 0.24) tIdx = 1;

        stars.push({
          x: sx,
          y: sy,
          type,
          theme: themes[tIdx],
          phase: Math.floor(rand() * 256),
          speed: type === 0
            ? (18 + Math.floor(rand() * 16))
            : (type === 1 ? (10 + Math.floor(rand() * 8)) : (6 + Math.floor(rand() * 4)))
        });
      }
    }
    fullSkyField = { stars, nebula };
    return fullSkyField;
  }

  function drawFullNightSky(frame) {
    const grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    grad.addColorStop(0.00, "#03040a");
    grad.addColorStop(0.28, "#080c1e");
    grad.addColorStop(0.58, "#14173b");
    grad.addColorStop(0.84, "#0b122a");
    grad.addColorStop(1.00, "#080b14");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    const field = getFullSkyField();
    ctx.save();
    for (let i = 0; i < field.nebula.length; i++) {
      const n = field.nebula[i];
      ctx.globalAlpha = n.alpha;
      ctx.fillStyle = n.color;
      ctx.fillRect(n.x, n.y, n.w, 1);
    }

    for (let i = 0; i < field.stars.length; i++) {
      const s = field.stars[i];
      const tick = Math.floor((frame + s.phase) / s.speed);
      const th = s.theme;

      if (s.type === 0) {
        const step = tick & 3;
        ctx.globalAlpha = step === 2 ? 0.85 : (step === 0 ? 0.45 : 0.65);
        ctx.fillStyle = step === 2 ? th.mid : th.outer;
        ctx.fillRect(s.x, s.y, 1, 1);
      } else if (s.type === 1) {
        const step = tick & 3;
        ctx.globalAlpha = step === 1 ? 0.95 : 0.72;
        ctx.fillStyle = step === 1 ? th.core : th.mid;
        ctx.fillRect(s.x, s.y, 1, 1);
      } else if (s.type === 2) {
        const step = tick % 8;
        if (step === 4) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = th.core;
          ctx.fillRect(s.x, s.y, 1, 1);
          ctx.fillStyle = th.mid;
          ctx.fillRect(s.x - 1, s.y, 1, 1);
          ctx.fillRect(s.x + 1, s.y, 1, 1);
          ctx.fillRect(s.x, s.y - 1, 1, 1);
          ctx.fillRect(s.x, s.y + 1, 1, 1);
        } else {
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = th.mid;
          ctx.fillRect(s.x, s.y, 1, 1);
        }
      } else {
        const step = tick % 10;
        if (step === 5) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = th.core;
          ctx.fillRect(s.x, s.y, 1, 1);
          ctx.fillStyle = th.mid;
          ctx.fillRect(s.x - 1, s.y, 1, 1);
          ctx.fillRect(s.x + 1, s.y, 1, 1);
          ctx.fillRect(s.x, s.y - 1, 1, 1);
          ctx.fillRect(s.x, s.y + 1, 1, 1);
          ctx.globalAlpha = 0.72;
          ctx.fillStyle = th.outer;
          ctx.fillRect(s.x - 2, s.y, 1, 1);
          ctx.fillRect(s.x + 2, s.y, 1, 1);
          ctx.fillRect(s.x, s.y - 2, 1, 1);
          ctx.fillRect(s.x, s.y + 2, 1, 1);
        } else {
          ctx.globalAlpha = 0.90;
          ctx.fillStyle = th.core;
          ctx.fillRect(s.x, s.y, 1, 1);
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = th.outer;
          ctx.fillRect(s.x - 1, s.y, 1, 1);
          ctx.fillRect(s.x + 1, s.y, 1, 1);
          ctx.fillRect(s.x, s.y - 1, 1, 1);
          ctx.fillRect(s.x, s.y + 1, 1, 1);
        }
      }
    }
    ctx.restore();
  }

  function drawSteelBeam(x, y, width) {
    ctx.fillStyle = "#2858b8";
    ctx.fillRect(x, y, width, 6);
    ctx.fillStyle = "#5890f8";
    ctx.fillRect(x, y, width, 2);
    for (let bx = x; bx < x + width; bx += 16) {
      ctx.fillStyle = "#183070";
      ctx.fillRect(bx + 2, y + 2, 12, 2);
    }
  }

  function ensureMenuCanvasSize() {
    if (canvas.width !== VIEW_W || canvas.height !== VIEW_H) {
      canvas.width = VIEW_W;
      canvas.height = VIEW_H;
      ctx.imageSmoothingEnabled = false;
    }
    canvas.style.aspectRatio = VIEW_W + " / " + VIEW_H;
    screenWrap.style.maxWidth = "512px";
    canvas.style.width = "100%";
  }

  function setScreenMode(nextScreen) {
    appScreen = nextScreen;
    screenFrame = 0;
    menuWaitRelease = true;
    const isPlaying = appScreen === "playing";
    topHud.classList.toggle("hidden", !isPlaying);
    controlsArea.classList.toggle("hidden", !isPlaying);
    if (!isPlaying) {
      nesPad.resetInputs();
      ensureMenuCanvasSize();
    } else {
      refreshTopHud();
    }
  }

  function applyPlayZoom() {
    if (!world) return;
    screenWrap.style.maxWidth = Math.max(512, world.worldWidth * 2) + "px";
    canvas.style.width = "100%";
  }

  function getPlayBits() {
    let b = nesPad.getBits() | keyBits;
    if ((b & (LEFT | RIGHT)) === (LEFT | RIGHT)) b &= ~(LEFT | RIGHT);
    if ((b & (UP | DOWN)) === (UP | DOWN)) b &= ~(UP | DOWN);
    return b;
  }

  function startNormalOrChallengeStage(stageNum) {
    const cfg = NORMAL_STAGES[stageNum] || NORMAL_STAGES[String(stageNum)];
    if (!cfg) return;
    currentStage = stageNum;
    isBonusBattle = false;
    bonusLifeAwarded = false;
    world = new GameWorld({
      stageNumber: stageNum,
      cols: cfg.cols,
      rows: cfg.rows,
      tiles: cfg.tiles,
      timedBombs: cfg.timedBombs,
      timedBombSec: cfg.timedBombSec,
      player: cfg.player,
      hunter: cfg.hunter,
      enemies: cfg.enemies,
      orb: cfg.orb,
      orbFast: cfg.orbFast,
      soundEngine: null
    });
    const bitsNow = getPlayBits();
    world.player.prevHammer = (bitsNow & HAMMER) !== 0;
    resultHammerWaitPrev = (bitsNow & HAMMER) !== 0;
    setScreenMode("playing");
    applyPlayZoom();
    renderer.resetCamera(world);
    refreshTopHud();
  }

  function startBattleStage(opts) {
    const o = opts || {};
    isBonusBattle = !!o.isBonusBattle;
    pendingNextStage = o.pendingNextStage || 1;
    bonusLifeAwarded = false;
    const cfg = generateBattleStage();
    world = new GameWorld({
      stageNumber: 1,
      cols: cfg.cols,
      rows: cfg.rows,
      tiles: cfg.tiles,
      player: cfg.player,
      hunter: cfg.hunter,
      enemies: cfg.enemies,
      orb: false,
      isBattleMode: true,
      soundEngine: null
    });
    const bitsNow = getPlayBits();
    world.player.prevHammer = (bitsNow & HAMMER) !== 0;
    resultHammerWaitPrev = (bitsNow & HAMMER) !== 0;
    setScreenMode("playing");
    applyPlayZoom();
    renderer.resetCamera(world);
    refreshTopHud();
  }

  function startChallengeMode() {
    playType = "challenge";
    lives = CHALLENGE_INITIAL_LIVES;
    clearStreak = 0;
    startNormalOrChallengeStage(1);
  }

  function startNormalStage(stageNum) {
    playType = "normal";
    clearStreak = 0;
    startNormalOrChallengeStage(stageNum);
  }

  function startEndlessBattleMode() {
    playType = "battle";
    clearStreak = 0;
    startBattleStage({ isBonusBattle: false });
  }

  function goToTitle() {
    world = null;
    titleCursor = 0;
    setScreenMode("title");
  }

  function goToSelect() {
    world = null;
    selectCursor = 0;
    setScreenMode("select");
  }

  function goToGameOver() {
    world = null;
    overCursor = 0;
    setScreenMode("gameover");
  }

  function goToEnding() {
    world = null;
    setScreenMode("ending");
  }

  function handleRetryButton() {
    if (appScreen === "gameover") {
      startChallengeMode();
      return;
    }
    if (appScreen !== "playing" || !world) return;
    if (world.stageCleared) return;
    if (world.battleManager && world.battleManager.ended) return;
    if (playType === "challenge") {
      lives -= 1;
      if (lives <= 0) {
        lives = 0;
        goToGameOver();
        return;
      }
    }
    if (world.isBattleMode) {
      startBattleStage({ isBonusBattle, pendingNextStage });
    } else {
      startNormalOrChallengeStage(currentStage);
    }
  }

  function finishBattleAndProceed() {
    if (isBonusBattle) {
      startNormalOrChallengeStage(pendingNextStage);
    } else {
      startBattleStage({ isBonusBattle: false });
    }
  }

  function handleStageClearFinished() {
    if (currentStage >= DEMO_MAX_STAGE) {
      goToEnding();
      return;
    }
    clearStreak += 1;
    const nextStage = currentStage + 1;
    if (clearStreak > 0 && clearStreak % 5 === 0) {
      startBattleStage({ isBonusBattle: true, pendingNextStage: nextStage });
    } else {
      startNormalOrChallengeStage(nextStage);
    }
  }

  const TITLE_BUTTONS = [

  const ENDING_TITLE_BTN = { label: "TITLE", y: 204, hit: { x: 72, y: 196, w: 112, h: 26 } };

      if (pImg) ctx.drawImage(pImg, 102, drawBaseY);

    if (renderer.droneSprites && renderer.droneSprites.normalFront) {

      const dImg = renderer.droneSprites.normalFront[dPose] || renderer.droneSprites.normalFront.idle_L;
      if (dImg) ctx.drawImage(dImg, 142, drawBaseY);

    drawDotText(ctx, ENDING_TITLE_BTN.label, VIEW_W / 2, ENDING_TITLE_BTN.y, {
      scale: 2,

    });
    const labelW = (ENDING_TITLE_BTN.label.length * 8 - 1) * 2;
    drawDotText(ctx, ">", Math.round(VIEW_W / 2 - labelW / 2 - 18), ENDING_TITLE_BTN.y, {
